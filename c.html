<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2B Winkel — collectie</title>
<meta name="theme-color" content="#0d0f0e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230D0F0E'/><text x='50' y='68' font-size='52' font-weight='bold' text-anchor='middle' fill='%232FBF71' font-family='sans-serif'>G2</text></svg>">
<style>
:root{
  --bg:#0a0c0b; --panel:#141816; --panel2:#1c221e; --line:#26302a;
  --txt:#eef4f0; --dim:#93a69b; --accent:#2fbf71; --accent2:#1d7a48;
  --glow:rgba(47,191,113,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:
  radial-gradient(1200px 500px at 50% -200px, var(--glow), transparent 70%),
  var(--bg);
  color:var(--txt);
  font:15px/1.6 'Segoe UI',system-ui,sans-serif;min-height:100vh}
.top{max-width:980px;margin:0 auto;padding:18px 16px 0}
.terug{color:var(--dim);text-decoration:none;font-size:13px}
.terug:hover{color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:16px 16px 70px}
h1{font-size:26px;font-weight:800}
.h1sub{color:var(--dim);font-size:13px;margin:2px 0 20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700;text-decoration:none}
.tab.on{border-color:var(--accent);color:var(--accent)}
.tab:hover{color:var(--txt)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.k{background:linear-gradient(180deg,var(--panel2) 0%,var(--panel) 100%);
  border:1px solid var(--line);border-radius:16px;padding:14px;
  text-decoration:none;color:var(--txt);display:block;
  transition:transform .18s ease,border-color .2s,box-shadow .25s}
.k:hover{border-color:var(--accent2);transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.k img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
  background:#000;border:1px solid var(--line);display:block}
.k .t{font-weight:700;font-size:14px;margin-top:10px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k .b{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#111;font-size:10px;font-weight:800;padding:1px 8px;border-radius:12px;margin-left:6px}
.k .p{color:var(--accent);font-weight:800;font-size:14px;margin-top:4px}
.k .d{color:var(--dim);font-size:12px;margin-top:4px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.leeg{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:30px;text-align:center;color:var(--dim)}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><a class="terug" href="index.html">← terug naar de winkel</a></div>
<main id="app"><div class="leeg">laden…</div></main>
<script src="cookie.js" defer></script>
<script>
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
// Collecties zoals Cymatics' /collections/<naam>
const COLS={
  plugins:  {t:"G2B Plugins",        sub:"VST/CLAP tools voor je DAW — eenmalige prijs, geen abonnement",
             f:p=>p.groep==="plugins"},
  apps:     {t:"Tools & Apps",       sub:"Browser-tools en apps — sommige direct in de browser te gebruiken",
             f:p=>p.groep==="apps"||p.groep==="studio-tools"},
  packs:    {t:"Sound Packs",        sub:"Eigen one-shots en FX — klaar voor je sampler",
             f:p=>["soundpacks","gratis"].includes(p.groep)},
  beats:    {t:"Beats",              sub:"Klaar om op te schrijven — MP3, WAV+stems of exclusief",
             f:p=>p.soort==="audio"},
  bundels:  {t:"Bundels",            sub:"Alles samen voor minder — de beste deals",
             f:p=>p.groep==="bundels"},
  alles:    {t:"Alle producten",     sub:"De hele G2B-catalogus",
             f:p=>!["femina","steun"].includes(p.groep)},
};
async function main(){
  const g=(new URLSearchParams(location.search).get("g")||"alles").toLowerCase();
  const col=COLS[g]||COLS.alles;
  const r=await fetch("products.json");const d=await r.json();
  const prods=(d.producten||[]).filter(x=>!x.verborgen).filter(col.f);
  document.title="G2B — "+col.t;
  const app=document.getElementById("app");
  const tabs=Object.entries(COLS).map(([k,c])=>
    `<a class="tab${k===g?" on":""}" href="c.html?g=${k}">${c.t}</a>`).join("");
  app.innerHTML=`<h1>${esc(col.t)}</h1><div class="h1sub">${esc(col.sub)} · ${prods.length} product${prods.length===1?"":"en"}</div>
  <div class="tabs">${tabs}</div>
  ${prods.length?`<div class="grid">${prods.map(p=>`
    <a class="k" href="p.html?id=${esc(p.id)}">
      ${p.cover?`<img src="${esc(p.cover)}" alt="" loading="lazy">`:""}
      <div class="t">${esc(p.titel)}${p.badge?`<span class="b">${esc(p.badge)}</span>`:""}</div>
      ${p.prijs?`<div class="p">${esc(p.prijs)}</div>`:""}
      ${p.beschrijving?`<div class="d">${esc(p.beschrijving)}</div>`:""}
    </a>`).join("")}</div>`:`<div class="leeg">Nog niets in deze collectie.</div>`}`;
}
main();
</script>
</body>
</html>
