<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beatmaker Basis — je eerste beat in 7 lessen — G2B Les-Fabriek</title>
<style>
:root{--bg:#0d0f0e;--panel:#141815;--line:#263028;--txt:#eef4f0;--dim:#93a69b;--accent:#2fbf71;--gold:#e8c547}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#101512 0%,var(--bg) 100%);color:var(--txt);font:15px/1.65 'Segoe UI',system-ui,sans-serif;min-height:100vh}
.top{position:sticky;top:0;background:#101512ee;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;z-index:5;backdrop-filter:blur(6px)}
.top h1{font-size:17px;margin:0;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:12px;color:var(--dim);white-space:nowrap}
.badge b{color:var(--gold)}
.bar{flex:1;height:8px;background:#1c231e;border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));width:0%;transition:width .3s}
.layout{display:flex;min-height:calc(100vh - 53px)}
nav{width:230px;min-width:230px;border-right:1px solid var(--line);padding:12px 10px;background:#0f1311}
nav a{display:block;color:var(--dim);text-decoration:none;padding:9px 10px;border-radius:8px;font-size:13.5px;border-left:3px solid transparent;margin-bottom:2px}
nav a:hover{color:var(--txt);background:#172019}
nav a.act{color:var(--txt);background:#172019;border-left-color:var(--accent);font-weight:600}
nav a.done{color:var(--accent)}
nav a.done::after{content:" ✓";color:var(--accent)}
main{flex:1;padding:22px 26px 60px;max-width:820px}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:20px}
h2{color:var(--gold);margin:4px 0 12px;font-size:22px}
h3{color:var(--accent);margin:18px 0 8px}
main img{max-width:100%;border-radius:10px;margin:10px 0}
audio{width:100%;margin:8px 0 14px;height:36px}
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0}
.quiz .q{font-weight:700;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:#172019;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--accent)}
.opt.goed{border-color:var(--accent);background:#0f2a1b;color:var(--accent);font-weight:700}
.opt.fout{border-color:#bf2f2f;background:#2a1212;color:#e08f8f}
.fb{font-size:13px;margin-top:8px;color:var(--dim)}
.btn{background:var(--accent);color:#04120a;border:0;border-radius:9px;padding:11px 22px;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btnrow{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.diploma{display:none;text-align:center;padding:40px 20px}
.diploma .cert{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:34px 26px;max-width:520px;margin:0 auto}
.diploma h2{font-size:26px}
.klein{color:var(--dim);font-size:13px}
@media (max-width:720px){nav{display:none}main{padding:16px}}
.mobinav{display:none}
@media (max-width:720px){.mobinav{display:block;margin-bottom:14px}.mobinav select{width:100%;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px}}
</style>
</head>
<body>
<div class="top">
  <h1 id="t"></h1>
  <div class="bar"><i id="prog"></i></div>
  <div class="badge">Score <b id="score">0</b>/<span id="max">0</span></div>
</div>
<div class="layout">
<nav id="nav"></nav>
<main>
  <div class="mobinav"><select id="lespick" onchange="toon(this.value)"></select></div>
  <div id="intro" class="intro"></div>
  <div id="les"></div>
  <div id="diploma" class="diploma"><div class="cert">
    <div style="font-size:44px">🏆</div>
    <h2>Gefeliciteerd!</h2>
    <p id="diptext"></p>
    <p class="klein">G2B Les-Fabriek — gemaakt door <span id="maker"></span></p>
  </div></div>
</main>
</div>
<script>
const D = {"slug": "beatmaker-basis", "title": "Beatmaker Basis — je eerste beat in 7 lessen", "intro": "Van nul naar je eigen complete beat. Geen dure apparatuur nodig — alleen je laptop en deze cursus. Elke les heeft een geluidsvoorbeeld om te luisteren, een doe-opdracht en een korte quiz (21 vragen totaal).", "maker": "Good2Better", "lessons": [{"idx": 1, "title": "Wat is een beat eigenlijk?", "body": "<p>Een beat is de ritmische basis van een nummer: drums + bas + melodie die samen de groove vormen waarop iemand rapt, zingt of danst.<\/p>\n<h3>Luister eerst<\/h3>\n<p>Het voorbeeld hierboven is een complete mini-beat (140 BPM, C-mineur). Luister 3x: eerst alleen naar de drums, dan alleen naar de diepe bas, dan alleen naar het melodietje bovenin.<\/p>\n<h3>De 4 bouwstenen<\/h3>\n<ul><li>Drums: kick (laag, de 'boem'), snare (de 'klap'), hihats (de 'tikitiki')<\/li><li>Bas / 808: de laagste noot — geeft de beat gewicht, volgt meestal de kick<\/li><li>Melodie: het stukje dat je onthoudt en meezingt<\/li><li>Ruimte: wat je WEGlaat is net zo belangrijk als wat je erin zet<\/li><\/ul>\n<h3>Zo denkt een producer<\/h3>\n<ul><li>Elke laag heeft één taak — twee lagen met dezelfde taak = rommel<\/li><li>Een beat met 4 goede lagen klinkt beter dan één met 15 middelmatige<\/li><li>Begin klein: één maat (4 tellen) die lekker loopt<\/li><\/ul>\n<h3>Doe-opdracht<\/h3>\n<p>Pak 3 beats die jij mooi vindt. Schrijf per beat op: welke drums hoor je, is er een 808, wat doet de melodie? Zo train je je oren.<\/p>", "quiz": [{"q": "Welke laag zorgt voor de 'klap' in de beat?", "opts": ["Kick", "Snare", "Hihat", "Bas"], "answer": 1}, {"q": "Wat is minstens zo belangrijk als wat je in een beat stopt?", "opts": ["Volume", "Ruimte/weglaten", "Tempo", "Effecten"], "answer": 1}, {"q": "Wat is het beste begin voor een beginner?", "opts": ["15 lagen tegelijk", "Eén maat met 4 goede lagen", "Eerst de mix", "Eerst de titel"], "answer": 1}], "audio": "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPA VVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/+4LEsoAiefcUOdyAAAAANIOAAARVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=", "image": ""}, {"idx": 2, "title": "Tempo en gevoel — BPM kiezen", "body": "<p>BPM = beats per minute = hoeveel tellen er in één minuut zitten. Het tempo bepaalt voor een groot deel het gevoel van je beat.<\/p>\n<h3>Genre-richtlijnen (vuistregels)<\/h3>\n<ul><li>Boom bap / lo-fi: 80-95 BPM — relaxed, knikkend hoofd<\/li><li>RnB: 95-110 BPM — smooth, ruimte voor zang<\/li><li>Afro / dembow: 95-115 BPM — dansbaar, swingend<\/li><li>House / EDM: 120-128 BPM — vier-op-de-vloer<\/li><li>Trap / drill: 130-150 BPM — voelt als de helft (half-time)<\/li><li>Kawina / bubbling: 140+ BPM — snel en rollend<\/li><\/ul>\n<h3>Wat is half-time?<\/h3>\n<p>Trap staat op 140 BPM, maar de snare valt maar 1x per maat (op tel 3). Daardoor voelt het als 70 BPM: je hoofd knikt langzaam, maar de hihats rennen snel. Die combinatie = het trap-gevoel. Hoor het in het voorbeeld van les 1.<\/p>\n<h3>Doe-opdracht<\/h3>\n<p>Zet een metronoom op 90, dan 140. Tik met je hand mee. Welke voelt rustiger? Kies het tempo bij de sfeer die jij wil — niet andersom.<\/p>", "quiz": [{"q": "Welk tempo-gebied past bij trap?", "opts": ["80-95", "95-110", "130-150", "170-180"], "answer": 2}, {"q": "Waar staat BPM voor?", "opts": ["Beats per maat", "Beats per minute", "Bass per maat", "Bass per minuut"], "answer": 1}, {"q": "Waarom voelt trap op 140 BPM toch rustig?", "opts": ["De kick is zacht", "Half-time: de snare valt 1x per maat", "Er zijn geen hihats", "Het staat eigenlijk op 70"], "answer": 1}], "audio": "", "image": ""}, {"idx": 3, "title": "Drums bouwen — kick, snare, hihat", "body": "<p>Start ALTIJD met de drums. Ze zijn het skelet van je beat.<\/p>\n<h3>Luister: trap-drumpatroon<\/h3>\n<p>In het voorbeeld hoor je: kick op een huppelend patroon, snare op tel 3 (half-time), hihats op 8e noten — en in de laatste maat een hihat-roll (snelle 16e tikjes) als overgang.<\/p>\n<h3>Stap voor stap<\/h3>\n<ul><li>Snare eerst: tel 2 en 4 (boom bap/pop) of tel 3 (trap/drill half-time)<\/li><li>Kick eromheen: tel 1 vast, daarna op plekken waar het 'loopt' — tussen de snares<\/li><li>Hihats op 8e noten voor drive; 16e voor nog meer energie<\/li><li>Pas DAARNA variatie: hat-roll aan het eind van 4 maten, een extra kick, open hat<\/li><\/ul>\n<h3>Veelgemaakte fouten<\/h3>\n<ul><li>Kick en snare precies tegelijk — dan vechten ze, de klap verdwijnt<\/li><li>Alle hihats even hard — laat er om-en-om eentje zachter (geeft groove)<\/li><li>Elke maat anders — herhaling is juist wat een groove maakt<\/li><\/ul>\n<h3>Doe-opdracht<\/h3>\n<p>Bouw 1 maat: snare op 3, kick op 1 en nog 2 plekken naar keuze, hats op elke 8e. Herhaal 4x en zet in maat 4 een hat-roll.<\/p>", "quiz": [{"q": "Waar leg je de snare bij een basis-beat?", "opts": ["Tel 1 en 3", "Tel 2 en 4", "Elke tel", "Alleen tel 1"], "answer": 1}, {"q": "Wat is de beste werkwijze?", "opts": ["Eerst 8 maten tegelijk maken", "Eerst 1 maat perfect, dan herhalen", "Eerst de melodie", "Willekeurig plaatsen"], "answer": 1}, {"q": "Wat hoor je in de laatste maat van het voorbeeld?", "opts": ["Een gitaar", "Een hihat-roll als overgang", "Stilte", "Een tweede snare-laag"], "answer": 1}], "audio": "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//uAwAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAEbAAGVtgADBgkLDhASFRgbHR8iJCcqLS4xNDY5PD5AQ0ZJS01QUlVYW1xfYmRnamxucXR2eXt+gIOGiIqNkJKVl5qcn6KkpqmsrrG0tri7vsDDxcjKzdDS1Nfa3N/i5Obp7O7x8/b4+/4AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAPeAAAAAAABlbYlJ47KAAAAAAAAAAAAAAAAAAAAAAA qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqo=", "image": ""}, {"idx": 4, "title": "De 808 / bas-lijn", "body": "<p>De bas (of 808) is wat een beat 'dik' maakt. Een 808 is een lange, diepe toon met een klap aan het begin — oorspronkelijk van de Roland TR-808 drumcomputer, nu dé bas van trap, drill en afro.<\/p>\n<h3>Luister: 808 volgt de kick<\/h3>\n<p>In het voorbeeld speelt alleen kick + 808. Hoor hoe elke bas-noot precies samen met de kick begint — en hoe de noot soms omhoog of omlaag 'glijdt' naar de volgende (glide).<\/p>\n<h3>Regels die werken<\/h3>\n<ul><li>Volg de kick: speel bas-noten op dezelfde momenten<\/li><li>Weinig noten: 2-6 per maat is genoeg<\/li><li>Blijf in de toonsoort van je melodie (les 5) — de grondtoon (bijv. C) het meest<\/li><li>Glide/slide tussen noten = typisch trap- en drill-geluid<\/li><li>Lange 808 = laat hem uitklinken tot vlak voor de volgende noot<\/li><\/ul>\n<h3>Veelgemaakte fouten<\/h3>\n<ul><li>808 in een andere toonsoort dan de melodie — klinkt 'vals' maar je hoort niet waarom<\/li><li>Kick én 808 allebei heel lang en hard — dan wordt het laag een modderpoel<\/li><li>Te hoge 808-noten — onder C3 blijven werkt bijna altijd<\/li><\/ul>\n<h3>Doe-opdracht<\/h3>\n<p>Zet je bas uit en weer aan. Mist de beat kracht zonder? Dan doet hij zijn werk.<\/p>", "quiz": [{"q": "Wat volgt de bas-lijn meestal?", "opts": ["De hihat", "De snare", "De kick", "De melodie"], "answer": 2}, {"q": "Hoeveel bas-noten per maat is een goed begin?", "opts": ["8-16", "2-4", "1", "20+"], "answer": 1}, {"q": "Wat is een 'glide' bij een 808?", "opts": ["Een echo-effect", "Een noot die naar de volgende toon glijdt", "Een hihat-roll", "Een hardere kick"], "answer": 1}], "audio": "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//uAwAAAAAAAAAAAAAAAAAAAA const KEY = 'g2b_les_' + D.slug;
let state = {}; try{ state = JSON.parse(localStorage.getItem(KEY)||'{}') }catch(e){}
let cur = 0;
const nLes = D.lessons.length;
const maxScore = D.lessons.reduce((s,l)=>s+l.quiz.length,0);
document.getElementById('max').textContent = maxScore;
document.getElementById('maker').textContent = D.maker;
document.getElementById('t').textContent = D.title;
document.getElementById('intro').innerHTML = '<b>'+D.title+'</b><br><span class="klein">'+D.intro+'</span>';

function bewaar(){ try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} }
function klaar(i){ return state['les'+i] && state['les'+i].done }
function score(){ return Object.values(state).reduce((s,l)=>s+(l.score||0),0) }
function nav(){
  let h='';
  D.lessons.forEach((l,i)=>{
    h += '<a href="#" class="'+(i===cur?'act ':'')+(klaar(i)?'done':'')+'" onclick="toon('+i+');return false">'+l.idx+'. '+l.title+'</a>';
  });
  document.getElementById('nav').innerHTML = h;
  let sel = document.getElementById('lespick'); sel.innerHTML='';
  D.lessons.forEach((l,i)=>{ sel.innerHTML += '<option value="'+i+'"'+(i===cur?' selected':'')+'>Les '+l.idx+' — '+l.title+'</option>'; });
}
function toon(i){
  cur = i;
  document.getElementById('diploma').style.display='none';
  const l = D.lessons[i];
  let h = '<h2>Les '+l.idx+' — '+l.title+'</h2>';
  if(l.audio) h += '<audio controls src="'+l.audio+'"></audio>';
  if(l.image) h += '<img src="'+l.image+'">';
  h += l.body;
  if(l.quiz.length){
    h += '<div class="quiz"><div class="q">🎯 Quiz — check of je het snapt</div>';
    l.quiz.forEach((q,qi)=>{
      h += '<div style="margin:10px 0 4px;font-weight:600">'+q.q+'</div>';
      q.opts.forEach((o,oi)=>{
        h += '<button class="opt" id="q'+i+'_'+qi+'_'+oi+'" onclick="antw('+i+','+qi+','+oi+','+q.answer+')">'+o+'</button>';
      });
      h += '<div class="fb" id="fb'+i+'_'+qi+'"></div>';
    });
    h += '</div>';
  }
  h += '<div class="btnrow">';
  if(i>0) h += '<button class="btn ghost" onclick="toon('+(i-1)+')">← Vorige</button>';
  if(klaar(i) && i<nLes-1) h += '<button class="btn" onclick="toon('+(i+1)+')">Volgende les →</button>';
  if(!klaar(i)) h += '<button class="btn" onclick="done('+i+')">Les afronden ✓</button>';
  h += '</div>';
  document.getElementById('les').innerHTML = h;
  // beantwoorde quizzen herstellen
  (state['les'+i]&&state['les'+i].antw||[]).forEach((a,qi)=>{
    const q=l.quiz[qi]; markeer(i,qi,a,q.answer);
  });
  nav(); scrollTo(0,0); update();
}
function markeer(i,qi,a,goed){
  const l=D.lessons[i];
  l.quiz[qi].opts.forEach((o,oi)=>{
    const b=document.getElementById('q'+i+'_'+qi+'_'+oi); if(!b)return;
    if(oi===goed) b.className='opt goed';
    else if(oi===a) b.className='opt fout';
    b.disabled=true;
  });
  const fb=document.getElementById('fb'+i+'_'+qi);
  if(fb) fb.textContent = a===goed ? '✓ Goed!' : 'Het goede antwoord staat nu groen.';
}
function antw(i,qi,a,goed){
  const st = state['les'+i] = state['les'+i]||{antw:[],score:0,done:false};
  if(st.antw[qi]!==undefined) return;
  st.antw[qi]=a; if(a===goed) st.score++;
  markeer(i,qi,a,goed); bewaar(); update();
}
function done(i){
  const st = state['les'+i] = state['les'+i]||{antw:[],score:0};
  st.done = true; bewaar(); update();
  if(i===nLes-1 || D.lessons.every((_,j)=>klaar(j))) return eind();
  toon(i+1);
}
function update(){
  document.getElementById('score').textContent = score();
  const pct = Math.round(Object.keys(state).filter(k=>state[k].done).length/nLes*100);
  document.getElementById('prog').style.width = pct+'%';
}
function eind(){
  document.getElementById('les').innerHTML='';
  document.getElementById('diploma').style.display='block';
  document.getElementById('diptext').textContent =
    'Je hebt alle '+nLes+' lessen van “'+D.title+'” afgerond met een score van '+score()+'/'+maxScore+'.';
}
nav(); toon(0);
</script>
