<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les-Fabriek — maak je eigen cursus</title>
<style>
:root{--bg:#0d0f0e;--panel:#141815;--line:#263028;--txt:#eef4f0;--dim:#93a69b;--accent:#2fbf71;--gold:#e8c547}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#101512,var(--bg));color:var(--txt);font:15px/1.6 'Segoe UI',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 80px}
h1{color:var(--accent);font-size:24px;margin:6px 0 4px}
.sub{color:var(--dim);margin-bottom:20px}
.k{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;margin:14px 0}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
input[type=text],textarea,select{width:100%;background:#0f1311;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
.tip{font-size:12px;color:var(--dim);margin-top:4px}
.btn{background:var(--accent);color:#04120a;border:0;border-radius:9px;padding:12px 24px;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);padding:9px 16px;font-size:13.5px}
.btn.del{background:transparent;color:#e08f8f;border:1.5px solid #553;font-size:12px;padding:6px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.lesh{background:#172019;border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.lesn{font-weight:700;color:var(--gold);margin-bottom:8px}
.quizvraag{border-left:3px solid var(--accent);padding:6px 10px;margin:10px 0;background:#0f1311;border-radius:0 8px 8px 0}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.qopts label{font-size:11px}
.goed{accent-color:var(--accent)}
input[type=file]{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>🎓 Les-Fabriek</h1>
<div class="sub">Maak je eigen cursus: lessen met tekst, plaatjes, audio en quizzen. Klik op <b>Maak cursus</b> → je krijgt één bestand dat iedereen offline kan openen.</div>

<div class="k">
<label>Cursus-titel</label><input type="text" id="titel" value="Mijn Cursus">
<label>Korte intro (wat gaat de klant leren?)</label><textarea id="intro" rows="2"></textarea>
<label>Gemaakt door</label><input type="text" id="maker" value="Good2Better">
<label>Bestandsnaam (automatisch)</label><input type="text" id="slug" value="mijn-cursus">
</div>

<div id="lessen"></div>
<button class="btn ghost" onclick="nieuweLes()">+ Les toevoegen</button>
<button class="btn ghost" onclick="vulVoorbeeld()">✨ Vul voorbeeld-cursus</button>
<span class="tip">Klik op ✨ om te zien hoe een les eruit ziet — vervang daarna gewoon de teksten.</span>

<div class="k" style="margin-top:26px">
<button class="btn" onclick="maak()">⬇ Maak cursus &amp; download</button>
<span id="stat" class="tip" style="display:inline-block;margin-left:12px"></span>
</div>
</div>

<script>
const TPL = `<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ — G2B Les-Fabriek</title>
<style>
:root{--bg:#0d0f0e;--panel:#141815;--line:#263028;--txt:#eef4f0;--dim:#93a69b;--accent:#2fbf71;--gold:#e8c547}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#101512 0%,var(--bg) 100%);color:var(--txt);font:15px/1.65 'Segoe UI',system-ui,sans-serif;min-height:100vh}
.top{position:sticky;top:0;background:#101512ee;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;z-index:5;backdrop-filter:blur(6px)}
.top h1{font-size:17px;margin:0;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:12px;color:var(--dim);white-space:nowrap}
.badge b{color:var(--gold)}
.bar{flex:1;height:8px;background:#1c231e;border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));width:0%;transition:width .3s}
.layout{display:flex;min-height:calc(100vh - 53px)}
nav{width:230px;min-width:230px;border-right:1px solid var(--line);padding:12px 10px;background:#0f1311}
nav a{display:block;color:var(--dim);text-decoration:none;padding:9px 10px;border-radius:8px;font-size:13.5px;border-left:3px solid transparent;margin-bottom:2px}
nav a:hover{color:var(--txt);background:#172019}
nav a.act{color:var(--txt);background:#172019;border-left-color:var(--accent);font-weight:600}
nav a.done{color:var(--accent)}
nav a.done::after{content:" ✓";color:var(--accent)}
main{flex:1;padding:22px 26px 60px;max-width:820px}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:20px}
h2{color:var(--gold);margin:4px 0 12px;font-size:22px}
h3{color:var(--accent);margin:18px 0 8px}
main img{max-width:100%;border-radius:10px;margin:10px 0}
audio{width:100%;margin:8px 0 14px;height:36px}
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0}
.quiz .q{font-weight:700;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:#172019;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--accent)}
.opt.goed{border-color:var(--accent);background:#0f2a1b;color:var(--accent);font-weight:700}
.opt.fout{border-color:#bf2f2f;background:#2a1212;color:#e08f8f}
.fb{font-size:13px;margin-top:8px;color:var(--dim)}
.btn{background:var(--accent);color:#04120a;border:0;border-radius:9px;padding:11px 22px;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btnrow{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.diploma{display:none;text-align:center;padding:40px 20px}
.diploma .cert{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:34px 26px;max-width:520px;margin:0 auto}
.diploma h2{font-size:26px}
.klein{color:var(--dim);font-size:13px}
@media (max-width:720px){nav{display:none}main{padding:16px}}
.mobinav{display:none}
@media (max-width:720px){.mobinav{display:block;margin-bottom:14px}.mobinav select{width:100%;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px}}
</style>
</head>
<body>
<div class="top">
  <h1 id="t"></h1>
  <div class="bar"><i id="prog"></i></div>
  <div class="badge">Score <b id="score">0</b>/<span id="max">0</span></div>
</div>
<div class="layout">
<nav id="nav"></nav>
<main>
  <div class="mobinav"><select id="lespick" onchange="toon(this.value)"></select></div>
  <div id="intro" class="intro"></div>
  <div id="les"></div>
  <div id="diploma" class="diploma"><div class="cert">
    <div style="font-size:44px">🏆</div>
    <h2>Gefeliciteerd!</h2>
    <p id="diptext"></p>
    <p class="klein">G2B Les-Fabriek — gemaakt door <span id="maker"></span></p>
  </div></div>
</main>
</div>
<script>
const D = __DATA__;
const KEY = 'g2b_les_' + D.slug;
let state = {}; try{ state = JSON.parse(localStorage.getItem(KEY)||'{}') }catch(e){}
let cur = 0;
const nLes = D.lessons.length;
const maxScore = D.lessons.reduce((s,l)=>s+l.quiz.length,0);
document.getElementById('max').textContent = maxScore;
document.getElementById('maker').textContent = D.maker;
document.getElementById('t').textContent = D.title;
document.getElementById('intro').innerHTML = '<b>'+D.title+'</b><br><span class="klein">'+D.intro+'</span>';

function bewaar(){ try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} }
function klaar(i){ return state['les'+i] && state['les'+i].done }
function score(){ return Object.values(state).reduce((s,l)=>s+(l.score||0),0) }
function nav(){
  let h='';
  D.lessons.forEach((l,i)=>{
    h += '<a href="#" class="'+(i===cur?'act ':'')+(klaar(i)?'done':'')+'" onclick="toon('+i+');return false">'+l.idx+'. '+l.title+'</a>';
  });
  document.getElementById('nav').innerHTML = h;
  let sel = document.getElementById('lespick'); sel.innerHTML='';
  D.lessons.forEach((l,i)=>{ sel.innerHTML += '<option value="'+i+'"'+(i===cur?' selected':'')+'>Les '+l.idx+' — '+l.title+'</option>'; });
}
function toon(i){
  cur = i;
  document.getElementById('diploma').style.display='none';
  const l = D.lessons[i];
  let h = '<h2>Les '+l.idx+' — '+l.title+'</h2>';
  if(l.audio) h += '<audio controls src="'+l.audio+'"></audio>';
  if(l.image) h += '<img src="'+l.image+'">';
  h += l.body;
  if(l.quiz.length){
    h += '<div class="quiz"><div class="q">🎯 Quiz — check of je het snapt</div>';
    l.quiz.forEach((q,qi)=>{
      h += '<div style="margin:10px 0 4px;font-weight:600">'+q.q+'</div>';
      q.opts.forEach((o,oi)=>{
        h += '<button class="opt" id="q'+i+'_'+qi+'_'+oi+'" onclick="antw('+i+','+qi+','+oi+','+q.answer+')">'+o+'</button>';
      });
      h += '<div class="fb" id="fb'+i+'_'+qi+'"></div>';
    });
    h += '</div>';
  }
  h += '<div class="btnrow">';
  if(i>0) h += '<button class="btn ghost" onclick="toon('+(i-1)+')">← Vorige</button>';
  if(klaar(i) && i<nLes-1) h += '<button class="btn" onclick="toon('+(i+1)+')">Volgende les →</button>';
  if(!klaar(i)) h += '<button class="btn" onclick="done('+i+')">Les afronden ✓</button>';
  h += '</div>';
  document.getElementById('les').innerHTML = h;
  // beantwoorde quizzen herstellen
  (state['les'+i]&&state['les'+i].antw||[]).forEach((a,qi)=>{
    const q=l.quiz[qi]; markeer(i,qi,a,q.answer);
  });
  nav(); scrollTo(0,0); update();
}
function markeer(i,qi,a,goed){
  const l=D.lessons[i];
  l.quiz[qi].opts.forEach((o,oi)=>{
    const b=document.getElementById('q'+i+'_'+qi+'_'+oi); if(!b)return;
    if(oi===goed) b.className='opt goed';
    else if(oi===a) b.className='opt fout';
    b.disabled=true;
  });
  const fb=document.getElementById('fb'+i+'_'+qi);
  if(fb) fb.textContent = a===goed ? '✓ Goed!' : 'Het goede antwoord staat nu groen.';
}
function antw(i,qi,a,goed){
  const st = state['les'+i] = state['les'+i]||{antw:[],score:0,done:false};
  if(st.antw[qi]!==undefined) return;
  st.antw[qi]=a; if(a===goed) st.score++;
  markeer(i,qi,a,goed); bewaar(); update();
}
function done(i){
  const st = state['les'+i] = state['les'+i]||{antw:[],score:0};
  st.done = true; bewaar(); update();
  if(i===nLes-1 || D.lessons.every((_,j)=>klaar(j))) return eind();
  toon(i+1);
}
function update(){
  document.getElementById('score').textContent = score();
  const pct = Math.round(Object.keys(state).filter(k=>state[k].done).length/nLes*100);
  document.getElementById('prog').style.width = pct+'%';
}
function eind(){
  document.getElementById('les').innerHTML='';
  document.getElementById('diploma').style.display='block';
  document.getElementById('diptext').textContent =
    'Je hebt alle '+nLes+' lessen van “'+D.title+'” afgerond met een score van '+score()+'/'+maxScore+'.';
}
nav(); toon(0);
<\/script>
</body>
</html>
`;
const lessen = [];
function rid(){return 'l'+Math.random().toString(36).slice(2,8)}
function el(id){return document.getElementById(id)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function nieuweLes(){
  const les={id:rid(),titel:'',tekst:'',image:'',audio:'',quiz:[]};
  lessen.push(les); render();
}
function vulVoorbeeld(){
  el('titel').value='Beatmaker Basis';
  el('slug').value='beatmaker-basis';
  el('intro').value='Leer in 7 lessen je eerste beat maken: drums, 808, melodie, structuur en mixen — zonder dure spullen.';
  lessen.length=0;
  lessen.push({id:rid(),titel:'Waar een beat uit bestaat',tekst:'## De 4 bouwstenen\n- Drums: het ritme en de energie\n- Bass/808: het gewicht onderin\n- Melodie: het gedeelte dat blijft hangen\n- FX: overgangen en spanning\n\n## Luister eerst\nPak een beat die je mooi vindt en tel hoe vaak de drums herhalen voor er iets verandert. Bijna elke beat wisselt elke 4 of 8 bars iets.',image:'',audio:'',quiz:[{q:'Welke laag geeft een beat zijn gewicht?',opts:['Melodie','808/bass','FX','Hihats'],answer:1},{q:'Hoe vaak verandert er meestal iets in een beat?',opts:['Elke bar','Elke 4 of 8 bars','Elke 32 bars','Nooit'],answer:1}]});
  lessen.push({id:rid(),titel:'Je eerste drum-patroon',tekst:'## Stappen\n- Zet je BPM op 140 (trap) of 90 (boombap)\n- Kick op tel 1 en de & van 3\n- Snare op 2 en 4\n- Hihat elke tel, sommige dubbel\n\nSpeel hem 8 bars en voeg in bar 8 één extra snare toe als fill.',image:'',audio:'',quiz:[{q:'Waar staat de snare in een basis-patroon?',opts:['Tel 1 en 3','Tel 2 en 4','Overal','Alleen bar 8'],answer:1}]});
  render();
  el('stat').textContent='Voorbeeld geladen — pas de teksten aan naar jouw stijl.';
}
function nieuweVraag(les){ les.quiz.push({q:'',opts:['','','',''],answer:0}); render(); }
function wis(i){ lessen.splice(i,1); render(); }
function wisQ(l,q){ l.quiz.splice(q,1); render(); }

function fileToURI(file,cb){
  const r=new FileReader();
  r.onload=()=>{
    if(file.type.startsWith('image/')){
      const im=new Image();
      im.onload=()=>{
        const w=Math.min(640,im.width),h=Math.round(im.height*w/im.width);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        cb(c.toDataURL('image/jpeg',.72));
      };
      im.src=r.result;
    } else cb(r.result);
  };
  r.readAsDataURL(file);
}

function render(){
  const box=el('lessen');box.innerHTML='';
  lessen.forEach((les,i)=>{
    const d=document.createElement('div');d.className='lesh';
    d.innerHTML=`<div class="lesn">Les ${i+1}</div>
    <label>Titel van de les</label><input type="text" value="${esc(les.titel)}" oninput="lessen[${i}].titel=this.value">
    <label>Les-tekst — gebruik <b>## kopje</b> voor tussenkoppen en <b>- punt</b> voor lijstjes</label>
    <textarea oninput="lessen[${i}].tekst=this.value">${esc(les.tekst)}</textarea>
    <div class="row">
      <div><label>Plaatje (optioneel)</label><input type="file" accept="image/*" onchange="fileToURI(this.files[0],u=>lessen[${i}].image=u)"></div>
      <div><label>Audio (optioneel)</label><input type="file" accept="audio/*" onchange="fileToURI(this.files[0],u=>lessen[${i}].audio=u)"></div>
    </div>
    <div class="quizv"></div>
    <div class="row"><button class="btn ghost" onclick="nieuweVraag(lessen[${i}])">+ Quizvraag</button>
    <button class="btn del" onclick="wis(${i})">les wissen</button></div>`;
    const qv=d.querySelector('.quizv');
    les.quiz.forEach((q,qi)=>{
      const qd=document.createElement('div');qd.className='quizvraag';
      let opts='';
      q.opts.forEach((o,oi)=>{
        opts+=`<div><label>optie ${oi+1} <input type="radio" class="goed" name="g${les.id}${qi}" ${q.answer===oi?'checked':''} onchange="lessen[${i}].quiz[${qi}].answer=${oi}"> goed?</label>
        <input type="text" value="${esc(o)}" oninput="lessen[${i}].quiz[${qi}].opts[${oi}]=this.value"></div>`;
      });
      qd.innerHTML=`<label>Quizvraag ${qi+1}</label><input type="text" value="${esc(q.q)}" oninput="lessen[${i}].quiz[${qi}].q=this.value">
      <div class="qopts">${opts}</div>
      <button class="btn del" style="margin-top:6px" onclick="wisQ(lessen[${i}],${qi})">vraag wissen</button>`;
      qv.appendChild(qd);
    });
    box.appendChild(d);
  });
}

function lesBody(tekst){
  const delen=[],ul=[];
  const flush=()=>{if(ul.length){delen.push('<ul>'+ul.map(i=>'<li>'+i+'</li>').join('')+'</ul>');ul.length=0}};
  (tekst||'').split(/\n\n/).forEach(blok=>{
    blok.split('\n').forEach(r=>{
      r=r.trim();if(!r)return;
      if(r.startsWith('## ')){flush();delen.push('<h3>'+esc(r.slice(3))+'</h3>')}
      else if(r.startsWith('- ')){ul.push(esc(r.slice(2)))}
      else{flush();delen.push('<p>'+esc(r)+'</p>')}
    });
  });
  flush();
  return delen.join('\n');
}

function maak(){
  const data={
    slug:(el('slug').value||'cursus').toLowerCase().replace(/[^a-z0-9-]/g,'-'),
    title:el('titel').value||'G2B Cursus',
    intro:el('intro').value,
    maker:el('maker').value||'Good2Better',
    lessons:lessen.map((l,i)=>({idx:i+1,title:l.titel||('Les '+(i+1)),body:lesBody(l.tekst),audio:l.audio,image:l.image,quiz:l.quiz.filter(q=>q.q.trim()).map(q=>({q:q.q,opts:q.opts,answer:q.answer}))}))
  };
  if(!data.lessons.length){alert('Voeg eerst een les toe');return}
  const js=JSON.stringify(data).replace(/<\//g,'<\\/');
  const html=TPL.replace('__DATA__',()=>js).replace('__TITLE__',()=>esc(data.title));
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=data.slug+'-cursus.html';a.click();
  el('stat').textContent='Klaar — '+data.lessons.length+' lessen, '+(Math.round(blob.size/1024))+' KB gedownload.';
}
render();
</script>
</body>
</html>
