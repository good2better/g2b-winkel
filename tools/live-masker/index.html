<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2B LIVE-MASKER — word een karakter, live in je browser</title>
<style>
  body{margin:0;background:#060a08;color:#e8f5ee;font-family:system-ui,sans-serif;text-align:center}
  h1{font-size:22px;margin:14px 0 4px}
  h1 b{color:#2fbf71}
  .sub{opacity:.75;font-size:13px;margin-bottom:12px}
  #stage{position:relative;display:inline-block;border-radius:14px;overflow:hidden;background:#000;max-width:94vw}
  canvas{display:block;max-width:94vw;max-height:62vh}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  button{padding:10px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}
  .kar{background:#122019;border:2px solid #2f5b41;color:#e8f5ee}
  .kar.act{border-color:#2fbf71;background:#1b3527}
  #rec{background:#2fbf71;color:#04120a}
  #rec.stop{background:#e5484d;color:#fff}
  #start{background:#2fbf71;color:#04120a;font-size:17px;padding:14px 30px}
  #status{font-size:13px;opacity:.8;min-height:18px}
  .foot{font-size:11px;opacity:.55;margin:14px}
  #laden{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);font-size:15px}
</style>
</head>
<body>
<h1>🎭 G2B <b>LIVE-MASKER</b></h1>
<div class="sub">word een karakter — live in je browser · neem direct een filmpje op · 100% lokaal, je beeld gaat nergens heen</div>
<div class="row" id="kars" style="display:none">
  <button class="kar act" data-k="kat">🐱 Kat</button>
  <button class="kar" data-k="robot">🤖 Robot</button>
  <button class="kar" data-k="uil">🦉 Uil</button>
</div>
<div id="stage">
  <canvas id="cv" width="960" height="720"></canvas>
  <div id="laden">even laden…</div>
</div>
<div class="row" id="extra" style="display:none">
  <label style="padding:10px 14px;background:#122019;border:2px solid #2f5b41;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px">📁 eigen karakter<input type="file" id="up" accept="image/png,image/webp" style="display:none"></label>
  <button id="snap" style="background:#122019;border:2px solid #2f5b41;color:#e8f5ee">📸 foto</button>
</div>
<div class="row" id="sliders" style="display:none;font-size:12px;opacity:.9">
  <label>grootte <input type="range" id="sc" min="1.8" max="5" step="0.1" value="3.1" style="width:90px"></label>
  <label>omhoog <input type="range" id="up2" min="0" max="0.7" step="0.02" value="0.28" style="width:90px"></label>
</div>
<div class="row">
  <button id="start">📷 START JE WEBCAM</button>
  <button id="rec" style="display:none">⏺ NEEM OP</button>
</div>
<div id="status"></div>
<div class="foot">G2B Live-Masker · gezichts-tracking via MediaPipe (Apache-2.0) · alles draait in je eigen browser — geen upload, geen cloud</div>

<script src="/js/g2b-gate.js" data-tier="leden"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const KARS={kat:new Image(),robot:new Image(),uil:new Image()};
KARS.kat.src='kat.png';KARS.robot.src='robot.png';KARS.uil.src='uil.png';
let kar='kat',fm=null,running=false,sm=null,micLevel=0,recorder=null,chunks=[];
// zachte beweging (lerp) — verbetering: geen schokkerig masker
function lerp(a,b,t){return a+(b-a)*t}

async function startFM(){
  fm=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/'+f});
  fm.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
  fm.onResults(onFace);
  document.getElementById('laden').style.display='none';
}

document.getElementById('start').onclick=async()=>{
  document.getElementById('status').textContent='webcam starten…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:960,height:720},audio:true});
    vid.srcObject=stream;await vid.play();
    // microfoon-niveau voor lip-beweeg (verbetering t.o.v. niets)
    const ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=256;
    ac.createMediaStreamSource(stream).connect(an);
    const buf=new Uint8Array(an.frequencyBinCount);
    (function mic(){an.getByteTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s=Math.max(s,Math.abs(buf[i]-128));micLevel=lerp(micLevel,Math.min(1,s/50),.25);requestAnimationFrame(mic)})();
    window._stream=stream;
    await startFM();
    running=true;loop();
    document.getElementById('start').style.display='none';
    document.getElementById('rec').style.display='';
    document.getElementById('kars').style.display='flex';
    document.getElementById('extra').style.display='flex';
    document.getElementById('sliders').style.display='flex';
    document.getElementById('status').textContent='';
  }catch(e){document.getElementById('status').textContent='geen webcam-toestemming — klik opnieuw en kies toestaan';}
};

async function loop(){
  if(!running)return;
  if(vid.readyState>=2&&fm){await fm.send({image:vid});}
  requestAnimationFrame(loop);
}

function onFace(res){
  // teken webcam (gespiegeld, voelt natuurlijk)
  cx.save();cx.clearRect(0,0,cv.width,cv.height);
  cx.translate(cv.width,0);cx.scale(-1,1);
  cx.drawImage(vid,0,0,cv.width,cv.height);
  const lm=res.multiFaceLandmarks&&res.multiFaceLandmarks[0];
  if(lm){
    // kernpunten: 10=top voorhoofd, 152=kin, 33=linkeroog, 263=rechteroog (in beeld-coords)
    const W=cv.width,H=cv.height;
    const x=i=>lm[i].x*W,y=i=>lm[i].y*H;
    const cxF=(x(33)+x(263))/2,cyF=(y(33)+y(263))/2;
    const faceW=Math.hypot(x(263)-x(33),y(263)-y(33));
    const hoek=Math.atan2(y(263)-y(33),x(263)-x(33));
    // lerp-smoothing
    const tgt={x:cxF,y:cyF,w:faceW,r:hoek};
    sm=sm?{x:lerp(sm.x,tgt.x,.35),y:lerp(sm.y,tgt.y,.35),w:lerp(sm.w,tgt.w,.35),r:lerp(sm.r,tgt.r,.35)}:tgt;
    const img=KARS[kar];
    if(img.complete&&img.naturalWidth){
      const kw=sm.w*parseFloat(document.getElementById("sc").value),kh=kw*img.naturalHeight/img.naturalWidth;
      cx.save();
      cx.translate(sm.x,sm.y-kh*parseFloat(document.getElementById("up2").value));
      cx.rotate(-sm.r);
      // lip-beweeg: karakter wiebelt licht mee op je stem
      const prat=1+micLevel*0.06*Math.sin(performance.now()/60);
      cx.scale(1,prat);
      cx.drawImage(img,-kw/2,-kh/2,kw,kh);
      cx.restore();
    }
  }
  cx.restore();
}


// eigen karakter uploaden — wordt direct een knop
document.getElementById('up').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.src=URL.createObjectURL(f);
  const naam=f.name.replace(/\.[^.]+$/,'').slice(0,10);
  img.onload=()=>{
    KARS[naam]=img;
    const b=document.createElement('button');b.className='kar';b.dataset.k=naam;
    b.textContent='⭐ '+naam;
    b.onclick=()=>{document.querySelectorAll('.kar').forEach(x=>x.classList.remove('act'));b.classList.add('act');kar=naam;};
    document.getElementById('kars').appendChild(b);
    b.click();
  };
};
// snapshot: huidig beeld als png downloaden
document.getElementById('snap').onclick=()=>{
  const a=document.createElement('a');a.href=cv.toDataURL('image/png');
  a.download='g2b-masker-foto.png';a.click();
};

// karakter-keuze
document.querySelectorAll('.kar').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.kar').forEach(x=>x.classList.remove('act'));
  b.classList.add('act');kar=b.dataset.k;
});

// opname (video + je stem)
const rb=document.getElementById('rec');
rb.onclick=()=>{
  if(recorder&&recorder.state==='recording'){recorder.stop();return;}
  chunks=[];
  const cs=cv.captureStream(30);
  const tracks=[...cs.getVideoTracks()];
  if(window._stream)tracks.push(...window._stream.getAudioTracks());
  recorder=new MediaRecorder(new MediaStream(tracks),{mimeType:'video/webm'});
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='g2b-live-masker.webm';a.click();
    rb.textContent='⏺ NEEM OP';rb.classList.remove('stop');
    document.getElementById('status').textContent='✓ filmpje gedownload';
  };
  recorder.start();rb.textContent='⏹ STOP';rb.classList.add('stop');
  document.getElementById('status').textContent='opname loopt…';
};
</script>
</body>
</html>
