<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>G2B DRUMS — browser drum-machine</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230D0F0E'/><text x='50' y='68' font-size='52' font-weight='bold' text-anchor='middle' fill='%232FBF71' font-family='sans-serif'>G2</text></svg>">
<style>
:root{--groen:#16a34a;--donker:#0b1220;--kaart:#131c2e;--rand:#22314d;--tekst:#e8eef8;--zacht:#9fb0c9}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--donker);color:var(--tekst);font:15px/1.5 system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}h1{font-size:1.55rem;margin-bottom:3px}h1 b{color:#4ade80}.sub{color:var(--zacht);font-size:.84rem;margin-bottom:14px;text-align:center}.transport,.ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(760px,96vw)}button,select,input[type=number]{background:var(--kaart);border:1px solid var(--rand);color:var(--tekst);border-radius:9px;padding:8px 10px;font-weight:700}button{cursor:pointer}.aan{background:var(--groen)!important;color:#04120a!important;border-color:var(--groen)!important}.seq{margin:15px auto 8px;width:min(760px,96vw)}.srow{display:grid;grid-template-columns:58px 26px repeat(16,1fr);gap:4px;margin:5px 0;align-items:center}.rlabel{font-size:.65rem;color:#7ee2a8;font-weight:800}.rdice{padding:2px 0;font-size:.7rem}.cell{height:23px;border-radius:5px;background:#0e1626;border:1px solid var(--rand);cursor:pointer}.cell.on{background:#1d6f42;border-color:var(--groen)}.cell.open{background:#23709b;border-color:#38bdf8}.cell.play{box-shadow:0 0 12px #4ade80;border-color:#4ade80}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(620px,96vw);margin-top:12px}.pad{aspect-ratio:1.35;background:var(--kaart);border:1px solid var(--rand);border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-weight:800;font-size:.72rem;color:#7ee2a8}.pad small{color:var(--zacht);font-size:.58rem;margin-top:3px}.pad.hit{background:#1d3a2a;border-color:var(--groen);transform:scale(.96);box-shadow:0 0 15px #16a34a66}.ctrl{flex:1;min-width:105px;background:var(--kaart);border:1px solid var(--rand);border-radius:10px;padding:8px 10px}.ctrl label{display:flex;justify-content:space-between;font-size:.68rem;color:var(--zacht);margin-bottom:5px}.ctrl input{width:100%;accent-color:var(--groen)}.foot{color:var(--zacht);font-size:.7rem;margin-top:14px;text-align:center}#wm{position:fixed;bottom:6px;right:10px;font-size:.68rem;opacity:.5;pointer-events:none}</style></head>
<body><h1>🥁 G2B <b>DRUMS</b></h1><p class="sub">Serverloze browser drum-machine — pads, stijlpatronen, swing en dobbelstenen.<br>Klik pads/stappen of gebruik Q W E R … Z X C V + 1-4.</p>
<div class="transport"><button id="play">▶ SPEEL</button><select id="style"></select><button id="dice">🎲 ALLES</button><button id="clear">LEEG</button><button id="wav">⬇ WAV</button><button id="midseq">⬇ MIDI</button><button id="upwav" title="upload-modus: daarna op een pad klikken om eigen sample te laden">⬆ SAMPLE</button><button id="mijnmap" title="MIJN: kies je eigen drum-map — alle samples worden automatisch op de pads gelegd">⬆ MIJN-MAP</button><button id="upmid" title="laad een .mid drum-patroon in de sequencer">⬆ MIDI</button><button id="resetkit" title="originele sounds terugzetten" style="display:none">↺ KIT</button><input type="file" id="filewav" accept="audio/*,.wav,.mp3,.ogg,.flac,.aif,.aiff" style="display:none"><input type="file" id="filemid" accept=".mid,.midi" style="display:none"><label style="font-size:.75rem;color:var(--zacht)">BPM <input id="bpm" type="number" min="60" max="180" value="100" style="width:65px"></label></div>
<div class="seq" id="seq"></div><div class="pads" id="pads"></div>
<div class="ctrls"><div class="ctrl"><label>SWING <b id="vsw">10%</b></label><input id="swing" type="range" min="0" max="50" value="10"></div><div class="ctrl"><label>TOON <b id="vp">0</b></label><input id="pitch" type="range" min="-12" max="12" step="1" value="0"></div><div class="ctrl"><label>LENGTE <b id="vl">100%</b></label><input id="leng" type="range" min="10" max="100" step="5" value="100"></div><div class="ctrl"><label>FILTER <b id="vf">uit</b></label><input id="filt" type="range" min="0" max="12000" step="100" value="0"></div><div class="ctrl"><label>VOLUME <b id="vv">80%</b></label><input id="vol" type="range" min="0" max="100" value="80"></div></div>
<p class="foot">⚡ Sounds: <span id="st">…</span> · 100% lokaal in je browser</p><div id="wm">🥁 G2B DRUMS</div>
<script>
const PRE=[
['G2B','K...K...K..K....','....S.......S...','H.H.H.H.H.H.H.H.','............P...'],['DEMBOW','K..K..K...K..K..','....S.......S...','H.H.H.H.H.H.H.H.','P.....P.....P...'],['DRILL','K......K..K..K..','....S.......S...','H.H.HH.H.H.H.HH.','......P.........'],['RNB','K...K....K......','....S.......S...','H.H.H.H.H.H.H.H.','..P........P....'],['HOUSE','K...K...K...K...','....S.......S...','..H...H...H...H.','P.P.P.P.P.P.P.P.'],['AFRO','K..K....K.K..K..','....S.......S.S.','H.H.H.HoH.H.H.Ho','..P...P...P...P.'],['TRAP','K........K......','....S...S....S..','H.H.H.H.H.HHHHHH','..........P.....'],['BOOM','K...............','..S......S......','H..H..H..H..H.H.','P.....P.........'],['UKG','K..K....K..K.K..','....S.....S..S..','..H..H.H..H..H.H','P..P....P.......'],['JERSEY','K..K..K...K...K.','....S..S........','H.H.HH.H.HH..H..','....P......P....'],['BOUNCE','K...K.....K...K.','....S.S.....S...','H..H..H..H..H.H.','..P....P........'],['SOUL','K.....K.........','....S....S......','H..H....H..H....','P.......P.......'],['LOFI','K....K....K.....','....S.......S...','H.H..H..H.H..H..','....P.........P.'],['FUNK','K..K....K..K..K.','....S...S..S....','H.H..H.HH.H..H.H','...P...P........'],['REGGAE','K.....K.....K...','..S..........S..','H..H..H..H..H...','.P....P....P....'],['DANCE','K...K...K...K...','....S.......S...','H.H..H.H..H..H..','P.......P.......'],['KAWINA','K..K.K..K..K.K..','....S.....S.S...','H.H.HH.H.H.HH.H.','.P..P..P..P..P..']];
const KEYS='qwerasdfzxcv1234'.split(''),rowNames=['KICK','SNARE','HAT','PERC'],rowPad=[0,2,4,8],openPad=6;
let NAMES=[],FILES=[],buffers=[],ctx=null,pat=[],step=0,playing=false,timer=null,nextT=0,masterNode=null;
function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
async function init(){const m=await(await fetch('meta.json')).json();NAMES=m.names;FILES=m.files;initStyle();buildSeq();buildPads();await load();window.G2B_DRUMS.ready=true}
async function load(){let ok=0;document.getElementById('st').textContent='laden…';buffers=[];for(let i=0;i<16;i++){try{const r=await fetch('wav/'+FILES[i]+'.wav');if(!r.ok)throw 0;buffers.push(await ac().decodeAudioData(await r.arrayBuffer()));ok++}catch(e){buffers.push(null)}}document.getElementById('st').textContent=ok+'/16'}
function initStyle(){const s=document.getElementById('style');s.innerHTML=PRE.map((p,i)=>'<option value="'+i+'">'+p[0]+'</option>').join('');s.onchange=()=>setPreset(+s.value);setPreset(0)}
function setPreset(i){const p=PRE[i];pat=p.slice(1).map(x=>x.split(''));drawSeq()}
function buildSeq(){const q=document.getElementById('seq');q.innerHTML='';rowNames.forEach((n,r)=>{const row=document.createElement('div');row.className='srow';row.innerHTML='<div class="rlabel">'+n+'</div><button class="rdice" title="dobbel deze rij">🎲</button>';row.querySelector('button').onclick=()=>rowDice(r);for(let c=0;c<16;c++){const d=document.createElement('div');d.className='cell';d.id='c'+r+'_'+c;d.onclick=()=>toggleCell(r,c);row.appendChild(d)}q.appendChild(row)})}
function drawSeq(){if(!pat.length||!document.getElementById('c0_0'))return;for(let r=0;r<4;r++)for(let c=0;c<16;c++){const el=document.getElementById('c'+r+'_'+c),ch=pat[r][c];if(el)el.className='cell'+(ch==='.'?'':ch==='o'?' open':' on')}}
function toggleCell(r,c){const base='KSHP'[r];pat[r][c]=pat[r][c]==='.'?base:'.';drawSeq()}
function rowDice(r){for(let c=0;c<16;c++){const dens=r===2?45:r===0?30:25;let on=Math.random()*100<dens;if(r===0&&c%4===0)on=true;if(r===1&&(c===4||c===12))on=true;pat[r][c]=on?(r===2&&Math.random()<.12?'o':'KSHP'[r]):'.'}drawSeq()}
document.getElementById('dice').onclick=()=>{for(let r=0;r<4;r++)rowDice(r)};document.getElementById('clear').onclick=()=>{pat=pat.map(r=>r.map(()=> '.'));drawSeq()};
function master(){if(!masterNode){const a=ac();masterNode=a.createDynamicsCompressor();masterNode.threshold.value=-18;masterNode.knee.value=16;masterNode.ratio.value=3;masterNode.attack.value=.004;masterNode.release.value=.18;masterNode.connect(a.destination)}return masterNode}
function voice(a,dest,i,t,vel){const b=buffers[i];if(!b)return null;const s=a.createBufferSource();s.buffer=b;s.playbackRate.value=Math.pow(2,(+document.getElementById('pitch').value)/12);const f=+document.getElementById('filt').value;let node=s;if(f>0){const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=f;s.connect(lp);node=lp}const g=a.createGain(),vol=(+document.getElementById('vol').value)/100*(vel||1);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,vol),t+.003);const len=Math.min(b.duration,b.duration*(+document.getElementById('leng').value)/100);g.gain.setTargetAtTime(0,t+len,.025);node.connect(g);g.connect(dest);s.start(t);s.stop(t+len+.15);return s}
function hitVisual(i){const el=document.getElementById('p'+i);if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),110)}}
function speel(i,semi){const a=ac(),t=a.currentTime;voice(a,master(),i,t,1);hitVisual(i)}
function stepVisual(c,t){setTimeout(()=>{for(let r=0;r<4;r++){const el=document.getElementById('c'+r+'_'+c);if(el){el.classList.add('play');setTimeout(()=>el.classList.remove('play'),100)}}},Math.max(0,(t-ac().currentTime)*1000))}
function schedule(c,t){const a=ac();for(let r=0;r<4;r++){const ch=pat[r][c];if(ch&&ch!=='.')voice(a,master(),ch==='o'?openPad:rowPad[r],t,.92)}stepVisual(c,t)}
function tick(){const a=ac();while(nextT<a.currentTime+.12){const bpm=+document.getElementById('bpm').value||100,len=60/bpm/4,sw=(+document.getElementById('swing').value)/100;const t=nextT+(step%2?sw*len:0);schedule(step,t);nextT+=len;step=(step+1)%16}}
document.getElementById('play').onclick=()=>{const a=ac();if(!playing){playing=true;step=0;nextT=a.currentTime+.06;timer=setInterval(tick,30);document.getElementById('play').textContent='■ STOP';document.getElementById('play').classList.add('aan')}else{playing=false;clearInterval(timer);document.getElementById('play').textContent='▶ SPEEL';document.getElementById('play').classList.remove('aan')}};
let userPads={},uploadMode=false,pendingPad=-1;
function buildPads(){const p=document.getElementById('pads');p.innerHTML='';NAMES.forEach((n,i)=>{const d=document.createElement('div');d.className='pad';d.id='p'+i;d.innerHTML=(userPads[i]?userPads[i].label:n)+'<small>'+KEYS[i].toUpperCase()+(userPads[i]?' · MIJN':'')+'</small>';d.onpointerdown=e=>{e.preventDefault();if(uploadMode){pendingPad=i;document.getElementById('filewav').click()}else speel(i)};p.appendChild(d)})}
document.getElementById('upwav').onclick=()=>{uploadMode=!uploadMode;document.getElementById('upwav').classList.toggle('aan',uploadMode);document.getElementById('upwav').textContent=uploadMode?'⬆ klik een pad…':'⬆ SAMPLE'};
document.getElementById('filewav').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||pendingPad<0)return;try{const ab=await f.arrayBuffer(),buf=await ac().decodeAudioData(ab);setUserPad(pendingPad,buf,f.name);document.getElementById('st').textContent='eigen sample op pad '+(pendingPad+1)+' ✓'}catch(err){document.getElementById('st').textContent='kon audio niet lezen'}pendingPad=-1;uploadMode=false;document.getElementById('upwav').classList.remove('aan');document.getElementById('upwav').textContent='⬆ SAMPLE'};
function setUserPad(i,buf,name){userPads[i]={buf,label:(name||'MIJN').replace(/\.[^.]+$/,'').slice(0,10).toUpperCase()};buffers[i]=buf;buildPads();document.getElementById('resetkit').style.display=''}
document.getElementById('resetkit').onclick=async()=>{userPads={};await load();buildPads();document.getElementById('resetkit').style.display='none';document.getElementById('st').textContent='originele kit terug'};
document.addEventListener('keydown',e=>{const i=KEYS.indexOf(e.key.toLowerCase());if(i>=0&&!e.repeat)speel(i)});
['swing','pitch','leng','filt','vol'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{const v=+e.target.value;document.getElementById({swing:'vsw',pitch:'vp',leng:'vl',filt:'vf',vol:'vv'}[id]).textContent=id==='filt'?(v?v+'Hz':'uit'):id==='pitch'?v:v+'%'}));
async function renderBar(){const a=ac(),sr=44100,bpm=+document.getElementById('bpm').value||100,len=60/bpm/4,sw=(+document.getElementById('swing').value)/100,oc=new OfflineAudioContext(2,Math.ceil(sr*len*16+sr*.4),sr);for(let c=0;c<16;c++){const base=c*len,t=base+(c%2?sw*len:0);for(let r=0;r<4;r++){const ch=pat[r][c];if(ch&&ch!=='.')voice(oc,oc.destination,ch==='o'?openPad:rowPad[r],t,.92)}}const buf=await oc.startRendering();let pk=0;for(let ch=0;ch<buf.numberOfChannels;ch++){const d=buf.getChannelData(ch);for(let i=0;i<d.length;i++)pk=Math.max(pk,Math.abs(d[i]))}if(pk>.891){const g=.891/pk;for(let ch=0;ch<buf.numberOfChannels;ch++){const d=buf.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]*=g}}return buf}
function wavBlob(buf){const n=buf.length,ch=Math.min(2,buf.numberOfChannels),sr=buf.sampleRate,bytes=44+n*ch*2,ab=new ArrayBuffer(bytes),v=new DataView(ab);const wr=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};wr(0,'RIFF');v.setUint32(4,bytes-8,true);wr(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);wr(36,'data');v.setUint32(40,n*ch*2,true);let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const x=Math.max(-1,Math.min(1,buf.getChannelData(c)[i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return new Blob([ab],{type:'audio/wav'})}
function styleName(){return PRE[+document.getElementById('style').value][0].toLowerCase()}
// ---------- MIDI import: .mid → 4×16 sequencer ----------
function parseMidiFile(dv){const rd=(o,n)=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(dv.getUint8(o+i));return s};
 if(rd(0,4)!=='MThd')return null;const ntrk=dv.getUint16(10),ppq=dv.getUint16(12)||480;let pos=8+dv.getUint32(4),notes=[],tempo=0;
 for(let tr=0;tr<ntrk&&pos<dv.byteLength-8;tr++){if(rd(pos,4)!=='MTrk')break;const len=dv.getUint32(pos+4);let p=pos+8,end=p+len,tick=0,st=0,active={};
  while(p<end){let v=0,b;do{b=dv.getUint8(p++);v=(v<<7)|(b&127)}while(b&128);tick+=v;let ev=dv.getUint8(p++);
   if(ev<0x80){p--;ev=st}else if(ev<0xF0)st=ev;
   if(ev===0xFF){const tp=dv.getUint8(p++);let ln=dv.getUint8(p++);if(ln&128){let n=ln&127;ln=0;while(n--)ln=(ln<<8)|dv.getUint8(p++)}if(tp===0x51&&!tempo)tempo=(dv.getUint8(p)<<16)|(dv.getUint8(p+1)<<8)|dv.getUint8(p+2);p+=ln}
   else if(ev===0xF0||ev===0xF7){let ln=dv.getUint8(p++);if(ln&128){let n=ln&127;ln=0;while(n--)ln=(ln<<8)|dv.getUint8(p++)}p+=ln}
   else{const type=ev&0xF0;if(type===0xC0||type===0xD0)p++;else{const d1=dv.getUint8(p++),d2=dv.getUint8(p++);
    if(type===0x90&&d2>0)active[d1]=tick;else if((type===0x80||(type===0x90&&d2===0))&&active[d1]!=null){notes.push({n:d1,s:active[d1],e:tick});delete active[d1]}}}
  }pos=end}
 return{notes,ppq,bpm:tempo?Math.round(60000000/tempo):0}}
function importMidiData(ab){const m=parseMidiFile(new DataView(ab));if(!m||!m.notes.length)return{ok:false,reden:'geen noten gevonden'};
 const rowOf=n=>{if(n===35||n===36)return 0;if(n===37||n===38||n===40)return 1;if(n===42||n===44||n===46)return 2;return 3};
 const spt=m.ppq/4,pat2=pat.map(r=>r.map(()=>'.'));let gezet=0;
 m.notes.forEach(nt=>{const st=Math.round(nt.s/spt);if(st>=0&&st<16){const r=rowOf(nt.n);if(r!=null){pat2[r][st]=nt.n===46?'o':'KSHP'[r];gezet++}}});
 if(!gezet)return{ok:false,reden:'noten vallen buiten eerste 16 stappen'};
 pat=pat2;if(m.bpm>=60&&m.bpm<=180){document.getElementById('bpm').value=m.bpm}drawSeq();return{ok:true,noten:gezet,bpm:m.bpm}}
// ---------- MIJN-map scan: kies een map, alle audio wordt op pads gelegd ----------
async function scanMijnMap(){if(!window.showDirectoryPicker){document.getElementById('st').textContent='map-scan werkt in Chrome/Edge — gebruik ⬆ SAMPLE per pad';return null}
 try{const dir=await window.showDirectoryPicker({mode:'read'}),files=[];
  for await(const ent of dir.values()){if(ent.kind==='file'&&/\.(wav|mp3|ogg|flac|aif|aiff|m4a)$/i.test(ent.name))files.push(ent)}
  files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!files.length){document.getElementById('st').textContent='geen audio in die map';return null}
  let n=0;for(const ent of files.slice(0,16)){try{const f=await ent.getFile(),buf=await ac().decodeAudioData(await f.arrayBuffer());setUserPad(n,buf,f.name);n++}catch(e){}}
  document.getElementById('st').textContent='MIJN-kit: '+n+' samples geladen uit '+dir.name;return n}catch(e){if(e&&e.name!=='AbortError')document.getElementById('st').textContent='map-scan mislukt';return null}}
document.getElementById('mijnmap').onclick=scanMijnMap;
document.getElementById('upmid').onclick=()=>document.getElementById('filemid').click();
document.getElementById('filemid').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=importMidiData(await f.arrayBuffer());document.getElementById('st').textContent=r.ok?('midi geladen: '+r.noten+' hits'+(r.bpm?' · '+r.bpm+' bpm':'')):('midi mislukt: '+r.reden)};
async function exportWav(){const buf=await renderBar(),blob=wavBlob(buf),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='g2b-drums-'+styleName()+'-'+document.getElementById('bpm').value+'bpm.wav';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
document.getElementById('wav').onclick=()=>{if(window.G2B_EXPORT_THEN)G2B_EXPORT_THEN('DRUMS',exportWav);else exportWav()};
function midiBlob(){const bpm=+document.getElementById('bpm').value||100,sw=(+document.getElementById('swing').value)/100,notes={0:36,1:35,2:38,3:40,4:42,5:44,6:46,7:39,8:75,9:60,10:56,11:75,12:50,13:45,14:49,15:70};let ev=[];for(let c=0;c<16;c++){const tick=c*120+(c%2?Math.round(sw*120):0);for(let r=0;r<4;r++){const ch=pat[r][c];if(ch&&ch!=='.'){const pad=ch==='o'?openPad:rowPad[r],n=notes[pad]||36;ev.push([tick,0x99,n,96],[tick+100,0x89,n,0])}}}ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);function vlq(x){const b=[x&127];while(x>>=7)b.unshift((x&127)|128);return b}const tempo=Math.round(60000000/bpm),trk=[0,0xFF,0x51,3,(tempo>>16)&255,(tempo>>8)&255,tempo&255];let last=0;for(const e of ev){trk.push(...vlq(Math.max(0,e[0]-last)),e[1],e[2],e[3]);last=Math.max(last,e[0])}trk.push(0,0xFF,0x2F,0);const hdr=[0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,0x01,0xE0,0x4D,0x54,0x72,0x6B,(trk.length>>24)&255,(trk.length>>16)&255,(trk.length>>8)&255,trk.length&255];return new Blob([new Uint8Array(hdr),new Uint8Array(trk)],{type:'audio/midi'})}
