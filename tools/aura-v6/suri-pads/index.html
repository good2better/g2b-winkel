<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Suri-Pads & World — AURA v6</title>
<link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<h1>🥁 Suri-Pads &amp; World <a href="../" style="float:right;font-size:12px">← AURA</a></h1>
<div class="card"><p>Pads (Verkoop + Gio) én Surinaamse instrumenten in één engine.
<b>Groene vakken:</b> 1 = solo over heel keyboard · meerdere = direct stapelen · opnieuw klikken = uit.</p>
<div id="matrix"></div>
<div id="kbd"></div><div id="knip"></div>
<div class="card" style="margin-top:10px"><b>Loop &amp; Step-Record</b><div id="raster"></div>
<div class="row"><button id="rec" class="on">● Record</button><span class="hint">druk op een toets terwijl de loop draait → stap wordt groen</span></div></div>
<div id="brain"></div></div></div>
<script src="../js/aura-engine.js"></script><script src="../js/instrument-matrix.js"></script>
<script src="../js/keyboard.js"></script><script src="../js/brain-memory.js"></script>
<script>
const SOUNDS = [
  // Surinaams (eigen synth-benaderingen)
  {naam:'Kawina Drum', cat:'suri', wave:'square', tone:0.5, decay:0.995},
  {naam:'Apinti Lead', cat:'suri', wave:'saw', tone:2.0, decay:0.998},
  {naam:'Kaseko Bas', cat:'suri', wave:'saw', tone:0.25, decay:0.994},
  {naam:'Skratjie Perc', cat:'suri', wave:'tri', tone:3.0, decay:0.99},
  // Pads verkoop
  {naam:'Warm Pad A', cat:'pads', wave:'saw', tone:1.0, decay:0.9995},
  {naam:'Dark Pad B', cat:'pads', wave:'tri', tone:0.5, decay:0.9995},
  {naam:'Bright Pad', cat:'pads', wave:'saw', tone:1.5, decay:0.999},
  {naam:'Deep Pad', cat:'pads', wave:'sine', tone:0.5, decay:0.9998},
  // Gio-pads
  {naam:'Gio Drone', cat:'gio', wave:'saw', tone:0.25, decay:0.9998},
  {naam:'Gio Air', cat:'gio', wave:'sine', tone:2.0, decay:0.9995},
  {naam:'Gio Swell', cat:'gio', wave:'tri', tone:1.0, decay:0.9995},
  {naam:'Gio Low', cat:'gio', wave:'saw', tone:0.125, decay:0.9997}
];
(async () => {
  await Aura.init('../js/aura-dsp-worklet.js');
  InstrumentMatrix.build(document.getElementById('matrix'), SOUNDS);
  bouwKeyboard(document.getElementById('kbd'), 3, 2);
  knipRij(document.getElementById('knip'));
  const ras = Aura.loopRaster(document.getElementById('raster'));
  let rec = true;
  document.getElementById('rec').onclick = e => { rec = !rec; ras.record(rec);
    e.target.classList.toggle('on', rec); e.target.textContent = rec ? '● Record' : '○ Rec uit'; };
  ras.record(true); ras.start();
  const origPlay = InstrumentMatrix.play.bind(InstrumentMatrix);
  InstrumentMatrix.play = (p, o) => { ras.hit(p); origPlay(p, o); };
  BrainMemory.knop(document.getElementById('brain'));
})();
</script></body></html>
