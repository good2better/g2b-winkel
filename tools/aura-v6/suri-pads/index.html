<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Suri-Pads & World — AURA v6</title>
<link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<h1>🥁 Suri-Pads &amp; World <a href="../" style="float:right;font-size:12px">← AURA</a></h1>
<div class="card"><p>Pads (Verkoop + Gio) én Surinaamse instrumenten in één engine.
<b>Groene vakken:</b> 1 = solo over heel keyboard · meerdere = direct stapelen · opnieuw klikken = uit.</p>
<div style="margin:6px 0"><label for="bank">Bank:&nbsp;</label><select id="bank"><option value="">SURI + WORLD (alles)</option></select></div>
<div id="matrix"></div>
<div class="card" style="margin-top:10px"><b>Opname &amp; Loop</b><div id="studio"></div></div>
<div id="modus"></div>
<div id="kbd"></div><div id="knip"></div>
<div id="brain"></div></div></div>
<script src="../js/aura-engine.js"></script><script src="../js/instrument-matrix.js"></script>
<script src="../js/keyboard.js"></script><script src="../js/brain-memory.js"></script><script src="../js/studio-panel.js"></script><script src="../js/speel-modus.js"></script>
<script>
const SOUNDS = [
  // Surinaams — échte samples
  {naam:'Kawina', cat:'suri', src:'../wav/suri/KAWINA_0.wav', basePitch:60},
  {naam:'Apinti', cat:'suri', src:'../wav/suri/APINTI_0.wav', basePitch:60},
  {naam:'Kaseko', cat:'suri', src:'../wav/suri/KASEKO_0.wav', basePitch:60},
  {naam:'Winti', cat:'suri', src:'../wav/suri/WINTI_0.wav', basePitch:60},
  {naam:'Aleke', cat:'suri', src:'../wav/suri/ALEKE_0.wav', basePitch:60},
  {naam:'Skratjie', cat:'suri', src:'../wav/suri/skratji.wav', basePitch:60},
  {naam:'Agogo', cat:'suri', src:'../wav/suri/agogo.wav', basePitch:60},
  {naam:'Slaggitaar', cat:'suri', src:'../wav/suri/SLAGGITAAR_0.wav', basePitch:60},
  // World (verkoop-smaak)
  {naam:'Soca', cat:'pads', src:'../wav/suri/SOCA_0.wav', basePitch:60},
  {naam:'Dembow', cat:'pads', src:'../wav/suri/DEMBOW_0.wav', basePitch:60},
  {naam:'Bubbling', cat:'pads', src:'../wav/suri/BUBBLING_0.wav', basePitch:60},
  {naam:'Zouk', cat:'pads', src:'../wav/suri/ZOUK_0.wav', basePitch:60},
  {naam:'Dancehall', cat:'pads', src:'../wav/suri/DANCEHALL_0.wav', basePitch:60},
  {naam:'Afro', cat:'pads', src:'../wav/suri/AFRO_0.wav', basePitch:60},
  // DNA-SAMPLEX — Giorgio's eigen multi-samples (beste per instrument)
  {naam:'Koti', cat:'suri', src:'../wav/suri/koti_vcsl.wav', basePitch:60},
  {naam:'Bangi', cat:'suri', src:'../wav/suri/bangi_vcsl.wav', basePitch:60},
  {naam:'Skratjie 2', cat:'suri', src:'../wav/suri/skratjie.wav', basePitch:60},
  {naam:'Seki', cat:'suri', src:'../wav/suri/seki.wav', basePitch:60},
  {naam:'Seki 2', cat:'suri', src:'../wav/suri/seki2.wav', basePitch:60},
  {naam:'Klap', cat:'suri', src:'../wav/suri/klap.wav', basePitch:60},
  {naam:'Surdo', cat:'suri', src:'../wav/suri/surdo_vcsl.wav', basePitch:60},
  {naam:'Timbal', cat:'suri', src:'../wav/suri/timbal_vcsl.wav', basePitch:60},
  {naam:'Conga', cat:'suri', src:'../wav/suri/conga_vcsl.wav', basePitch:60},
  {naam:'Clave', cat:'suri', src:'../wav/suri/clave.wav', basePitch:60},
  {naam:'Rim', cat:'suri', src:'../wav/suri/rim_vcsl.wav', basePitch:60},
  {naam:'Agogo Hi', cat:'suri', src:'../wav/suri/agogo_hi.wav', basePitch:60},
  {naam:'Agogo Lo', cat:'suri', src:'../wav/suri/agogo_lo.wav', basePitch:60},
  {naam:'Deksel', cat:'suri', src:'../wav/suri/deksel.wav', basePitch:60},
  {naam:'Stab', cat:'suri', src:'../wav/suri/stab.wav', basePitch:60},
  {naam:'Slaggitaar Steel', cat:'suri', src:'../wav/suri/slaggitaar_steel.wav', basePitch:60},
  {naam:'Slaggitaar Nylon', cat:'suri', src:'../wav/suri/slaggitaar_nylon.wav', basePitch:60},
  // Wereld-melodisch
  {naam:'Afrisun', cat:'pads', src:'../wav/suri/afrisun.wav', basePitch:60},
  {naam:'Marimba', cat:'pads', src:'../wav/suri/marimba.wav', basePitch:60},
  {naam:'Kalimba', cat:'pads', src:'../wav/suri/kalimba.wav', basePitch:60},
  {naam:'Logdrum', cat:'pads', src:'../wav/suri/logdrum.wav', basePitch:60},
  // Gio-laag (synth-pads om mee te stapelen)
  {naam:'Gio Drone', cat:'gio', wave:'saw', tone:0.25, decay:0.9998},
  {naam:'Gio Swell', cat:'gio', wave:'tri', tone:1.0, decay:0.9995}
];
(async () => {
  await Aura.init('../js/aura-dsp-worklet.js');
  const matrixEl = document.getElementById('matrix');
  InstrumentMatrix.build(matrixEl, SOUNDS);
  // PADS genre-banken meemergen: kies een bank → grid toont haar 16 pads
  try {
    const meta = await (await fetch('../../pads-web/pads-meta.json')).json();
    const sel = document.getElementById('bank');
    meta.banks.forEach((b, i) => {
      const o = document.createElement('option');
      o.value = i; o.textContent = 'PADS — ' + b;
      sel.appendChild(o);
    });
    sel.onchange = () => {
      if (sel.value === '') { InstrumentMatrix.build(matrixEl, SOUNDS); return; }
      const i = +sel.value, b = meta.banks[i];
      const kit = meta.pads[b].map((nm, j) => ({
        naam: nm, cat: 'kit', basePitch: 60,
        src: `../../pads-web/wav/b${String(i).padStart(2,'0')}_${j}.wav`
      }));
      InstrumentMatrix.build(matrixEl, kit);
    };
  } catch(e) { console.warn('pads-banken niet bereikbaar', e); }
  bouwKeyboard(document.getElementById('kbd'), 3, 2);
  knipRij(document.getElementById('knip'));
  const panel = StudioPanel.bouw(document.getElementById('studio'));
  SpeelModus.bouw(document.getElementById('modus'));
  const origPlay = InstrumentMatrix.play.bind(InstrumentMatrix);
  InstrumentMatrix.play = SpeelModus.wire(origPlay, panel);
  BrainMemory.knop(document.getElementById('brain'));
})();
</script></body></html>
