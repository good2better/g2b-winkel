<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Suri-Pads & World — AURA v6</title>
<link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<h1>🥁 Suri-Pads &amp; World <a href="../" style="float:right;font-size:12px">← AURA</a></h1>
<div class="card"><p>Pads (Verkoop + Gio) én Surinaamse instrumenten in één engine.
<b>Groene vakken:</b> 1 = solo over heel keyboard · meerdere = direct stapelen · opnieuw klikken = uit.</p>
<div id="matrix"></div>
<div id="kbd"></div><div id="knip"></div>
<div class="card" style="margin-top:10px"><b>Loop &amp; Step-Record</b><div id="raster"></div>
<div class="row"><button id="rec" class="on">● Record</button><span class="hint">druk op een toets terwijl de loop draait → stap wordt groen</span></div></div>
<div id="brain"></div></div></div>
<script src="../js/aura-engine.js"></script><script src="../js/instrument-matrix.js"></script>
<script src="../js/keyboard.js"></script><script src="../js/brain-memory.js"></script>
<script>
const SOUNDS = [
  // Surinaams — échte samples
  {naam:'Kawina', cat:'suri', src:'../wav/suri/KAWINA_0.wav'},
  {naam:'Apinti', cat:'suri', src:'../wav/suri/APINTI_0.wav'},
  {naam:'Kaseko', cat:'suri', src:'../wav/suri/KASEKO_0.wav'},
  {naam:'Winti', cat:'suri', src:'../wav/suri/WINTI_0.wav'},
  {naam:'Aleke', cat:'suri', src:'../wav/suri/ALEKE_0.wav'},
  {naam:'Skratjie', cat:'suri', src:'../wav/suri/skratji.wav'},
  {naam:'Agogo', cat:'suri', src:'../wav/suri/agogo.wav'},
  {naam:'Slaggitaar', cat:'suri', src:'../wav/suri/SLAGGITAAR_0.wav'},
  // World (verkoop-smaak)
  {naam:'Soca', cat:'pads', src:'../wav/suri/SOCA_0.wav'},
  {naam:'Dembow', cat:'pads', src:'../wav/suri/DEMBOW_0.wav'},
  {naam:'Bubbling', cat:'pads', src:'../wav/suri/BUBBLING_0.wav'},
  {naam:'Zouk', cat:'pads', src:'../wav/suri/ZOUK_0.wav'},
  {naam:'Dancehall', cat:'pads', src:'../wav/suri/DANCEHALL_0.wav'},
  {naam:'Afro', cat:'pads', src:'../wav/suri/AFRO_0.wav'},
  // DNA-SAMPLEX — Giorgio's eigen multi-samples (beste per instrument)
  {naam:'Koti', cat:'suri', src:'../wav/suri/koti_vcsl.wav'},
  {naam:'Bangi', cat:'suri', src:'../wav/suri/bangi_vcsl.wav'},
  {naam:'Skratjie 2', cat:'suri', src:'../wav/suri/skratjie.wav'},
  {naam:'Seki', cat:'suri', src:'../wav/suri/seki.wav'},
  {naam:'Seki 2', cat:'suri', src:'../wav/suri/seki2.wav'},
  {naam:'Klap', cat:'suri', src:'../wav/suri/klap.wav'},
  {naam:'Surdo', cat:'suri', src:'../wav/suri/surdo_vcsl.wav'},
  {naam:'Timbal', cat:'suri', src:'../wav/suri/timbal_vcsl.wav'},
  {naam:'Conga', cat:'suri', src:'../wav/suri/conga_vcsl.wav'},
  {naam:'Clave', cat:'suri', src:'../wav/suri/clave.wav'},
  {naam:'Rim', cat:'suri', src:'../wav/suri/rim_vcsl.wav'},
  {naam:'Agogo Hi', cat:'suri', src:'../wav/suri/agogo_hi.wav'},
  {naam:'Agogo Lo', cat:'suri', src:'../wav/suri/agogo_lo.wav'},
  {naam:'Deksel', cat:'suri', src:'../wav/suri/deksel.wav'},
  {naam:'Stab', cat:'suri', src:'../wav/suri/stab.wav'},
  {naam:'Slaggitaar Steel', cat:'suri', src:'../wav/suri/slaggitaar_steel.wav'},
  {naam:'Slaggitaar Nylon', cat:'suri', src:'../wav/suri/slaggitaar_nylon.wav'},
  // Wereld-melodisch
  {naam:'Afrisun', cat:'pads', src:'../wav/suri/afrisun.wav'},
  {naam:'Marimba', cat:'pads', src:'../wav/suri/marimba.wav'},
  {naam:'Kalimba', cat:'pads', src:'../wav/suri/kalimba.wav'},
  {naam:'Logdrum', cat:'pads', src:'../wav/suri/logdrum.wav'},
  // Gio-laag (synth-pads om mee te stapelen)
  {naam:'Gio Drone', cat:'gio', wave:'saw', tone:0.25, decay:0.9998},
  {naam:'Gio Swell', cat:'gio', wave:'tri', tone:1.0, decay:0.9995}
];
(async () => {
  await Aura.init('../js/aura-dsp-worklet.js');
  InstrumentMatrix.build(document.getElementById('matrix'), SOUNDS);
  bouwKeyboard(document.getElementById('kbd'), 3, 2);
  knipRij(document.getElementById('knip'));
  const ras = Aura.loopRaster(document.getElementById('raster'));
  let rec = true;
  document.getElementById('rec').onclick = e => { rec = !rec; ras.record(rec);
    e.target.classList.toggle('on', rec); e.target.textContent = rec ? '● Record' : '○ Rec uit'; };
  ras.record(true); ras.start();
  const origPlay = InstrumentMatrix.play.bind(InstrumentMatrix);
  InstrumentMatrix.play = (p, o) => { ras.hit(p); origPlay(p, o); };
  BrainMemory.knop(document.getElementById('brain'));
})();
</script></body></html>
