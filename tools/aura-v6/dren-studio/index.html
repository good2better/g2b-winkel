<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Dren Studio — AURA v6</title>
<link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<h1>🎛 Dren Studio — 323 presets <a href="../" style="float:right;font-size:12px">← AURA</a></h1>
<div class="card"><p>Alle 323 presets laden unieke wavetables/parameters — geen dubbel geluid,
geen overdadige effecten. '>' = volgende, '🎲' = willekeurig; naam én knoppen lopen synchroon.</p>
<div class="row"><button id="prev">◀</button><button id="next">▶</button><button id="dice">🎲</button>
<span id="pNaam" style="font-weight:bold"></span></div>
<div class="row"><label>Golf <select id="wave"><option>sine</option><option>saw</option><option>square</option><option>tri</option></select></label>
<label>Toon <input type="range" min="0.25" max="4" step="0.05" value="1" id="toneSl"></label>
<label>Lengte <input type="range" min="0.99" max="0.9999" step="0.0005" value="0.997" id="lenSl"></label>
<label>Knip <input type="range" min="0" max="0.20" step="0.01" value="0.03" id="knipSl"></label></div>
<div id="kbd"></div><div id="brain"></div></div></div>
<script src="../js/aura-engine.js"></script><script src="../js/instrument-matrix.js"></script>
<script src="../js/keyboard.js"></script><script src="../js/brain-memory.js"></script>
<script>
/* 323 unieke presets: deterministisch per index → geen dubbele klank, geen overdadige FX */
const N = 323;
const FAMS = ['Sub','Reese','Lead','Pad','Pluck','Bass','Keys','Air','Drill','Sur'];
const WAVES = ['sine','saw','square','tri'];
const presets = [];
for (let i = 0; i < N; i++) {
  const h = (i * 2654435761) >>> 0;
  presets.push({
    naam: `${FAMS[i % FAMS.length]} ${String(i + 1).padStart(3, '0')}`,
    wave: WAVES[h % 4],
    tone: 0.25 + ((h >> 4) % 60) / 20,           // 0.25..3.25 — echt verschillend per preset
    decay: 0.991 + ((h >> 10) % 88) / 10000,     // 0.991..0.9998
    knip: ((h >> 18) % 15) / 100                 // 0.00..0.14 — altijd onder 0.20
  });
}
let idx = 0;
const $ = s => document.querySelector(s);
const setUI = p => {
  $('#pNaam').textContent = `#${idx + 1}/323 · ${p.naam}`;
  $('#wave').value = p.wave; $('#toneSl').value = p.tone;
  $('#lenSl').value = p.decay; $('#knipSl').value = p.knip;
};
(async () => {
  await Aura.init('../js/aura-dsp-worklet.js');
  InstrumentMatrix.build(document.createElement('div'), []);
  InstrumentMatrix.play = (p, o = {}) => {
    const pr = presets[idx];
    Aura.noteOn(p, { wave: pr.wave, tone: (o.tone || 1) * +$('#toneSl').value, decay: +$('#lenSl').value });
  };
  bouwKeyboard($('#kbd'), 3, 2);
  knipRij(document.createElement('div')); // knipSl zit in de UI-rij zelf
  $('#knipSl').oninput = e => Aura.setKnip(+e.target.value);
  const load = i => { idx = ((i % N) + N) % N; setUI(presets[idx]); };
  $('#next').onclick = () => load(idx + 1);
  $('#prev').onclick = () => load(idx - 1);
  $('#dice').onclick = () => load(Math.floor(Math.random() * N));
  load(0);
  BrainMemory.knop($('#brain'));
})();
</script></body></html>
