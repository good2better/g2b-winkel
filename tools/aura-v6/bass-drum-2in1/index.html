<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Bass & Drum 2-in-1 — AURA v6</title>
<link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<h1>🔊 Bass &amp; Drum 2-in-1 <a href="../" style="float:right;font-size:12px">← AURA</a></h1>
<div class="card"><p>Bass + Drum&amp;Bass samengevoegd — Sub, Reese, 808 &amp; Bass one-shots.
Groen = selecteer (aan/uitklikbaar), speelt over heel keyboard.</p>
<div class="row"><label>Toon (pitch) <input type="range" min="0.25" max="4" step="0.05" value="1" id="toneSl"></label>
<label>Lengte (decay) <input type="range" min="0.990" max="0.9999" step="0.0005" value="0.996" id="lenSl"></label></div>
<div id="matrix"></div><div class="card" style="margin-top:10px"><b>Opname &amp; Loop</b><div id="studio"></div></div>
<div id="modus"></div>
<div id="kbd"></div><div id="knip"></div>
<div id="brain"></div></div></div>
<script src="../js/aura-engine.js"></script><script src="../js/instrument-matrix.js"></script>
<script src="../js/keyboard.js"></script><script src="../js/brain-memory.js"></script><script src="../js/studio-panel.js"></script><script src="../js/speel-modus.js"></script>
<script>
const SOUNDS = [
  // 🆕 G2B-gebouwde premium-bank — schone synths, over heel de piano-roll bruikbaar
  {naam:'G2B Sub', src:'../wav/bass/sub_E1.wav', basePitch:28},
  {naam:'G2B 808', src:'../wav/bass/808_E1.wav', basePitch:28},
  {naam:'G2B Reese', src:'../wav/bass/reese_E1.wav', basePitch:28},
  {naam:'G2B Bass', src:'../wav/bass/bass_E1.wav', basePitch:28},
  {naam:'G2B Pluck', src:'../wav/bass/pluck_E1.wav', basePitch:28},
  {naam:'G2B Sub Lo', src:'../wav/bass/sub_E0.wav', basePitch:16},
  {naam:'G2B 808 Hi', src:'../wav/bass/808_E2.wav', basePitch:40},
  {naam:'G2B Reese Hi', src:'../wav/bass/reese_E2.wav', basePitch:40},
  // Subs / Reese / 808 — échte OCHO-samples
  {naam:'Sub 808', src:'../wav/bass/sub808.wav', basePitch:36},
  {naam:'Reese', src:'../wav/bass/sub-rees.wav', basePitch:36},
  {naam:'Sub Donk', src:'../wav/bass/sub-donk.wav', basePitch:36},
  {naam:'Sub Warm', src:'../wav/bass/sub-warm.wav', basePitch:36},
  {naam:'Wobble', src:'../wav/bass/sub-wobb.wav', basePitch:36},
  {naam:'Sub Punch', src:'../wav/bass/sub-pnch.wav', basePitch:36},
  {naam:'Sub Glaf', src:'../wav/bass/sub-glaf.wav', basePitch:36},
  {naam:'Sub Held', src:'../wav/bass/sub-held.wav', basePitch:36},
  {naam:'Sub Distort', src:'../wav/bass/sub-dist.wav', basePitch:36},
  {naam:'Sub Vies', src:'../wav/bass/sub-vies.wav', basePitch:36},
  {naam:'Sub Kort', src:'../wav/bass/sub-kort.wav', basePitch:36},
  {naam:'Sub Lang', src:'../wav/bass/sub-lang.wav', basePitch:36},
  // Bassdrum / kicks
  {naam:'Sub Funk', src:'../wav/bass/funkbass.wav', basePitch:36},
  {naam:'Sub Epic', src:'../wav/bass/epicbass.wav', basePitch:36},
  {naam:'Sub Rockabilly', src:'../wav/bass/rockabillybass.wav', basePitch:36},
  {naam:'Sub Pop', src:'../wav/bass/popbass.wav', basePitch:36},
  {naam:'Sub Reggae', src:'../wav/bass/reggaetonbass.wav', basePitch:36},
  {naam:'Sub Lofi', src:'../wav/bass/lofibass.wav', basePitch:36},
  {naam:'Sub Droom', src:'../wav/bass/dromerigbass.wav', basePitch:36},
  {naam:'Sub Southern', src:'../wav/bass/southernbass.wav', basePitch:36},
  {naam:'Sub Afrobeat', src:'../wav/bass/afrobeatbas.wav', basePitch:36},
  {naam:'Sub Phonk', src:'../wav/bass/phonksub.wav', basePitch:36},
  {naam:'Sub Trap', src:'../wav/bass/trapsub.wav', basePitch:36},
  {naam:'Sub Drill', src:'../wav/bass/drillbas.wav', basePitch:36},
  {naam:'Sub RnB', src:'../wav/bass/rnbbas.wav', basePitch:36},
  {naam:'Sub Boombap', src:'../wav/bass/boombapbas.wav', basePitch:36},
  {naam:'Sub Corp', src:'../wav/bass/corporatebass.wav', basePitch:36},

  {naam:'Bassdrum A', src:'../wav/bass/b00_0.wav', basePitch:36},
  {naam:'Bassdrum B', src:'../wav/bass/b03_0.wav', basePitch:36},
  {naam:'Bassdrum C', src:'../wav/bass/b06_0.wav', basePitch:36},
  {naam:'Bassdrum D', src:'../wav/bass/b09_0.wav', basePitch:36},
  // DNA-SAMPLEX kicks
  {naam:'Kick Dembow', src:'../wav/bass/dembow_1_g2b.wav', basePitch:36},
  {naam:'Kick Tan', src:'../wav/bass/tanbase_0_g2b.wav', basePitch:36},
  {naam:'Kick G2B', src:'../wav/bass/kick_2_g2b.wav', basePitch:36},
  {naam:'Kick Layer', src:'../wav/bass/layer_bubbkick_g2b.wav', basePitch:36},
  {naam:'Kick Oogst', src:'../wav/bass/kick.wav', basePitch:36}
];
let tone = 1, len = 0.996;
(async () => {
  await Aura.init('../js/aura-dsp-worklet.js');
  InstrumentMatrix.build(document.getElementById('matrix'), SOUNDS);
  document.getElementById('toneSl').oninput = e => tone = +e.target.value;
  document.getElementById('lenSl').oninput = e => len = +e.target.value;
  bouwKeyboard(document.getElementById('kbd'), 2, 2);
  knipRij(document.getElementById('knip'));
  const panel = StudioPanel.bouw(document.getElementById('studio'));
  SpeelModus.bouw(document.getElementById('modus'));
  const orig = InstrumentMatrix.play.bind(InstrumentMatrix);
  // Toon → playbackRate op de sample; Lengte → hoe lang de sample doorklinkt (0.2s–4s)
  const hold = () => 0.2 + ((len - 0.990) / 0.0099) * 3.8;
  const _slot = (p, o = {}) => orig(p, { ...o, rate: tone, tone, hold: hold() });
  InstrumentMatrix.play = SpeelModus.wire(_slot, panel);
  BrainMemory.knop(document.getElementById('brain'));
})();
</script></body></html>
