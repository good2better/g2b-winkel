<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Dice Synth — AURA v6</title>
<link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<h1>🎲 Dice Synth <a href="../" style="float:right;font-size:12px">← AURA</a></h1>
<div class="card"><p>🎲 rolt een nieuwe synth — knoppen gaan mee.</p>
<div class="row"><button id="dice">🎲 Dice</button>
<label>Golf <select id="wave"><option>sine</option><option>saw</option><option>square</option><option>tri</option></select></label>
<label>Toon <input type="range" min="0.25" max="4" step="0.05" value="1" id="toneSl"></label>
<label>Lengte <input type="range" min="0.99" max="0.9999" step="0.0005" value="0.997" id="lenSl"></label>
<span id="pNaam" class="hint"></span></div>
<div id="modus"></div>
<div id="kbd"></div><div id="knip"></div>
<div class="card" style="margin-top:10px"><b>Opname &amp; Loop</b><div id="studio"></div></div>
<div id="brain"></div></div></div>
<script src="../js/aura-engine.js"></script><script src="../js/instrument-matrix.js"></script>
<script src="../js/keyboard.js"></script><script src="../js/brain-memory.js"></script><script src="../js/studio-panel.js"></script><script src="../js/speel-modus.js"></script>
<script>
const NAMEN = ['Neon Saw','Deep Sine','Glide Sq','Air Tri','Warm Pad','808 Roll','Reese Cut','Soft Pluck'];
let cur = { wave:'saw', tone:1, decay:0.997 };
const rnd = a => a[Math.floor(Math.random()*a.length)];
(async () => {
  await Aura.init('../js/aura-dsp-worklet.js');
  InstrumentMatrix.build(document.createElement('div'), []);
  InstrumentMatrix.play = (p,o={}) => Aura.noteOn(p,{wave:cur.wave,tone:(o.tone||1)*cur.tone,decay:cur.decay});
  bouwKeyboard(document.getElementById('kbd'),3,2);
  knipRij(document.getElementById('knip'));
  const naam = document.getElementById('pNaam');
  const setUI = () => {
    document.getElementById('wave').value = cur.wave;
    document.getElementById('toneSl').value = cur.tone;
    document.getElementById('lenSl').value = cur.decay;
  };
  document.getElementById('wave').onchange = e => cur.wave = e.target.value;
  document.getElementById('toneSl').oninput = e => cur.tone = +e.target.value;
  document.getElementById('lenSl').oninput = e => cur.decay = +e.target.value;
  document.getElementById('dice').onclick = () => {
    cur = { wave: rnd(['saw','sine','square','tri']), tone: 0.5+Math.random()*1.5,
            decay: 0.994+Math.random()*0.005 };
    naam.textContent = '→ ' + rnd(NAMEN);
    setUI(); // naam EN knoppen synchroon mee — fix Best-Of/Dren naam-bug
  };
  const panel = StudioPanel.bouw(document.getElementById('studio'));
  SpeelModus.bouw(document.getElementById('modus'));
  const orig = InstrumentMatrix.play;
  InstrumentMatrix.play = SpeelModus.wire(orig, panel);
  BrainMemory.knop(document.getElementById('brain'));
})();
</script></body></html>
