<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>AURA All-Instruments — v6</title>
<link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<h1>🎼 AURA All-Instruments <a href="../" style="float:right;font-size:12px">← AURA</a></h1>
<div class="card"><p>Alle instrumenten in 1 engine met categorieën. Groen = selecteren (solo of stapel).</p>
<div class="row"><label>Categorie <select id="catSel"></select></label></div>
<div id="matrix"></div><div id="kbd"></div><div id="knip"></div>
<div class="card" style="margin-top:10px"><b>Loop &amp; Step-Record</b><div id="raster"></div></div>
<div id="brain"></div></div></div>
<script src="../js/aura-engine.js"></script><script src="../js/instrument-matrix.js"></script>
<script src="../js/keyboard.js"></script><script src="../js/brain-memory.js"></script>
<script>
const CATS = {
  piano:['Piano C2','Piano C3','Piano C4','Donder Piano','House Piano','Piano Classic'],
  keys:['Hammond','Vibes','Marimba','Marimba Soft','Glockenspiel','Mbira'],
  strings:['Strings','Harp','Nylon Gitaar','Spaanse Gitaar','Clean Gitaar','Zouk Gitaar'],
  blazers:['Brass','Trombone','Fagot','Sax','Hobo','Blokfluit'],
  bass:['Bas A1','Bas C1','Bas D1','Bas E1','SF Bass','SF Sub808','Zouk Bas'],
  fusion:['Fus Gitaar','Fus Bas Karp','Fus Donder Harp'],
  drums:['Kick','Snare','Hat','Clap','Darbouka','Bell','Djembe','Bongo','Cowbell','Donk']
};
const SRC = {
  'Piano C2':'piano_kP_C2_v1','Piano C3':'piano_kP_C3_v1','Piano C4':'piano_kP_C4_v1',
  'Donder Piano':'donderpi','House Piano':'housepno','Piano Classic':'piano',
  'Hammond':'hammond','Vibes':'vibes','Marimba':'marimba','Marimba Soft':'mar_kMar_C2_s',
  'Glockenspiel':'glock_kGK_G4','Mbira':'mbira',
  'Strings':'strings','Harp':'har_kH_C4','Nylon Gitaar':'nylon','Spaanse Gitaar':'spaansgtr',
  'Clean Gitaar':'egtrclean','Zouk Gitaar':'zoukgit',
  'Brass':'bra_kBra_C3','Trombone':'bra_kTbn_D3','Fagot':'bsn_kBsn_C3','Sax':'sax_kSx50_1',
  'Hobo':'obo_kObo_D4','Blokfluit':'rec_kRec_C4',
  'Bas A1':'A1','Bas C1':'C1','Bas D1':'D1','Bas E1':'E1',
  'SF Bass':'bas_sf_bass_1792585597','SF Sub808':'bas_sf_sub808_1792585596','Zouk Bas':'zoukbas',
  'Fus Gitaar':'kS_FUSGITDAN_39_v1','Fus Bas Karp':'kS_FUSBASKARP_30_v1','Fus Donder Harp':'kS_FUSDONDHARP_35_v1',
  'Kick':'kD_kick','Snare':'kD_snare','Hat':'kD_hat','Clap':'kD_clap','Darbouka':'kD_darb',
  'Bell':'kD_bell','Djembe':'dru_sf_djembe_1792585593','Bongo':'dru_sf_bongo_1792585593',
  'Cowbell':'dru_sf_cowbell_1792585593','Donk':'dru_sf_donk_1792585594'
};
let sounds = [];
for (const [cat,items] of Object.entries(CATS))
  items.forEach(n => sounds.push({naam:n, cat, src:`../wav/instr/${SRC[n]}.wav`}));
(async () => {
  await Aura.init('../js/aura-dsp-worklet.js');
  const sel = document.getElementById('catSel');
  sel.innerHTML = Object.keys(CATS).map(c => `<option>${c}</option>`).join('');
  const build = cat => InstrumentMatrix.build(document.getElementById('matrix'),
    cat ? sounds.filter(s => s.cat === cat) : sounds);
  sel.onchange = () => build(sel.value); build('');
  sel.value = 'keys'; build('keys');
  bouwKeyboard(document.getElementById('kbd'), 3, 2);
  knipRij(document.getElementById('knip'));
  const ras = Aura.loopRaster(document.getElementById('raster')); ras.start();
  const orig = InstrumentMatrix.play.bind(InstrumentMatrix);
  InstrumentMatrix.play = (p,o) => { ras.hit(p); orig(p,o); };
  BrainMemory.knop(document.getElementById('brain'));
})();
</script></body></html>
