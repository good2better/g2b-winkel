<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎮 G2B GAME-FABRIEK</title>
<style>
:root{--groen:#16a34a;--donker:#0b1220;--kaart:#131c2e;--rand:#22314d;--tekst:#e8eef8;--zacht:#9fb0c9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--donker);color:var(--tekst);font:15px/1.5 system-ui,sans-serif;padding:24px;max-width:920px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:4px}
.sub{color:var(--zacht);margin-bottom:20px}
.kaart{background:var(--kaart);border:1px solid var(--rand);border-radius:14px;padding:18px;margin-bottom:14px}
.kaart h2{font-size:1rem;margin-bottom:12px;color:#7ee2a8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kies{background:#0d1626;border:1px solid var(--rand);border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center;transition:.15s}
.kies:hover{border-color:var(--groen)}
.kies.aan{border-color:var(--groen);background:#12351f;box-shadow:0 0 0 1px var(--groen)}
.kies .ic{font-size:1.7rem;display:block;margin-bottom:4px}
.kies .nm{font-size:.85rem;font-weight:600}
.kies .info{font-size:.7rem;color:var(--zacht)}
input[type=text],select{width:100%;background:#0d1626;border:1px solid var(--rand);border-radius:8px;color:var(--tekst);padding:10px;font-size:1rem;margin-top:6px}
label{font-size:.8rem;color:var(--zacht)}
.rij{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.knop{width:100%;background:var(--groen);color:#fff;border:0;border-radius:12px;padding:16px;font-size:1.15rem;font-weight:700;cursor:pointer;margin-top:8px}
.knop:hover{background:#1db954}
.log{background:#0a0f1a;border:1px solid var(--rand);border-radius:10px;padding:12px;font:12px/1.6 monospace;color:#8fe3ad;white-space:pre-wrap;max-height:200px;overflow:auto;display:none}
.log.toon{display:block}
.tag{display:inline-block;background:#12351f;color:#7ee2a8;border-radius:20px;padding:2px 10px;font-size:.72rem;margin-left:6px}
</style>
</head>
<body>
<h1>🎮 G2B GAME-FABRIEK</h1>
<p class="sub">Maak een compleet spel in één bestand — 100% eigen code, gratis, commercieel te verkopen.</p>

<div class="kaart">
<h2>1. Wat voor spel?</h2>
<div class="grid" id="types"></div>
</div>

<div class="kaart">
<h2>2. Welk thema?</h2>
<div class="grid" id="themas"></div>
</div>

<div class="kaart">
<h2>3. Naam en instellingen</h2>
<div class="rij">
<div><label>Spelnaam</label><input type="text" id="naam" value="Animal Heroes"></div>
<div><label>Leeftijd</label><select id="moeilijk"><option value="peuter">🍼 2-4 jaar (peuter)</option><option value="kleuter">🧒 5-8 jaar (groep 1-4)</option><option value="kind" selected>🎮 9-12 jaar (groep 5-8)</option><option value="groot">🔥 13+ jaar</option></select></div>
</div>
</div>

<div class="kaart">
<h2>4. Eigen foto's (optioneel) — jij in het spel</h2>
<div class="rij">
<div><label>📷 Held (jouwe foto)</label><input type="file" id="heldfoto" accept="image/*" style="margin-top:6px"><div id="heldprev" style="margin-top:6px"></div></div>
<div><label>👥 Extra karakters (meerdere foto's)</label><input type="file" id="xfotos" accept="image/*" multiple style="margin-top:6px"><div id="xprev" style="margin-top:6px;font-size:.75rem;color:var(--zacht)"></div></div>
</div>
</div>

<button class="knop" id="maak">🎮 MAAK MIJN SPEL</button>
<div class="log" id="log"></div>

<script>
const TYPES=[
 {id:'vang',ic:'🧺',nm:'Vang-Spel',info:'Vallende dingen opvangen'},
 {id:'tap',ic:'👆',nm:'Tik-Spel',info:'Snel op de goede tikken'},
 {id:'memory',ic:'🃏',nm:'Memory',info:'Paren zoeken'},
 {id:'renner',ic:'🏃',nm:'Renner',info:'Spring over obstakels'},
 {id:'schiet',ic:'🚀',nm:'Schutter',info:'Beweeg en schiet'},
 {id:'slang',ic:'🐍',nm:'Slang',info:'Klassieke slang'},
 {id:'quiz',ic:'❓',nm:'Quiz',info:'Vragen met thema'},
 {id:'doolhof',ic:'🌽',nm:'Verzamelaar',info:'Alles oppakken, ontwijk vijanden'},
 {id:'platform',ic:'🏔️',nm:'Platformer',info:'Echte getekende wereld + levels'},
 {id:'ritme',ic:'🎹',nm:'Muziek-Ritme',info:'Raak de noten op de beat'},
];
const THEMAS=[
 {id:'dieren',ic:'🦁',nm:'Dieren',items:['🐶','🐱','🐰','🦊','🐻','🐼','🦁','🐸','🐷','🐵'],vijand:'🐍',held:'🐶',achtergr:'#0e2a1a',acc:'#4ade80'},
 {id:'ruimte',ic:'🚀',nm:'Ruimte',items:['⭐','🪐','☄️','🌙','🛸','👾'],vijand:'👾',held:'🚀',achtergr:'#0a0e2a',acc:'#818cf8'},
 {id:'zee',ic:'🐠',nm:'Zee',items:['🐟','🐠','🐡','🦀','🐙','🦑','🐬'],vijand:'🦈',held:'🐠',achtergr:'#062a3a',acc:'#22d3ee'},
 {id:'snoep',ic:'🍬',nm:'Snoep',items:['🍬','🍭','🍫','🧁','🍩','🍪','🍰'],vijand:'🥦',held:'🧁',achtergr:'#33142e',acc:'#f472b6'},
 {id:'sport',ic:'⚽',nm:'Sport',items:['⚽','🏀','🏈','⚾','🎾','🏐','🥎'],vijand:'🃏',held:'⚽',achtergr:'#12300f',acc:'#a3e635'},
 {id:'muziek',ic:'🎵',nm:'Muziek',items:['🎵','🎶','🎸','🎹','🥁','🎤','🎺'],vijand:'🔇',held:'🎵',achtergr:'#1e1033',acc:'#c084fc'},
];
const MOEILIJK={peuter:{snel:.45,leven:99,fout:99},kleuter:{snel:.7,leven:5,fout:5},kind:{snel:1,leven:3,fout:3},groot:{snel:1.5,leven:2,fout:2}};
let type='vang',thema='dieren';
const T=id=>document.getElementById(id);
function bouwKies(el,lijst,kies){
 lijst.forEach(t=>{const d=document.createElement('div');d.className='kies';d.innerHTML=`<span class="ic">${t.ic}</span><span class="nm">${t.nm}</span><div class="info">${t.info||''}</div>`;
  d.onclick=()=>{el.querySelectorAll('.kies').forEach(k=>k.classList.remove('aan'));d.classList.add('aan');kies(t.id)};el.appendChild(d)});
 el.firstChild.classList.add('aan')}
bouwKies(T('types'),TYPES,v=>type=v);bouwKies(T('themas'),THEMAS,v=>thema=v);

function log(t){const L=T('log');L.classList.add('toon');L.textContent+=t+'\n'}

/* foto-uploads: held + extra karakters als dataURL */
let heldImg=null,xImgs=[];
function leesFoto(file){return new Promise(r=>{const fr=new FileReader();
 fr.onload=e=>{const im=new Image();im.onload=()=>{/* verklein naar max 160px → kleine game */
  const c=document.createElement('canvas'),s=Math.min(1,160/Math.max(im.width,im.height));
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  r(c.toDataURL('image/png'))};im.src=e.target.result};fr.readAsDataURL(file)})}
T('heldfoto').onchange=async e=>{heldImg=await leesFoto(e.target.files[0]);
 T('heldprev').innerHTML=`<img src="${heldImg}" style="width:48px;height:48px;border-radius:50%;border:2px solid var(--groen)">`;
 log('📷 held-foto klaar — jij speelt jezelf')};
T('xfotos').onchange=async e=>{xImgs=[];for(const f of e.target.files)xImgs.push(await leesFoto(f));
 T('xprev').textContent=xImgs.length+' karakter(s) klaar — die komen in het spel';
 log('👥 '+xImgs.length+' extra karakters geladen')};

/* ===== SPEL-GENERATOREN — elke functie geeft complete game-JS terug ===== */
const H=(naam,t)=>`<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${naam}</title><style>body{margin:0;background:${t.achtergr};display:flex;flex-direction:column;align-items:center;font-family:system-ui;color:#fff;min-height:100vh}
h1{font-size:1.1rem;margin:10px}canvas{background:${t.achtergr};border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:18px;font-size:1rem;margin:6px}#over{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#over h2{font-size:2rem}button{background:${t.acc};border:0;color:#042;padding:12px 28px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:12px}
.tip{opacity:.7;font-size:.8rem;margin:6px}</style></head><body>
<h1>${naam}</h1><div id="hud"><span id="score">⭐ 0</span><span id="lvs">❤️</span><span id="hs"></span></div>
<canvas id="c" width="420" height="560"></canvas><div class="tip">⬅️ ➡️ of tik/sleep — Spatie = actie — 🎮 gamepad werkt ook</div>
<div id="over"><h2 id="ot"></h2><p id="os"></p><button onclick="location.reload()">Opnieuw</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=C.width,Hh=C.height;
const T=${JSON.stringify('THEMA')},D=${JSON.stringify('MOEIL')};
let score=0,lev=D.leven,af=false,HSK='g2bhs_'+document.title,hs=+(localStorage.getItem(HSK)||0);
document.getElementById('hs').textContent=hs?'🏆 '+hs:'';
const lvs=()=>document.getElementById('lvs').textContent='❤️'.repeat(lev);lvs();
const A=new(window.AudioContext||window.webkitAudioContext)();
const blip=(f,d=.08,type='square',v=.15)=>{const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)};
const punt=n=>{score+=n;document.getElementById('score').textContent='⭐ '+score;if(score>hs){hs=score;localStorage.setItem(HSK,hs);document.getElementById('hs').textContent='🏆 '+hs}};
const einde=()=>{af=true;document.getElementById('over').style.display='flex';document.getElementById('ot').textContent=score>0?'🎉 Goed gedaan!':'😅 Nog een keer?';document.getElementById('os').textContent='Score: '+score+(score>=hs&&score>0?' — NIEUW RECORD!':'');blip(180,.4,'sawtooth')};
const emoji=(e,x,y,s)=>{X.font=s+'px serif';X.textAlign='center';X.textBaseline='middle';X.fillText(e,x,y)};
/* eigen foto's als sprites: held + extra karakters */
const FOTOS=${JSON.stringify('FOTOS')};
const _pi=u=>{const i=new Image();i.src=u;return i};
const FHELD=FOTOS.held?_pi(FOTOS.held):null;
const FITEMS=(FOTOS.items||[]).map(_pi);
const _rond=(i,x,y,s)=>{X.save();X.beginPath();X.arc(x,y,s/2,0,7);X.clip();X.drawImage(i,x-s/2,y-s/2,s,s);X.restore();X.strokeStyle=T.acc;X.lineWidth=2;X.beginPath();X.arc(x,y,s/2,0,7);X.stroke()};
const ok=i=>i&&i.complete&&i.naturalWidth;
const held=(x,y,s)=>{if(ok(FHELD))_rond(FHELD,x,y,s);else emoji(T.held,x,y,s)};
const itemX=(i,x,y,s)=>{const im=FITEMS.length?FITEMS[i%FITEMS.length]:null;if(ok(im))_rond(im,x,y,s);else emoji(T.items[i%T.items.length],x,y,s)};
const rand=(a,b)=>a+Math.random()*(b-a);
let px=W/2,keys={};addEventListener('keydown',e=>{keys[e.key]=true;if(A.state=='suspended')A.resume()});addEventListener('keyup',e=>keys[e.key]=false);
let tx=null;C.addEventListener('pointermove',e=>{tx=e.offsetX*W/C.clientWidth});C.addEventListener('pointerdown',e=>{tx=e.offsetX*W/C.clientWidth;if(A.state=='suspended')A.resume();tik(e.offsetX*W/C.clientWidth,e.offsetY*Hh/C.clientHeight)});
/* gamepad: joystick/dpad sturen, A/B = actie */
const PAD=()=>{try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(!g)return{l:0,r:0,u:0,d:0,a:0};
 const ax=g.axes[0]||0,ay=g.axes[1]||0,B=i=>g.buttons[i]&&g.buttons[i].pressed;
 return{l:ax<-.3||B(14),r:ax>.3||B(15),u:ay<-.3||B(12),d:ay>.3||B(13),a:B(0)||B(1)}}catch(e){return{l:0,r:0,u:0,d:0,a:0}}};
addEventListener('gamepadconnected',()=>{if(A.state=='suspended')A.resume()});
function tik(x,y){}
`;

const GEN={
/* VANG: vallende items opvangen met een mandje */
vang:(naam,t,d)=>H(naam,t)+`
let mand={x:W/2},items=[],t=0,spd=1.8*D.snel;
function spawn(){items.push({x:rand(30,W-30),y:-20,v:spd*rand(.8,1.4),ix:Math.floor(rand(0,20)),e:Math.random()<.85?T.items[Math.floor(rand(0,T.items.length))]:T.vijand, kwaad:Math.random()<.15})}
function tik(x){}
(function loop(){if(af)return;X.clearRect(0,0,W,Hh);
 const pd=PAD();if(keys['ArrowLeft']||pd.l)mand.x-=6;if(keys['ArrowRight']||pd.r)mand.x+=6;if(tx!=null)mand.x+=(tx-mand.x)*.2;
 mand.x=Math.max(30,Math.min(W-30,mand.x));
 if(++t>40/D.snel){t=0;spawn()}
 held(mand.x,Hh-56,44);X.fillStyle=T.acc;X.fillRect(mand.x-38,Hh-72,76,6);
 items.forEach(i=>{i.y+=i.v;if(i.kwaad)emoji(T.vijand,i.x,i.y,34);else itemX(i.ix,i.x,i.y,34);
  if(i.y>Hh-78&&Math.abs(i.x-mand.x)<44){if(i.kwaad){lev--;lvs();blip(120,.3,'sawtooth')}else{punt(10);blip(600,.1,'triangle')}i.y=Hh+99}
  if(i.y>Hh-10&&!i.kwaad){i.y=Hh+99}});
 items=items.filter(i=>i.y<Hh+50);
 if(lev<=0)einde();else requestAnimationFrame(loop)})();
</`+'script></body></html>',

/* TAP: tik de goede voordat hij weg is */
tap:(naam,t,d)=>H(naam,t)+`
let doel,t=0,levenT=0;
function nieuw(){doel={x:rand(50,W-50),y:rand(80,Hh-120),ix:Math.floor(rand(0,20)),e:Math.random()<.7?T.items[Math.floor(rand(0,T.items.length))]:T.vijand,kwaad:Math.random()<.3,r:34,age:0}}
nieuw();
function tik(x,y){if(!doel)return;const dx=x-doel.x,dy=y-doel.y;
 if(dx*dx+dy*dy<doel.r*doel.r*2){if(doel.kwaad){lev--;lvs();blip(120,.3,'sawtooth')}else{punt(15);blip(700,.1,'triangle')}doel=null}}
(function loop(){if(af)return;X.clearRect(0,0,W,Hh);
 if(!doel){if(++t>30)nieuw()}else{doel.age++;if(doel.kwaad)emoji(T.vijand,doel.x,doel.y,46);else itemX(doel.ix,doel.x,doel.y,40);
  X.strokeStyle=doel.kwaad?'#f44':T.acc;X.lineWidth=3;X.beginPath();X.arc(doel.x,doel.y,doel.r+8-doel.age*.15,0,7);X.stroke();
  if(doel.age>90){if(!doel.kwaad){}doel=null;t=0}}
 if(lev<=0)einde();else requestAnimationFrame(loop)})();
</`+'script></body></html>',

/* MEMORY: paren zoeken op een 4x4 grid */
memory:(naam,t,d)=>`<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${naam}</title>
<style>body{margin:0;background:${t.achtergr};display:flex;flex-direction:column;align-items:center;font-family:system-ui;color:#fff;min-height:100vh}
h1{margin:12px}#b{display:grid;grid-template-columns:repeat(4,72px);gap:10px;margin-top:14px}
.k{width:72px;height:72px;background:#ffffff18;border:2px solid ${t.acc};border-radius:12px;font-size:2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}
.k.open{background:${t.acc}}#hud{margin:8px;font-size:1.1rem}#over{display:none;text-align:center;margin:20px;font-size:1.4rem}
button{background:${t.acc};border:0;color:#042;padding:10px 24px;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body>
<h1>${naam}</h1><div id="hud">⭐ <span id="s">0</span> — zetten: <span id="z">0</span></div><div id="b"></div><div id="over">🎉 Alles gevonden! <button onclick="location.reload()">Opnieuw</button></div>
<script>
const T=${JSON.stringify('THEMA')};let kaarten=T.items.slice(0,8);kaarten=kaarten.concat(kaarten).sort(()=>Math.random()-.5);
let open=[],klaar=0,zet=0,score=0,blok=false;
const B=document.getElementById('b');
const A=new(window.AudioContext||window.webkitAudioContext)();
const blip=f=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.1)};
const FOTOS=${JSON.stringify('FOTOS')};const FITEMS=(FOTOS.items||[]).map(u=>{const i=new Image();i.src=u;return i});
kaarten.forEach((e,i)=>{const k=document.createElement('div');k.className='k';k.textContent='❓';
 k.onclick=()=>{if(blok||k.classList.contains('open'))return;k.classList.add('open');
  if(FITEMS.length){const im=FITEMS[i%FITEMS.length];k.innerHTML='';const m=document.createElement('img');m.src=im.src;m.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:10px';k.appendChild(m)}
  else k.textContent=e;blip(500);open.push({k,e});
  if(open.length==2){zet++;document.getElementById('z').textContent=zet;
   if(open[0].e==open[1].e){score+=20;document.getElementById('s').textContent=score;blip(750);klaar+=2;open=[];if(klaar==16)document.getElementById('over').style.display='block'}
   else{blok=true;setTimeout(()=>{open.forEach(o=>{o.k.classList.remove('open');o.k.textContent='❓'});open=[];blok=false},700)}}};
 B.appendChild(k)});
</`+'script></body></html>',

/* RENNER: spring over obstakels */
renner:(naam,t,d)=>H(naam,t)+`
let y=Hh-90,vy=0,grond=Hh-90,obs=[],t=0,spd=4*D.snel,dist=0;
addEventListener('keydown',e=>{if(e.key==' '&&y>=grond-1){vy=-11;blip(300,.15,'triangle')}});
function tik(){if(y>=grond-1){vy=-11;blip(300,.15,'triangle')}}
(function loop(){if(af)return;X.clearRect(0,0,W,Hh);
 if(PAD().a&&y>=grond-1){vy=-11;blip(300,.15,'triangle')}
 X.strokeStyle=T.acc;X.beginPath();X.moveTo(0,grond+24);X.lineTo(W,grond+24);X.stroke();
 vy+=.55;y+=vy;if(y>grond){y=grond;vy=0}
 if(++t>Math.max(35,80-dist*.005)){t=0;obs.push({x:W+30,kwaad:true})}
 held(70,y,44);
 obs.forEach(o=>{o.x-=spd+dist*.0004;emoji(T.vijand,o.x,grond,40);
  if(Math.abs(o.x-70)<32&&y>grond-40){lev--;lvs();blip(120,.3,'sawtooth');o.x=-99}});
 obs=obs.filter(o=>o.x>-40);dist+=spd;if(dist%200<spd)punt(1);
 if(lev<=0)einde();else requestAnimationFrame(loop)})();
</`+'script></body></html>',

/* SCHIET: beweeg + schiet op vallende vijanden */
schiet:(naam,t,d)=>H(naam,t)+`
let ship={x:W/2},kogels=[],vij=[],t=0,spd=2*D.snel,pT=0;
addEventListener('keydown',e=>{if(e.key==' '){kogels.push({x:ship.x,y:Hh-90});blip(900,.05)}});
function tik(x){kogels.push({x:ship.x,y:Hh-90});blip(900,.05)}
(function loop(){if(af)return;X.clearRect(0,0,W,Hh);
 const pd=PAD();if(pd.a&&++pT>12){pT=0;kogels.push({x:ship.x,y:Hh-90});blip(900,.05)}
 if(keys['ArrowLeft']||pd.l)ship.x-=6;if(keys['ArrowRight']||pd.r)ship.x+=6;if(tx!=null)ship.x+=(tx-ship.x)*.25;
 ship.x=Math.max(26,Math.min(W-26,ship.x));
 if(++t>34/D.snel){t=0;vij.push({x:rand(30,W-30),y:-20,v:spd*rand(.8,1.5)})}
 held(ship.x,Hh-60,42);
 kogels.forEach(k=>{k.y-=9;X.fillStyle=T.acc;X.fillRect(k.x-2,k.y,4,12)});
 vij.forEach(v=>{v.y+=v.v;emoji(v.kwaad===undefined?T.vijand:T.items[0],v.x,v.y,36);
  kogels.forEach(k=>{if(Math.abs(k.x-v.x)<24&&Math.abs(k.y-v.y)<24){v.y=Hh+99;k.y=-99;punt(10);blip(500,.12,'square')}});
  if(v.y>Hh-50){lev--;lvs();blip(120,.3,'sawtooth');v.y=Hh+99}});
 kogels=kogels.filter(k=>k.y>-20);vij=vij.filter(v=>v.y<Hh+40);
 if(lev<=0)einde();else requestAnimationFrame(loop)})();
</`+'script></body></html>',

 else if(r<.7&&D.snel>1)noten.push({b,baan:Math.floor(rand(0,4))},{b:b+.5,baan:Math.floor(rand(0,4))})}
let gestart=false,t0=0,combo=0,maxC=0,hit='',hitT=0,miss=0;

 const n=noten.find(n=>!n.hit&&!n.gemist&&n.baan==i&&Math.abs(n.b-nu)<.28);
 if(n){n.hit=true;const afw=Math.abs(n.b-nu);

 else{combo=0;hit='';blip(200,.15,'sawtooth')}};

let ci=0;
const startKnop=document.createElement('button');startKnop.textContent='▶ START MUZIEK';startKnop.style.cssText='position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);z-index:5';
document.body.appendChild(startKnop);

 /* beat vooruit-scheduleren */

  while(ci<60&&ci*SPB<nu+1){const b=ci;kick(t0+b*SPB);if(b%2)hat(t0+b*SPB+SPB/2);if(b%4==1||b%4==3)snare(t0+b*SPB);ci++}
  setTimeout(sched,60)};sched()};
(function loop(){if(af)return;const nu=gestart?(A.currentTime-t0)/SPB:0;
 /* tekening */
 const gr=X.createLinearGradient(0,0,0,Hh);gr.addColorStop(0,'#12051f');gr.addColorStop(.6,T.achtergr);gr.addColorStop(1,'#050210');X.fillStyle=gr;X.fillRect(0,0,W,Hh);

 for(let i=0;i<N;i++){X.fillStyle=i%2?'#ffffff08':'#ffffff05';X.fillRect(i*LW+2,60,LW-4,LY-60);
  X.strokeStyle='#ffffff18';X.strokeRect(i*LW+2,60,LW-4,LY-60)}
 /* hit-lijn */
 X.fillStyle=T.acc;X.fillRect(0,LY,W,4);
 for(let i=0;i<N;i++){X.fillStyle=KL[i];X.globalAlpha=.35;X.beginPath();X.arc(i*LW+LW/2,LY+2,22,0,7);X.fill();X.globalAlpha=1;
  X.fillStyle='#fff';X.font='bold 16px system-ui';X.fillText(TOETS[i],i*LW+LW/2,LY+30)}
 /* noten vallen */
 const snel=(LY-60)/(SPB*3); /* 3 beats leidtijd */
 noten.forEach(n=>{if(n.hit||n.gemist)return;const y=60+(nu-n.b+3)*snel/3;

  const g=X.createRadialGradient(n.baan*LW+LW/2,y,2,n.baan*LW+LW/2,y,18);g.addColorStop(0,'#fff');g.addColorStop(.4,KL[n.baan]);g.addColorStop(1,KL[n.baan]+'00');
  X.fillStyle=g;X.beginPath();X.arc(n.baan*LW+LW/2,y,17,0,7);X.fill();
  X.fillStyle='#fff';X.font='13px system-ui';X.fillText('♪',n.baan*LW+LW/2,y)});
 /* held bovenop danst mee */
 if(ok(FHELD))_rond(FHELD,W/2,32,44);else emoji(T.held,W/2,32,44);
 /* combo + hit-tekst */
 if(combo>1){X.fillStyle=T.acc;X.font='bold 20px system-ui';X.fillText(combo+'x combo',W/2,80)}
 if(A.currentTime-hitT<.6&&hit){X.fillStyle=hit=='MISS'?'#f66':hit=='PERFECT!'?'#fde047':'#a3e635';X.font='bold 24px system-ui';X.fillText(hit,W/2,Hh/2)}
 /* einde na laatste noot */
 if(ci>=60&&noten.every(n=>n.hit||n.gemist)){af=true;document.getElementById('over').style.display='flex';
  document.getElementById('ot').textContent='🎵 Nummer klaar!';document.getElementById('os').textContent='Score: '+score+' — Beste combo: '+maxC+'x';return}
 if(lev<=0)einde();else requestAnimationFrame(loop)})();
