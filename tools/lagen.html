<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2B LAGEN — machines onder elkaar</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--grn:#19c37d}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,sans-serif;padding:14px;max-width:1100px;margin:0 auto}
h1{font-size:18px;margin-bottom:4px}
.utl{color:var(--dim);font-size:12px;margin-bottom:14px}
.mach{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.mach .kop{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:#1c2128}
.mach .kop b{font-size:12px;color:var(--grn)}
.mach .kop span{font-size:11px;color:var(--dim)}
.mach .kop button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:11px}
.mach .kop button:hover{color:#f85149;border-color:#f85149}
.mach iframe{display:block;width:100%;height:760px;border:0;background:#0d1117}
.plus{display:block;width:100%;padding:12px;background:var(--panel);border:2px dashed var(--line);border-radius:10px;color:var(--grn);font-size:15px;cursor:pointer}
.plus:hover{border-color:var(--grn)}
</style>
</head>
<body>
<h1 id="t">🧅 G2B LAGEN</h1>
<div class="utl">Elke <b>+</b> opent een eigen machine met z'n eigen grid. Laag voor laag bouwen — ze kunnen allemaal tegelijk spelen.</div>
<button class="plus" onclick="voegToe()">＋ nieuwe machine</button>
<div id="lijst"></div>
<button class="plus" onclick="voegToe()">＋ nieuwe machine</button>
<script>
const P=new URLSearchParams(location.search);
const tool=P.get('tool')||'patroon-brein/breinpro-mijn.html';
const naam=P.get('naam')||tool.split('/').pop();
document.getElementById('t').textContent='🧅 '+naam+' · LAGEN';
let n=0;
function voegToe(){
 n++;
 const d=document.createElement('div');d.className='mach';
 d.innerHTML=`<div class="kop"><b>MACHINE ${n}</b><span>eigen grid · eigen sound · eigen tempo</span><button onclick="this.closest('.mach').remove()">✕ weg</button></div><iframe src="${tool}"></iframe>`;
 document.getElementById('lijst').appendChild(d);
}
voegToe();
</script>
</body>
</html>
