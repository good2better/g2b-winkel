<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>G2B Live Overlay</title>
<style>
:root{--groen:#20e68b;--goud:#ffd66b;--tekst:#f2fff8}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--tekst)}body{font-synthesis:none}.fx{position:absolute;inset:0;pointer-events:none}.lower{position:absolute;left:4vw;bottom:5vh;max-width:72vw;transform:translateY(130%);transition:transform .55s cubic-bezier(.2,.9,.2,1);filter:drop-shadow(0 18px 35px #000b)}.lower.show{transform:translateY(0)}.brandline{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(90deg,#20e68b,#9df7cb);color:#03160c;border-radius:999px;padding:7px 13px;font-weight:1000;font-size:clamp(12px,1.4vw,20px);box-shadow:0 0 28px #20e68b55}.brandline i{width:9px;height:9px;background:#ff3757;border-radius:50%;box-shadow:0 0 16px #ff3757;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}.titlebox{margin-top:8px;background:linear-gradient(90deg,#06100bee,#123a27d9 74%,transparent);border-left:7px solid var(--groen);border-radius:0 20px 20px 0;padding:14px 28px 15px 18px;backdrop-filter:blur(8px)}h1{font-size:clamp(24px,4vw,62px);line-height:.98;margin:0;letter-spacing:-.05em;text-shadow:0 4px 20px #000}.sub{margin-top:7px;font-size:clamp(13px,1.8vw,25px);color:#c9f7dd;font-weight:800}.cta{position:absolute;right:4vw;bottom:5vh;max-width:25vw;background:linear-gradient(145deg,#08130eee,#173d2bee);border:1px solid #20e68b88;border-radius:22px;padding:15px 18px;box-shadow:0 18px 50px #000a;transform:translateY(150%);transition:.5s}.cta.show{transform:translateY(0)}.cta .mini{font-size:clamp(10px,1vw,14px);color:#9fc5b1;text-transform:uppercase;letter-spacing:.12em;font-weight:1000}.cta .big{font-size:clamp(16px,2vw,30px);font-weight:1000;line-height:1.08;margin-top:5px}.cta .link{font-size:clamp(11px,1.25vw,17px);color:var(--goud);font-weight:900;margin-top:7px}.question{position:absolute;top:5vh;right:4vw;max-width:34vw;background:#06100ce8;border:1px solid #73c7ff88;border-radius:20px;padding:14px 17px;box-shadow:0 18px 50px #000a;opacity:0;transform:translateY(-20px);transition:.45s}.question.show{opacity:1;transform:translateY(0)}.question .mini{color:#73c7ff;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:1000}.question .txt{font-size:clamp(16px,2vw,29px);font-weight:900;margin-top:6px}.ticker{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,#020806f2,#0e2a1df2,#020806f2);border-top:1px solid #20e68b44;padding:7px 0;white-space:nowrap;overflow:hidden;opacity:0;transition:.35s}.ticker.show{opacity:1}.ticker span{display:inline-block;padding-left:100%;animation:tick 20s linear infinite;font-weight:900;color:#dfffee;font-size:clamp(12px,1.5vw,20px)}@keyframes tick{to{transform:translateX(-100%)}}.corner{position:absolute;top:4vh;left:4vw;display:flex;align-items:center;gap:9px;background:#020806cc;border:1px solid #20e68b55;border-radius:999px;padding:7px 12px;font-weight:1000;font-size:clamp(11px,1.2vw,17px);opacity:.95}.corner i{width:10px;height:10px;border-radius:50%;background:#ff3757;box-shadow:0 0 15px #ff3757;animation:pulse 1s infinite}.spark{position:absolute;border-radius:50%;background:var(--groen);filter:blur(.2px);animation:float 5s ease-in-out infinite;opacity:.55}@keyframes float{50%{transform:translateY(-28px) translateX(12px) scale(1.25)}}body.clean .cta,body.clean .question,body.clean .ticker{display:none}body.questionmode .cta{display:none}body.productmode .question{display:none}@media(max-width:700px){.lower{max-width:92vw}.cta{right:3vw;max-width:42vw}.question{max-width:70vw}}
</style>
</head>
<body class="productmode">
<div class="fx" id="fx"></div>
<div class="corner"><i></i><span>G2B LIVE</span></div>
<section class="lower show" id="lower"><div class="brandline"><i></i>GOOD2BETER LIVE</div><div class="titlebox"><h1 id="title">G2B Live</h1><div class="sub" id="product">live bouwen, leren en vragen beantwoorden</div></div></section>
<aside class="cta show" id="ctaBox"><div class="mini">nu in de live</div><div class="big" id="offer">Gratis uitleg + bonus</div><div class="link" id="cta">good2better.com</div></aside>
<aside class="question" id="questionBox"><div class="mini">vraag uit de chat</div><div class="txt" id="question">Hoe kan ik dit zelf gebruiken?</div></aside>
<div class="ticker show" id="ticker"><span id="ticktext">G2B Live · maak mee · stel je vraag · clips en les volgen na de stream ·</span></div>
<script>
'use strict';
const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);
let state={title:qs.get('title')||'G2B Live — maak mee en stel je vraag',product:qs.get('product')||'live bouwen, leren en vragen beantwoorden',cta:qs.get('cta')||'good2better.com',offer:qs.get('offer')||'gratis uitleg + bonus',scene:qs.get('scene')||'product'};
function esc(s){return String(s||'').slice(0,160)}
function apply(s){state=Object.assign(state,s||{});$('title').textContent=esc(state.title);$('product').textContent=esc(state.product);$('cta').textContent=esc(state.cta);$('offer').textContent=esc(state.offer);$('ticktext').textContent=(esc(state.title)+' · '+esc(state.cta)+' · stel je vraag · clips volgen na de live · ').repeat(2);document.body.className=state.scene==='question'?'questionmode':state.scene==='product'?'productmode':'clean';$('questionBox').classList.toggle('show',state.scene==='question');$('ctaBox').classList.toggle('show',state.scene==='product');$('ticker').classList.toggle('show',state.scene!=='clean')}
function poll(){try{let s=JSON.parse(localStorage.getItem('g2b-live-overlay')||'null');if(s)apply(s)}catch(e){}}
try{let ch=new BroadcastChannel('g2b-live');ch.onmessage=e=>apply(e.data)}catch(e){}
function sparks(){let fx=$('fx');for(let i=0;i<28;i++){let d=document.createElement('i');d.className='spark';let sz=2+Math.random()*6;d.style.width=d.style.height=sz+'px';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=(-Math.random()*5)+'s';d.style.opacity=.15+Math.random()*.5;if(i%3)d.style.background=i%2?'#ffd66b':'#20e68b';else d.style.background='#73c7ff';fx.appendChild(d)}}
sparks();apply(state);setInterval(poll,1000);window.G2BLiveOverlay={state,apply,poll,refresh:()=>{poll();return state},version:1};
</script>
</body>
</html>
