<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probleem melden — G2B</title>
<style>
:root{--bg:#0d0f0e;--panel:#171a19;--line:#2a2f2d;--txt:#e8ecea;--dim:#8fa098;--accent:#2fbf71}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.65 'Segoe UI',system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 18px 60px}
h1{color:var(--accent);font-size:24px;margin-bottom:4px}
.sub{color:var(--dim);font-size:14px;margin-bottom:20px}
label{display:block;font-size:13px;color:var(--dim);margin:14px 0 4px}
input,textarea,select{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:14px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
.knop{display:block;width:100%;margin-top:18px;background:var(--accent);color:#04120a;font-weight:800;font-size:15px;padding:13px;border:0;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none}
.knop:hover{filter:brightness(1.12)}
.terug{display:inline-block;margin-top:16px;color:var(--dim);font-size:13px}
a{color:var(--accent)}
.ok{text-align:center;padding:40px 0}
.ok .vinkje{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#04120a;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
</style>
</head>
<body>
<h1>🔧 Probleem melden</h1>
<p class="sub">Werkt iets niet? Meld het — wij fixen het en jij downloadt opnieuw via je eigen download-link.</p>
<form id="f">
<label>Product</label><input id="prod" type="text" required>
<label>Je e-mailadres</label><input id="em" type="email" required>
<label>Wat werkt er niet?</label><textarea id="wat" placeholder="bijv. de download-opent niet / plugin crasht in Reason bij laden" required></textarea>
<button class="knop" type="submit">Verstuur melding</button>
</form>
<div id="ok" class="ok" style="display:none">
  <div class="vinkje">✓</div>
  <h1>Melding verstuurd!</h1>
  <p class="sub">We nemen binnen 2 dagen contact met je op. Bewaar je download-link — de fix komt daarop te staan.</p>
</div>
<p style="margin-top:18px"><a class="terug" href="index.html">← terug naar de winkel</a></p>
<script>
const G2BLOG='https://script.google.com/macros/s/AKfycbwbGZ-zxrQgxEFJbUhv2-HJ7yNP1yXb66W2wo4tEWtXyx7PcDsFiGdh619QT-6LlTXC/exec';
document.getElementById('prod').value=new URLSearchParams(location.search).get('p')||'';
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const p=document.getElementById('prod').value.trim(),
        em=document.getElementById('em').value.trim(),
        wat=document.getElementById('wat').value.trim();
  try{await fetch(G2BLOG,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({email:em,bron:'PROBLEEM|'+p+'|'+wat.slice(0,300),tijd:new Date().toISOString(),apparaat:navigator.userAgent.slice(0,120)})});}catch(_){}
  document.getElementById('f').style.display='none';
  document.getElementById('ok').style.display='block';
});
</script>
</body>
</html>
