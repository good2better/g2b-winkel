<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestellen — G2B Winkel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230D0F0E'/><text x='50' y='68' font-size='52' font-weight='bold' text-anchor='middle' fill='%232FBF71' font-family='sans-serif'>G2</text></svg>">
<style>
:root{
  --bg:#0d0f0e; --panel:#171a19; --panel2:#1e2221; --line:#2a2f2d;
  --txt:#e8ecea; --dim:#8fa098; --accent:#2fbf71; --accent2:#1d7a48;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font:15px/1.6 'Segoe UI',system-ui,sans-serif;min-height:100vh;
  display:flex;flex-direction:column}
header{border-bottom:1px solid var(--line);background:var(--panel);
  padding:20px;text-align:center}
.logo{font-size:clamp(20px,4vw,26px);font-weight:800;letter-spacing:2px}
.logo b{color:var(--accent)}
main{flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px 16px}
.card{background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:34px 30px;max-width:520px;width:100%}
h1{font-size:22px;margin-bottom:6px;text-align:center}
.sub{color:var(--dim);font-size:14px;text-align:center}
.prod{display:flex;gap:12px;align-items:center;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:12px;
  margin:20px 0;text-align:left}
.prod img{width:56px;height:56px;border-radius:8px;object-fit:cover;
  border:1px solid var(--line);flex:none}
.prod .t{font-weight:700}
.prod .l{color:var(--dim);font-size:12.5px}
.prod .pr{color:var(--accent);font-weight:800;font-size:18px;margin-left:auto;
  flex:none}
.stappen{margin:18px 0;display:grid;gap:10px}
.stap{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px}
.stap .n{background:var(--accent);color:#04120a;font-weight:800;
  border-radius:50%;width:24px;height:24px;display:flex;flex:none;
  align-items:center;justify-content:center;font-size:13px}
.knop{display:block;background:var(--accent);color:#04120a;
  font-weight:800;font-size:16px;padding:14px 20px;border-radius:10px;
  text-decoration:none;margin-top:14px;text-align:center;cursor:pointer;
  border:none;width:100%;font-family:inherit}
.knop:hover{filter:brightness(1.12)}
.knop.ander{background:var(--panel2);color:var(--txt);
  border:1px solid var(--line);font-weight:600}
.klein{color:var(--dim);font-size:12px;margin-top:18px;text-align:center}
.klein a{color:var(--accent)}
.terug{display:inline-block;margin-top:16px;color:var(--dim);
  font-size:13px;text-decoration:none}
.terug:hover{color:var(--accent)}
.langset{position:absolute;top:16px;right:16px;display:flex;gap:6px;z-index:5}
.langb{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:14px;padding:4px 11px;font-size:11px;font-weight:800;
  letter-spacing:.5px;cursor:pointer;font-family:inherit}
.langb:hover{border-color:var(--accent);color:var(--accent)}
.langb.aan{border-color:var(--accent);color:#04120a;background:var(--accent)}
.fout .vinkje{background:#bf5b2f;color:#fff}
.vinkje{width:64px;height:64px;border-radius:50%;background:var(--accent);
  color:#04120a;font-size:32px;font-weight:800;display:flex;
  align-items:center;justify-content:center;margin:0 auto 16px}
footer{text-align:center;color:var(--dim);font-size:12px;
  padding:18px;border-top:1px solid var(--line)}
footer b{color:var(--accent)}
</style>
</head>
<body>
<header><div class="logo">G2B <b>WINKEL</b></div></header>
<main>
  <div class="card" id="kaart">
    <div class="vinkje">…</div>
    <h1 data-i18n="laden_order">Even laden</h1>
    <div class="sub" data-i18n="laden_order_sub">Je bestelling wordt klaargezet…</div>
  </div>
</main>
<div class="langset">
  <button class="langb" data-lang="nl">NL</button>
  <button class="langb" data-lang="en">EN</button>
  <button class="langb" data-lang="es">ES</button>
</div>
<footer><span data-i18n="foot" data-i18n-html>Gebouwd door <b>Good2Better</b> — eigen winkel, geen commissie.</span><br><b>Good2Better High Quality Media</b> · KVK 95199926 · BTW NL005139345B30 · +31 6 45288465
</footer>
<script src="lang.js" defer></script>
<script type="module">
// taal-wissel: herlaad in de gekozen taal (localStorage onthoudt de keuze)
window.g2bRerender = () => location.reload();
const T = (typeof g2bT === "function") ? g2bT : k => k;
document.title = T("bestel_doc_titel");
const kaart = document.getElementById("kaart");
const esc = s => String(s || "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMAIL = "g.sandvliet88@gmail.com";
const LIC_NAMEN = { mp3:T("lic_mp3"), wav:T("lic_wav"), exclusief:T("lic_exclusief_tier") };
const i18n = await g2bProdI18n();

function fout(msg) {
  kaart.classList.add("fout");
  kaart.innerHTML = `
    <div class="vinkje">!</div>
    <h1>${T("fout_t")}</h1>
    <div class="sub">${esc(msg || T("fout_x"))}</div>
    <a class="terug" href="index.html">${T("terug")}</a>`;
}

const params = new URLSearchParams(location.search);
const pid = params.get("p") || "";
const tier = params.get("t") || "";

let cat;
try {
  const r = await fetch("products.json", { cache: "no-store" });
  if (!r.ok) throw 0;
  cat = await r.json();
  if (cat.accent)
    document.documentElement.style.setProperty("--accent", cat.accent);
  if (cat.accent2)
    document.documentElement.style.setProperty("--accent2", cat.accent2);
} catch { fout(T("fout_winkel")); throw 0; }

const p = (cat.producten || []).find(x => x.id === pid);
if (!p) { fout(); throw 0; }

const tierNaam = tier && LIC_NAMEN[tier] ? LIC_NAMEN[tier] : "";
const prijs = tier && p.prijzen && p.prijzen[tier] ? p.prijzen[tier]
  : (typeof p.prijs === "number" ? "€ " + p.prijs.toFixed(2).replace(".", ",") : p.prijs);
const pTitel = (typeof g2bProdField === "function")
  ? g2bProdField(i18n, p.id, "titel", p.titel) : p.titel;
const titelLang = pTitel + (tierNaam ? " — " + tierNaam : "");
const isSteun = p.soort === "steun";
const stap3 = isSteun ? T("stap3_steun") : T("stap3_prod");

const orderTekst =
`${isSteun ? T("ord_steun") : T("ord_bestelling")} ${T("ord_bij")}

${T("ord_product")} ${titelLang}
${T("ord_prijs")} ${prijs}

${T("ord_naam")}
${T("ord_email")}

${T("ord_tikkie")} ${isSteun ? T("ord_tikkie_steun") : T("ord_tikkie_prod")}`;

const mailto = `mailto:${EMAIL}?subject=${encodeURIComponent((isSteun ? T("ord_subj_steun") : T("ord_subj_bestel")) + titelLang)}&body=${encodeURIComponent(orderTekst)}`;

kaart.innerHTML = `
  <h1>${isSteun ? T("steun_afronden") : T("bestel_afronden")}</h1>
  <div class="sub">${T("sub_how")}</div>
  <div class="prod">
    ${p.cover ? `<img src="${esc(p.cover)}" alt="">` : ""}
    <div>
      <div class="t">${esc(pTitel)}</div>
      ${tierNaam ? `<div class="l">${esc(tierNaam)}</div>` : ""}
    </div>
    <div class="pr">${esc(prijs)}</div>
  </div>
  <div class="stappen">
    <div class="stap"><div class="n">1</div><div>${T("stap1")}</div></div>
    <div class="stap"><div class="n">2</div><div>${T("stap2")}</div></div>
    <div class="stap"><div class="n">3</div><div>${stap3}</div></div>
  </div>
  <a class="knop" href="${mailto}">${T("knop_stuur")}</a>
  <button class="knop ander" id="kopie">${T("knop_kopieer")}</button>
  <div class="klein">${T("klein_mail_pre")}
    <a href="mailto:${EMAIL}">${EMAIL}</a> ${T("klein_mail_post")}</div>
  <a class="terug" href="index.html">${T("terug")}</a>`;

document.getElementById("kopie").addEventListener("click", async e => {
  try {
    await navigator.clipboard.writeText(orderTekst + "\n\nMail: " + EMAIL);
    e.target.textContent = T("kopie_ok");
  } catch {
    e.target.textContent = orderTekst;
  }
});
</script>
</body>
</html>
