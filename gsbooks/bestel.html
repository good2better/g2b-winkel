<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestellen — GS Books</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--zee:#0E6BA8;--zeedonker:#084E7C;--zand:#FFF8EC;--goud:#F5A623;--koraal:#FF7F50;--tint:#E8F4FB;--tekst:#2E3A45}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Raleway,sans-serif;color:var(--tekst);background:var(--zand);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--zeedonker);padding:20px;text-align:center}
.logo{font-family:'Playfair Display',serif;font-size:clamp(20px,4vw,26px);font-weight:700;color:#fff;letter-spacing:1px}
.logo b{color:var(--goud)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.kaart{background:#fff;border-radius:24px;box-shadow:0 12px 40px rgba(8,78,124,.15);max-width:560px;width:100%;padding:38px 32px}
h1{font-family:'Playfair Display',serif;color:var(--zeedonker);font-size:26px;margin-bottom:6px;text-align:center}
.sub{color:#5a6b7a;font-size:14px;text-align:center}
.prod{display:flex;gap:14px;align-items:center;background:var(--tint);border-radius:16px;padding:14px 16px;margin:22px 0;text-align:left}
.prod img{width:64px;height:auto;border-radius:10px;box-shadow:0 4px 14px rgba(8,78,124,.18);flex:none}
.prod .t{font-weight:800;color:var(--zeedonker)}
.prod .l{color:#5a6b7a;font-size:13px}
.prod .pr{color:var(--zee);font-weight:800;font-size:19px;margin-left:auto;flex:none;white-space:nowrap}
.stappen{margin:18px 0;display:grid;gap:10px}
.stap{display:flex;gap:10px;align-items:flex-start;background:var(--tint);border-radius:12px;padding:12px 14px;font-size:14px}
.stap .n{background:var(--goud);color:#4A3400;font-weight:800;border-radius:50%;width:24px;height:24px;display:flex;flex:none;align-items:center;justify-content:center;font-size:13px}
.knop{display:block;background:var(--goud);color:#4A3400;font-weight:800;font-size:16px;padding:15px 20px;border-radius:30px;text-decoration:none;margin-top:14px;text-align:center;cursor:pointer;border:none;width:100%;font-family:inherit}
.knop:hover{background:#e0981a}
.knop.ander{background:#fff;color:var(--zee);border:2px solid var(--zee);font-weight:700}
.klein{color:#8a98a5;font-size:12px;margin-top:18px;text-align:center;line-height:1.5}
.klein a{color:var(--zee)}
.terug{display:inline-block;margin-top:16px;color:var(--zee);font-size:13px;text-decoration:none;font-weight:600}
.fout .vinkje{background:var(--koraal);color:#fff}
.vinkje{width:64px;height:64px;border-radius:50%;background:var(--goud);color:#4A3400;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
footer{text-align:center;color:#8a98a5;font-size:12px;padding:18px}
footer b{color:var(--zee)}
</style>
</head>
<body>
<header><div class="logo">GS <b>BOOKS</b></div></header>
<main>
  <div class="kaart" id="kaart">
    <div class="vinkje">…</div>
    <h1>Even laden</h1>
    <div class="sub">Je bestelling wordt klaargezet…</div>
  </div>
</main>
<footer>Gemaakt door <b>Good2Better</b> — 100% van je aankoop steunt de maker.</footer>
<script type="module">
const kaart = document.getElementById("kaart");
const esc = s => String(s || "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMAIL = "g.sandvliet88@gmail.com";
const FMT_NAMEN = {
  ebook:"E-boek", kleurboek:"Kleurboek", stripboek:"Stripboek + stickers",
  videoboek:"Videoboek", luisterboek:"Luisterboek", spel:"Spel",
  activiteitenboek:"Activiteitenboek", puzzelboek:"Puzzelboek",
  bordspel:"Bordspel", kalender:"Kalender", knutsel:"Knutselpakket",
  pakket:"Mega-pakket"
};

function fout(msg) {
  kaart.classList.add("fout");
  kaart.innerHTML = `
    <div class="vinkje">!</div>
    <h1>Boek niet gevonden</h1>
    <div class="sub">${esc(msg || "Deze bestel-link is niet geldig.")}</div>
    <div style="text-align:center"><a class="terug" href="index.html">← terug naar de boekenwinkel</a></div>`;
}

const params = new URLSearchParams(location.search);
const bid = params.get("b") || "";
const fmt = params.get("f") || "";

let boeken;
try {
  const r = await fetch("boeken.json", { cache: "no-store" });
  if (!r.ok) throw 0;
  boeken = (await r.json()).boeken || [];
} catch { fout("De boekenwinkel kon niet geladen worden."); throw 0; }

const b = boeken.find(x => x.id === bid);
if (!b) { fout(); throw 0; }

const f = b[fmt];
if (!f || typeof f !== "object") { fout("Dit formaat is niet beschikbaar voor dit boek."); throw 0; }

const fmtNaam = FMT_NAMEN[fmt] || fmt;
const prijs = f.prijs ? "€ " + String(f.prijs) : "";
const titelLang = b.titel + " — " + fmtNaam;

const orderTekst =
`Bestelling bij GS Books

Boek: ${titelLang}
Prijs: ${prijs}

Mijn naam:
Mijn e-mailadres:

(GS Books stuurt daarna een Tikkie-betaallink. Na betaling komt de download-link binnen 24 uur.)`;

const mailto = `mailto:${EMAIL}?subject=${encodeURIComponent("Bestelling: " + titelLang)}&body=${encodeURIComponent(orderTekst)}`;

kaart.innerHTML = `
  <h1>Bestelling afronden</h1>
  <div class="sub">Zo werkt het — simpel en veilig via Tikkie</div>
  <div class="prod">
    ${b.cover ? `<img src="../${esc(b.cover)}" alt="">` : ""}
    <div>
      <div class="t">${esc(b.titel)}</div>
      <div class="l">${esc(fmtNaam)}</div>
    </div>
    <div class="pr">${esc(prijs)}</div>
  </div>
  <div class="stappen">
    <div class="stap"><div class="n">1</div><div>Klik op <b>STUUR BESTELLING</b> — je mailtje naar GS Books wordt automatisch klaargezet. Verstuur hem.</div></div>
    <div class="stap"><div class="n">2</div><div>Je krijgt snel antwoord met een <b>Tikkie-betaallink</b> (betaling via je eigen bank-app, veilig).</div></div>
    <div class="stap"><div class="n">3</div><div>Na betaling ontvang je <b>binnen 24 uur je download-link</b> — meestal veel sneller.</div></div>
  </div>
  <a class="knop" href="${mailto}">✉ STUUR BESTELLING</a>
  <button class="knop ander" id="kopie">📋 OF KOPIEER DE BESTELTEKST</button>
  <div class="klein">Liever direct mailen? Stuur je bestelling naar
    <a href="mailto:${EMAIL}">${EMAIL}</a> met de boektitel erbij.</div>
  <div style="text-align:center"><a class="terug" href="index.html">← terug naar de boekenwinkel</a></div>`;

document.getElementById("kopie").addEventListener("click", async e => {
  try {
    await navigator.clipboard.writeText(orderTekst + "\n\nMail naar: " + EMAIL);
    e.target.textContent = "✓ GEKOPIEERD — plak in je mail/WhatsApp";
  } catch {
    e.target.textContent = orderTekst;
  }
});
</script>
</body>
</html>
