<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vraag het aan Dana — interactief videoboek</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d0c;color:#e8ecea;
  font:16px/1.5 'Segoe UI',system-ui,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
#scene img.kb{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:0;
  animation:kb 6s ease-in-out forwards,fadein 1s ease forwards}
@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.12)}}
@keyframes fadein{to{opacity:1}}
#titel{position:fixed;top:14px;left:0;right:0;text-align:center;
  font-weight:800;font-size:clamp(18px,3vw,26px);letter-spacing:1px;
  text-shadow:0 2px 12px #000;z-index:5;pointer-events:none}
#keuzes{position:fixed;bottom:8%;left:0;right:0;display:none;
  flex-wrap:wrap;gap:16px;justify-content:center;z-index:6;padding:0 20px}
#tekst{position:fixed;bottom:20%;left:50%;transform:translateX(-50%);
  max-width:min(760px,86vw);background:#0b0d0cc9;border-radius:14px;
  padding:10px 20px;font-size:clamp(16px,2.4vw,22px);font-weight:700;
  text-align:center;text-shadow:0 1px 4px #000;z-index:5;display:none}
button.keuze{background:#2fbf71;color:#04120a;border:0;border-radius:16px;
  padding:18px 30px;font-size:clamp(17px,2.6vw,24px);font-weight:800;
  cursor:pointer;box-shadow:0 6px 24px #000a;min-width:200px}
button.keuze:hover{filter:brightness(1.12);transform:scale(1.04)}
#einde,#start{position:fixed;inset:0;background:#0b0d0cd9;display:none;z-index:8;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
  text-align:center;padding:24px}
#einde{overflow-y:auto;justify-content:flex-start;padding-top:15vh}
#einde h1{max-width:22em;line-height:1.35}
#start{display:flex}
#einde h1,#start h1{font-size:clamp(28px,5vw,44px);text-shadow:0 2px 12px #000}
#opnieuw,#speel{background:#2fbf71;color:#04120a;border:0;border-radius:14px;
  padding:16px 32px;font-size:clamp(17px,2.6vw,22px);font-weight:800;cursor:pointer}
#terugNaar{background:#fab005;color:#04120a;border:0;border-radius:14px;
  padding:14px 26px;font-size:clamp(15px,2.2vw,20px);font-weight:800;cursor:pointer}
#terugNaar:hover,#opnieuw:hover,#speel:hover{filter:brightness(1.12);transform:scale(1.04)}
#stem{display:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="titel">Vraag het aan Dana</div>
<div id="tekst"></div>
<div id="keuzes"></div>
<div id="einde"><h1 id="eindeTekst">Einde — goed gekozen!</h1>
  <button id="terugNaar" style="display:none">↩ Stel nog een vraag</button>
  <button id="opnieuw">🔁 Opnieuw spelen — ander pad</button></div>
<div id="start"><h1>Vraag het aan Dana</h1>
  <p>Jij bepaalt hoe dit verhaal gaat!</p>
  <button id="speel">▶ SPEEL HET VERHAAL</button></div>
<audio id="stem"></audio>
<script>const STORY = {"start": "hub", "scenes": {"hub": {"paginas": ["p00.jpg"], "audio": "scenes/hub/audio.mp3", "keuzes": [{"label": "Hoe redde jij het bootje? \ud83d\udea4", "doel": "a1"}, {"label": "Kunnen dolfijnen echt praten? \ud83d\udde3\ufe0f", "doel": "a2"}, {"label": "Wat doe je als het stormt? \u26c8\ufe0f", "doel": "a3"}, {"label": "Wie zijn je beste vrienden? \ud83d\udc99", "doel": "a4"}], "einde": "", "terug": null, "tekst": "Hoi! Ik ben Dana de Dolfijn, redder van de zee. Wil je weten hoe ik heldenwerk doe? Stel je vraag!"}, "a1": {"paginas": ["p00.jpg"], "audio": "scenes/a1/audio.mp3", "keuzes": [], "einde": "Dat was mijn antwoord!", "terug": "hub", "tekst": "De stroming was veel te sterk voor \u00e9\u00e9n dolfijn. Dus riep ik al mijn vrienden erbij! Samen duwden we het bootje veilig naar de kant. Echte helden vragen hulp als het moet."}, "a2": {"paginas": ["p00.jpg"], "audio": "scenes/a2/audio.mp3", "keuzes": [], "einde": "Dat was mijn antwoord!", "terug": "hub", "tekst": "Ja hoor! Wij praten met klikjes en fluitjes. Elke dolfijn heeft zelfs zijn eigen fluit-naam. Zo roepen we elkaar als iemand in nood is."}, "a3": {"paginas": ["p00.jpg", "p01.jpg"], "audio": "scenes/a3/audio.mp3", "keuzes": [], "einde": "Dat was mijn antwoord!", "terug": "hub", "tekst": "Dan duik ik diep en zoek ik een beschutte baai. Storm boven water? Onder water is het vaak juist rustig. En daarna help ik weer iedereen die mij nodig heeft."}, "a4": {"paginas": ["p00.jpg"], "audio": "scenes/a4/audio.mp3", "keuzes": [], "einde": "Dat was mijn antwoord!", "terug": "hub", "tekst": "Alle Animal Heroes zijn mijn vrienden! Sunny de eend, Keesje de detective \u2014 en jij ook, als je wilt. De zee is voor ons allemaal!"}}};</script>
<script>// interactieve videoboek-speler — kind kiest het pad (regel 1: eigen code)
const wrap = document.getElementById("scene");
const audio = document.getElementById("stem");
const keuzebox = document.getElementById("keuzes");
const titelEl = document.getElementById("titel");
let huidig = null, plaatTimer = null;

function scene(id) {
  huidig = STORY.scenes[id];
  if (!huidig) return;
  keuzebox.innerHTML = "";
  keuzebox.style.display = "none";
  document.getElementById("einde").style.display = "none";
  wrap.innerHTML = "";
  const tt = document.getElementById("tekst");
  if (huidig.tekst) { tt.textContent = huidig.tekst; tt.style.display = ""; }
  else tt.style.display = "none";
  const paginas = huidig.paginas || [];
  // elke plaat ~4s Ken Burns, zolang de audio duurt
  let i = 0;
  const toon = () => {
    wrap.innerHTML = "";
    const img = document.createElement("img");
    img.src = "scenes/" + id + "/paginas/" + paginas[i % paginas.length];
    img.className = "kb";
    wrap.appendChild(img);
    i++;
  };
  if (paginas.length) toon();
  if (plaatTimer) clearInterval(plaatTimer);
  if (paginas.length > 1) plaatTimer = setInterval(toon, 4000);
  if (huidig.audio) {
    audio.src = huidig.audio;
    audio.play().catch(() => { klaar(); });
    audio.onended = klaar;
  } else {
    // zonder stem: leestijd schaalt mee met de tekstlengte
    const lees = huidig.tekst ? 1800 + huidig.tekst.length * 85 : 0;
    setTimeout(klaar, Math.max(2500, 4000 * Math.min(paginas.length, 2),
                             Math.min(lees, 20000)));
  }
}

function klaar() {
  if (plaatTimer) clearInterval(plaatTimer);
  document.getElementById("tekst").style.display = "none";
  const kz = huidig.keuzes || [];
  if (!kz.length) {
    document.getElementById("eindeTekst").textContent =
      huidig.einde || "Einde — goed gekozen!";
    const tb = document.getElementById("terugNaar");
    if (huidig.terug) {
      tb.style.display = "";
      tb.onclick = () => scene(huidig.terug);
    } else {
      tb.style.display = "none";
    }
    document.getElementById("einde").style.display = "flex";
    return;
  }
  keuzebox.innerHTML = "";
  kz.forEach(k => {
    const b = document.createElement("button");
    b.className = "keuze";
    b.textContent = k.label;
    b.onclick = () => scene(k.doel);
    keuzebox.appendChild(b);
  });
  keuzebox.style.display = "flex";
}

document.getElementById("opnieuw").onclick = () => scene(STORY.start);
// start via knop: browsers eisen een gebruikers-gebaar voor audio-autoplay
document.getElementById("speel").onclick = () => {
  document.getElementById("start").style.display = "none";
  scene(STORY.start);
};
</script>
</body></html>
