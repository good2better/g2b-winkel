<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunny's Sailing Adventures — Hoofdstuk 1 — videoboek</title>
<style>
*{{margin:0;padding:0;box-sizing:border-box}}
body{{font-family:Georgia,'Times New Roman',serif;background:#0d2135;
color:#f5efe0;min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:16px}}
.speler{{width:min(880px,100%);text-align:center}}
h1{{font-size:clamp(1.3rem,4vw,1.9rem);font-weight:600;margin-bottom:4px}}
.sub{{color:#9fb4c4;font-size:.9rem;margin-bottom:16px}}
.scherm{{background:#071522;border-radius:14px;overflow:hidden;
box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative}}
.scherm img{{width:100%;height:min(62vh,560px);object-fit:contain;display:block}}
.play{{position:absolute;inset:0;display:flex;align-items:center;
justify-content:center;background:rgba(7,21,34,.45);border:0;
cursor:pointer;transition:.2s}}
.play:hover{{background:rgba(7,21,34,.25)}}
.play svg{{width:88px;height:88px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}}
.bar{{display:flex;align-items:center;gap:12px;margin-top:14px}}
.bar button{{background:#1b3a55;color:#f5efe0;border:0;border-radius:10px;
width:44px;height:44px;font-size:1.15rem;cursor:pointer}}
.bar button:hover{{background:#25507a}}
.teller{{font-size:.9rem;color:#9fb4c4;min-width:76px}}
.voort{{flex:1;height:7px;background:#1b3a55;border-radius:4px;overflow:hidden}}
.voort i{{display:block;height:100%;width:0;background:#f5a623;border-radius:4px;
transition:width .25s}}
.tip{{margin-top:12px;font-size:.85rem;color:#7c93a8}}
</style></head><body>
<div class="speler">
<h1>📖 Sunny's Sailing Adventures — Hoofdstuk 1</h1>
<div class="sub">Videoboek — druk op play, de pagina's bladeren zelf mee</div>
<div class="scherm"><img id="img" src="paginas/p00.jpg" alt="">
<button class="play" id="play" onclick="start()"><svg viewBox="0 0 100 100">
<circle cx="50" cy="50" r="46" fill="#f5a623"/>
<path d="M40 32 L72 50 L40 68 Z" fill="#0d2135"/></svg></button></div>
<div class="bar">
<button onclick="stap(-1)" title="Vorige pagina">⏮</button>
<button onclick="stap(1)" title="Volgende pagina">⏭</button>
<span class="teller" id="tel">1 / 37</span>
<div class="voort"><i id="vrt"></i></div>
</div>
<div class="tip">Tip: blader zelf met ⏮ ⏭ — of laat het verhaal je meenemen.
Gemaakt met G2B Videoboek-Fabriek.</div>
</div>
<audio id="aud" src="audio.mp3" preload="metadata"></audio>
<script>
var N=37,i=0,timer=null;
var img=document.getElementById('img'),aud=document.getElementById('aud'),
tel=document.getElementById('tel'),vrt=document.getElementById('vrt'),
playBtn=document.getElementById('play');
function zet(){{
img.src='paginas/p'+String(i).padStart(2,'0')+'.jpg';
tel.textContent=(i+1)+' / '+N;
vrt.style.width=((i+1)/N*100)+'%';}}
function stap(d){{i=Math.max(0,Math.min(N-1,i+d));zet();}}
function start(){{
playBtn.style.display='none';
aud.play();
timer=setInterval(function(){{
if(aud.duration){{var ni=Math.min(N-1,Math.floor(aud.currentTime/aud.duration*N));
if(ni!==i){{i=ni;zet();}}}}}},300);}}
aud.addEventListener('ended',function(){{clearInterval(timer);}});
aud.addEventListener('pause',function(){{playBtn.style.display='flex';}});
aud.addEventListener('play',function(){{playBtn.style.display='none';}});
document.addEventListener('keydown',function(e){{
if(e.key==='ArrowRight')stap(1);if(e.key==='ArrowLeft')stap(-1);}});
zet();
</script></body></html>
