<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2B — Beat van de Week</title>
<!-- G2B widget — plak in Beezer als Component/HTML, of gebruik als iframe-bron.
     Muziek + hoes komen live uit je eigen winkel (GitHub Pages). -->
<style>
  :root{
    --bg:#0d0f0e; --panel:#171a19; --accent:#2fbf71; --accent2:#1d7a48;
    --tekst:#e8ecea; --dim:#8fa098; --line:#233027;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:transparent;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
       display:flex;justify-content:center;padding:10px}
  .kaart{
    width:340px;background:linear-gradient(160deg,var(--panel),#101312 70%);
    border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(47,191,113,.08);
    color:var(--tekst);
  }
  .kop{
    display:flex;align-items:center;gap:8px;padding:10px 14px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:700;
    background:rgba(47,191,113,.06);border-bottom:1px solid var(--line);
  }
  .kop .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px var(--accent);animation:knip 1.6s infinite}
  @keyframes knip{50%{opacity:.35}}
  .midden{position:relative}
  .hoes{width:100%;display:block;aspect-ratio:1;object-fit:cover}
  .play{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.65));
    cursor:pointer;border:0;width:100%}
  .play .cirkel{
    width:76px;height:76px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 24px rgba(47,191,113,.55);transition:transform .15s;
  }
  .play:hover .cirkel{transform:scale(1.08)}
  .play svg{width:30px;height:30px;fill:#0d0f0e;margin-left:4px}
  .play.pauze svg{margin-left:0}
  .info{padding:14px 16px 16px}
  .titel{font-size:19px;font-weight:700}
  .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .prijs-rij{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .prijs{font-size:15px;color:var(--dim)}
  .prijs b{color:var(--tekst);font-size:18px}
  .koop{
    background:var(--accent);color:#0d0f0e;text-decoration:none;
    font-weight:800;font-size:13px;letter-spacing:.05em;
    padding:10px 18px;border-radius:10px;
    box-shadow:0 4px 16px rgba(47,191,113,.35);transition:background .15s;
  }
  .koop:hover{background:#3dd485}
  .voet{padding:8px 16px 12px;font-size:10.5px;color:var(--dim);text-align:center}
  .voet a{color:var(--dim)}
</style>
</head>
<body>
<div class="kaart">
  <div class="kop"><span class="dot"></span> G2B BEATS · UIT DE WINKEL</div>
  <div class="midden">
    <img class="hoes" src="https://good2better.github.io/g2b-winkel/media/c5444536-cover.png" alt="Midnight Dembow — G2B hoes">
    <button class="play" id="play" aria-label="Speel preview af">
      <span class="cirkel">
        <svg id="icoon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </span>
    </button>
  </div>
  <div class="info">
    <div class="titel">Midnight Dembow</div>
    <div class="sub">Dembow · 45-sec preview · MP3/WAV/Exclusief</div>
    <div class="prijs-rij">
      <div class="prijs">v.a. <b>€ 19,95</b></div>
      <a class="koop" href="https://www.good2better.com/exclusive-store" target="_blank">KOOP →</a>
    </div>
  </div>
  <div class="voet">Meer beats op <a href="https://www.good2better.com/exclusive-store" target="_blank">good2better.com</a></div>
</div>
<audio id="audio" src="https://good2better.github.io/g2b-winkel/media/c5444536-preview.mp3" preload="none"></audio>
<script>
const a=document.getElementById('audio'),b=document.getElementById('play'),i=document.getElementById('icoon');
const P='<path d="M8 5v14l11-7z"/>',S='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
b.onclick=()=>{if(a.paused){a.play()}else{a.pause()}};
a.onplay =()=>{i.innerHTML=S;b.classList.add('pauze')};
a.onpause=()=>{i.innerHTML=P;b.classList.remove('pauze')};
a.onended=()=>{i.innerHTML=P;b.classList.remove('pauze')};
</script>
</body>
</html>
