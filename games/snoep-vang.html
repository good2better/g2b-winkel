<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snoep Vangen</title><style>body{margin:0;background:#33142e;display:flex;flex-direction:column;align-items:center;font-family:system-ui;color:#fff;min-height:100vh}

<script>

{const bgx=document.getElementById('bgx');for(let i=0;i<9;i++){const s=document.createElement('span');s.className='bge';s.textContent=T.items[i%T.items.length];s.style.left=(4+i*11)+'vw';s.style.top=(10+((i*37)%80))+'vh';s.style.setProperty('--d',(5+i*1.3).toFixed(1)+'s');s.style.fontSize=(1.4+(i%3)*.5)+'rem';bgx.appendChild(s)}}

  blip(180,.4,'sawtooth');return}
 document.getElementById('over').style.display='flex';const st=score<=0?'☆☆☆':score<80?'⭐☆☆':score<200?'⭐⭐☆':'⭐⭐⭐';
 document.getElementById('ot').textContent=(score>0?'🎉 Goed gedaan! ':'😅 Nog een keer? ')+st;

/* glow erachter = items altijd goed zichtbaar op donkere achtergrond */

const itemX=(i,x,y,s)=>{const im=FITEMS.length?FITEMS[i%FITEMS.length]:null;if(ok(im))_rond(im,x,y,s);else{X.save();X.globalAlpha=.34;X.fillStyle='#fff';X.beginPath();X.arc(x,y,s*.62,0,7);X.fill();X.globalAlpha=1;emoji(T.items[i%T.items.length],x,y,s,'rgba(255,255,255,1)');X.restore()}};

const _bgt={t:0,el:Array.from({length:12},(_,i)=>({x:Math.random()*W,y:Math.random()*Hh*.7,s:.4+Math.random(),v:.1+Math.random()*.4}))};

const PAD=(pi=0)=>{try{const g=navigator.getGamepads&&navigator.getGamepads()[pi];if(!g)return{l:0,r:0,u:0,d:0,a:0};

let mand={x:W/2-60},mand2={x:W/2+60},items=[],t=0,spd=1.8*D.snel;
const DUO=SPELERS=='duo';let s1=0,s2=0,l2=D.leven;
function spawn(){items.push({x:rand(30,W-30),y:-20,v:spd*rand(.8,1.4),ix:Math.floor(rand(0,20)),e:Math.random()<.85?T.items[Math.floor(rand(0,T.items.length))]:T.vijand, kwaad:Math.random()<.15})}
function tik(x){}
(function loop(){if(af)return;bg();
 const pd=PAD(0),pd2=DUO?PAD(1):{l:0,r:0};
 if(keys['ArrowLeft']||pd.l)mand.x-=6;if(keys['ArrowRight']||pd.r)mand.x+=6;if(tx!=null)mand.x+=(tx-mand.x)*.2;

 if(DUO){const im2=FITEMS.length?FITEMS[0]:null;if(ok(im2))_rond(im2,mand2.x,Hh-56,44);else emoji(T.held=='🐶'?'🐱':T.held,mand2.x,Hh-56,44);
  X.fillStyle='#f472b6';X.fillRect(mand2.x-38,Hh-72,76,6)}
 items.forEach(i=>{i.y+=i.v;if(i.kwaad)emoji(T.vijand,i.x,i.y,34,'rgba(255,90,90,1)');else itemX(i.ix,i.x,i.y,34);

 items=items.filter(i=>i.y<Hh+50);
 if(lev<=0||(DUO&&l2<=0)){if(DUO){const w=s1>s2?'🏆 Speler 1 wint!':s2>s1?'🏆 Speler 2 wint!':'🤝 Gelijkspel!';
