<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2B Videoboek — interactief levend verhaal</title>
<style>
:root{--bg:#07111f;--ka:#101d31;--lijn:#243852;--groen:#34d399;--goud:#f7c948;--tx:#e8f1ff;--dim:#91a7c4}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,'Segoe UI',sans-serif;min-height:100vh;overflow:hidden}
button{font:inherit}#app{height:100vh;display:flex;flex-direction:column}
.top{height:58px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(5,12,24,.92);border-bottom:1px solid var(--lijn);z-index:5}
.top b{color:var(--goud);font-size:14px;letter-spacing:.4px}.top span{color:var(--dim);font-size:12px}.top button{margin-left:auto;background:#1b2d47;color:var(--tx);border:1px solid var(--lijn);border-radius:9px;padding:7px 10px;cursor:pointer}.top button+button{margin-left:0}
.world{position:relative;flex:1;overflow:hidden;background:radial-gradient(circle at 50% 25%,#1b3452,#07111f 76%);cursor:crosshair}
.sky{position:absolute;inset:-5%;display:flex;align-items:center;justify-content:center;font-size:min(42vw,330px);filter:drop-shadow(0 24px 42px rgba(0,0,0,.45));animation:ken 18s ease-in-out infinite alternate;opacity:.95;user-select:none}
@keyframes ken{from{transform:scale(1) translate(-1.5%,-1%)}to{transform:scale(1.12) translate(1.5%,1%)}}
.world img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:ken 18s ease-in-out infinite alternate}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,10,20,.05) 35%,rgba(4,10,20,.83) 100%);pointer-events:none}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff8 0 15%,#f7c94888 40%,transparent 72%);width:22px;height:22px;animation:float 8s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{transform:translateY(-42px) translateX(20px);opacity:.28}}
.friend{position:absolute;transform:translate(-50%,-50%);font-size:34px;opacity:.12;filter:blur(.5px) saturate(.7);transition:.25s;z-index:2;user-select:none}
.friend.found{opacity:1;filter:none;font-size:52px;animation:pop .7s;z-index:3}
@keyframes pop{35%{transform:translate(-50%,-50%) scale(1.55) rotate(-8deg)}70%{transform:translate(-50%,-50%) scale(.9) rotate(6deg)}}
.spark{position:absolute;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,#f7c948 48%,transparent 75%);animation:spark .75s forwards;pointer-events:none;z-index:4}
@keyframes spark{to{transform:scale(3.5) translateY(-26px);opacity:0}}
.ripple{position:absolute;width:28px;height:28px;border:2px solid #ffffff99;border-radius:50%;transform:translate(-50%,-50%);animation:rip .55s forwards;pointer-events:none;z-index:4}
@keyframes rip{to{width:90px;height:90px;opacity:0}}
.panel{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(940px,94vw);background:rgba(8,17,31,.88);border:1px solid #355075;border-radius:18px;padding:15px;box-shadow:0 18px 60px rgba(0,0,0,.45);z-index:5}
.scene{color:var(--goud);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}.txt{font-size:17px;line-height:1.48;min-height:48px}.hint{color:var(--dim);font-size:12px;margin-top:7px}.controls{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
.controls button{background:var(--groen);border:0;color:#03150d;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.controls button.sec{background:#1b2d47;color:var(--tx);border:1px solid var(--lijn)}.controls button:disabled{opacity:.38;cursor:default}
.prog{flex:1;min-width:110px;height:8px;background:#0a1526;border-radius:99px;overflow:hidden;border:1px solid #263e5f}.prog i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#34d399)}
.score{color:var(--goud);font-weight:800;font-size:13px}.overlay{position:fixed;inset:0;background:rgba(2,6,12,.76);display:none;align-items:center;justify-content:center;padding:18px;z-index:9}.card{background:#101d31;border:1px solid #385475;border-radius:20px;max-width:520px;width:100%;padding:26px;text-align:center}.card .cup{font-size:58px}.card p{color:var(--dim);font-size:14px;margin:8px 0 16px}.card button{background:var(--groen);border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;margin:4px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#f7c948;color:#1c1300;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:800;opacity:0;transition:.25s;z-index:8;pointer-events:none}.toast.on{opacity:1}
@media(max-width:640px){.sky{font-size:72vw}.txt{font-size:15px}.friend{font-size:28px}.friend.found{font-size:44px}.panel{bottom:8px;padding:12px}.top span{display:none}}
</style></head><body><div id="app">
<div class="top"><b>G2B VIDEOBOEK</b><span id="sub">interactief levend verhaal</span><button id="voice">🔊 voorlezen aan</button><button id="restart">↺ opnieuw</button></div>
<div class="world" id="world"><div class="sky" id="sky">🦊</div><div class="shade"></div><div class="friend" id="friend">🐰</div>
<div class="panel"><div class="scene" id="scene">Scène</div><div class="txt" id="txt"></div><div class="hint" id="hint"></div><div class="controls"><button class="sec" id="prev">← vorige</button><button id="next">volgende →</button><button class="sec" id="read">🔊 lees voor</button><div class="prog"><i id="bar"></i></div><span class="score" id="score">0/0 vrienden</span></div></div></div>
<div class="toast" id="toast"></div><div class="overlay" id="ov"><div class="card" id="card"></div></div>
</div><script>
"use strict";
const $=id=>document.getElementById(id);
const FALLBACK={title:"Animal Heroes — het verstopte bos",scenes:[
{text:"Vosje rent door het maanlichtbos. Ergens tussen de bladeren zit Konijn verstopt. Klik zachtjes in de wereld als je hem ziet.",art:"🦊",pal:["#12355c","#07111f"],friend:{e:"🐰",n:"Konijn",x:72,y:43,hint:"Konijn houdt van hoge plekken."}},
{text:"Bij de rivier glinsteren sterren in het water. Egel heeft zich onder een blad verstopt, maar zijn neusje steekt er bijna uit.",art:"🌊",pal:["#0e4b61","#07111f"],friend:{e:"🦔",n:"Egel",x:28,y:66,hint:"Kijk laag bij de waterkant."}},
{text:"In de oude eik kraakt een tak. Uil ziet alles, maar zelf wil hij juist niet gezien worden.",art:"🌳",pal:["#21451f","#07111f"],friend:{e:"🦉",n:"Uil",x:50,y:22,hint:"Uil kijkt van bovenaf toe."}},
{text:"Het bosfeest begint. Alle vrienden komen tevoorschijn en samen maken ze van de nacht een lichtfeest.",art:"🎉",pal:["#5b2b67","#07111f"],friend:{e:"🦡",n:"Das",x:82,y:72,hint:"Das blijft graag bij de rand van het feest."}}]};
let BOOK=null,i=0,found={},voice=true,sparks=0;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>$('toast').classList.remove('on'),1800)}
function speak(t){if(!voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='nl-NL';speechSynthesis.speak(u)}catch(e){}}
function chime(ok){try{const ac=chime._a||(chime._a=new (window.AudioContext||window.webkitAudioContext)());const t=ac.currentTime;(ok?[523,659,784]:[220]).forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain(),st=t+k*.07;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.07,st+.015);g.gain.exponentialRampToValueAtTime(.001,st+.42);o.connect(g);g.connect(ac.destination);o.start(st);o.stop(st+.45)})}catch(e){}}
function normBook(d){if(!d||!Array.isArray(d.scenes)||!d.scenes.length)return FALLBACK;d.scenes.forEach((s,k)=>{s.idx=k;s.friend=s.friend||{};s.friend.e=s.friend.e||'🐾';s.friend.n=s.friend.n||'vriend';s.friend.x=+s.friend.x||50;s.friend.y=+s.friend.y||50;s.pal=s.pal||['#183b61','#07111f']});return d}
async function loadBook(){
 let q=new URLSearchParams(location.search),raw=null;
 try{raw=localStorage.getItem('vb_data');if(raw){localStorage.removeItem('vb_data')}}catch(e){}
 if(!raw&&q.get('boek')){try{raw=await (await fetch('boek-'+encodeURIComponent(q.get('boek'))+'.json')).text()}catch(e){}}
 if(!raw&&q.get('json')){try{raw=await (await fetch(q.get('json'))).text()}catch(e){}}
 try{BOOK=normBook(JSON.parse(raw))}catch(e){BOOK=normBook(FALLBACK)}
 document.title='G2B Videoboek — '+BOOK.title;$('sub').textContent=BOOK.title;render();
}
function render(){
 const s=BOOK.scenes[i],w=$('world');found=found||{};
 w.style.background='radial-gradient(circle at 50% 25%,'+s.pal[0]+','+s.pal[1]+' 76%)';
 let old=w.querySelector('img.bg');if(old)old.remove();
 if(s.image){const im=document.createElement('img');im.className='bg';im.alt='';im.src=s.image;w.insertBefore(im,w.firstChild)}
 $('sky').textContent=s.art||'✨';$('sky').style.display=s.image?'none':'flex';
 w.querySelectorAll('.orb').forEach(x=>x.remove());
 for(let k=0;k<9;k++){const o=document.createElement('span');o.className='orb';o.style.left=(7+k*11)+'%';o.style.top=(18+((k*29)%52))+'%';o.style.animationDelay=(k*.43)+'s';w.appendChild(o)}
 const f=$('friend');f.textContent=s.friend.e;f.style.left=s.friend.x+'%';f.style.top=s.friend.y+'%';f.className='friend'+(found[i]?' found':'');
 $('scene').textContent='Scène '+(i+1)+' / '+BOOK.scenes.length+(s.title?' · '+s.title:'');
 $('txt').textContent=s.text||'';
 $('hint').textContent=found[i]?('✔ '+s.friend.n+' is gevonden!'):('🔎 Zoek '+s.friend.n+'. Hint: '+(s.friend.hint||'kijk rustig door de wereld.'));
 $('bar').style.width=Math.round((i+1)/BOOK.scenes.length*100)+'%';
 $('score').textContent=Object.keys(found).length+'/'+BOOK.scenes.length+' vrienden';
 $('prev').disabled=i===0;$('next').textContent=i===BOOK.scenes.length-1?'🏁 einde':'volgende →';
}
function point(e){const r=$('world').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100,cx:e.clientX-r.left,cy:e.clientY-r.top}}
$('world').addEventListener('click',e=>{
 if(e.target.closest('.panel'))return;const p=point(e),s=BOOK.scenes[i];
 const rp=document.createElement('span');rp.className='ripple';rp.style.left=p.cx+'px';rp.style.top=p.cy+'px';$('world').appendChild(rp);setTimeout(()=>rp.remove(),600);
 const d=Math.hypot(p.x-s.friend.x,p.y-s.friend.y);
 if(d<8&&!found[i]){found[i]=1;sparks++;render();speak('Ja! Je vond '+s.friend.n);chime(true);toast('✨ '+s.friend.n+' gevonden!');
  for(let k=0;k<9;k++)setTimeout(()=>{const sp=document.createElement('span');sp.className='spark';sp.style.left=(p.cx+(Math.random()*90-45))+'px';sp.style.top=(p.cy+(Math.random()*65-32))+'px';$('world').appendChild(sp);setTimeout(()=>sp.remove(),800)},k*45);
 }else{if(d<15)toast('warm… bijna!');else if(d<25)toast('lauw… kijk verder');chime(false)}
});
$('prev').onclick=()=>{if(i>0){i--;render()}};
$('next').onclick=()=>{if(i<BOOK.scenes.length-1){i++;render()}else finish()};
$('read').onclick=()=>speak(BOOK.scenes[i].text+' '+$('hint').textContent);
$('voice').onclick=()=>{voice=!voice;$('voice').textContent=voice?'🔊 voorlezen aan':'🔇 voorlezen uit';if(!voice)try{speechSynthesis.cancel()}catch(e){}};
$('restart').onclick=()=>{i=0;found={};$('ov').style.display='none';render()};
function finish(){const n=Object.keys(found).length,total=BOOK.scenes.length;$('card').innerHTML='<div class="cup">'+(n===total?'🏆':'📖')+'</div><h2>'+esc(BOOK.title)+'</h2><p>Je vond '+n+' van de '+total+' vrienden en ontdekte de levende verhaalwereld.</p><button id="again">nog een keer</button><button id="missing" style="background:#1b2d47;color:#fff">terug naar het verhaal</button>';$('ov').style.display='flex';$('again').onclick=$('restart').onclick;$('missing').onclick=()=>$('ov').style.display='none'}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});
loadBook();
</script></body></html>
