<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2B AIRDRUMS — drum in de lucht</title>
<style>
:root{--bg:#0a120e;--kaart:#101c15;--groen:#35d07f;--tekst:#e8f5ec;--dim:#8fb59c;--rand:#1e3a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tekst);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
h1{color:var(--groen);font-size:1.9rem;letter-spacing:2px}
.sub{color:var(--dim);margin:4px 0 16px}
.kaart{background:var(--kaart);border:1px solid var(--rand);border-radius:14px;padding:16px;width:100%;max-width:720px;margin-bottom:14px}
#stage{position:relative;width:100%;border-radius:10px;overflow:hidden;background:#000}
video,#padlaag{width:100%;display:block;transform:scaleX(-1)}
#padlaag{position:absolute;inset:0}
.rij{display:flex;gap:12px;flex-wrap:wrap}.rij>div{flex:1;min-width:140px}
label{display:block;color:var(--dim);font-size:.75rem;margin:12px 0 4px;text-transform:uppercase;letter-spacing:1px}
select,input[type=range]{width:100%;padding:8px;background:#0c1811;border:1px solid var(--rand);border-radius:8px;color:var(--tekst)}
button{padding:12px 18px;background:var(--groen);color:#04120a;border:0;border-radius:10px;font-weight:700;cursor:pointer}
button.sec{background:#163526;color:var(--groen)}
#status{color:var(--dim);font-size:.85rem;margin-top:8px;text-align:center}
.meter{height:10px;background:#0c1811;border-radius:5px;overflow:hidden;margin-top:4px}
.meter>div{height:100%;width:0;background:var(--groen);transition:width .05s}
.padlabel{position:absolute;color:#fff;font-weight:800;font-size:.9rem;text-shadow:0 1px 4px #000;pointer-events:none;transform:translate(-50%,-50%)}
.tip{color:var(--dim);font-size:.8rem;margin-top:6px}
</style>
</head>
<body>
<h1>G2B AIRDRUMS</h1>
<p class="sub">Beweeg je hand door een vak → die drum klinkt + MIDI naar je DAW</p>

<div class="kaart">
  <div id="stage">
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="padlaag"></canvas>
  </div>
  <div id="status">Camera staat nog uit</div>
</div>

<div class="kaart">
  <div class="rij">
    <div><label>Gevoeligheid</label><input type="range" id="sens" min="4" max="40" value="14"></div>
    <div><label>Geluid</label><select id="snd"><option value="aan">AAN (eigen sounds)</option><option value="uit">UIT (alleen MIDI)</option></select></div>
    <div><label>MIDI-uitgang</label><select id="midi"><option value="">— geen —</option></select></div>
  </div>
  <div class="rij" style="margin-top:14px">
    <button id="start">▶ START CAMERA</button>
    <button class="sec" id="cal">KALIBREER (stilstaan 2s)</button>
  </div>
  <div class="rij" style="margin-top:12px">
    <div>KICK<meter class="meter"><div id="m0"></div></meter></div>
    <div>SNARE<meter class="meter"><div id="m1"></div></meter></div>
    <div>HAT<meter class="meter"><div id="m2"></div></meter></div>
    <div>CLAP<meter class="meter"><div id="m3"></div></meter></div>
  </div>
</div>
<p class="tip">MIDI-kanalen: GM-drums (kick 36 · snare 38 · clap 39 · hat 42, kanaal 10). Chrome → MIDI-apparaat kiezen → Reason pakt 'm als extern MIDI.</p>

<script>
const $=id=>document.getElementById(id);
const PADS=[
 {n:'KICK', x:.25,y:.75,note:36,col:'#35d07f'},
 {n:'SNARE',x:.75,y:.75,note:38,col:'#ff9a3c'},
 {n:'HAT',  x:.25,y:.28,note:42,col:'#b98cff'},
 {n:'CLAP', x:.75,y:.28,note:39,col:'#f5e9c8'},
];
const PW=.30,PH=.34; // padbreedte/-hoogte als fractie
let ac=null,midiOut=null,prev=null,base=[0,0,0,0],cool=[0,0,0,0],run=false;
const LW=160,LH=120; // analyse-resolutie
const off=document.createElement('canvas');off.width=LW;off.height=LH;
const octx=off.getContext('2d',{willReadFrequently:true});

// --- eigen drum-synth (geen samples nodig) ---
function ensureAC(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}
function noiseBuf(){if(!noiseBuf.b){const b=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noiseBuf.b=b;}return noiseBuf.b;}
function playKick(v){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(48,t+.09);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.32);
  const n=ac.createBufferSource();n.buffer=noiseBuf();const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=4000;
  const g2=ac.createGain();g2.gain.setValueAtTime(v*.4,t);g2.gain.exponentialRampToValueAtTime(.001,t+.02);
  n.connect(f).connect(g2).connect(ac.destination);n.start(t);n.stop(t+.03);}
function playSnare(v){const t=ac.currentTime,n=ac.createBufferSource();n.buffer=noiseBuf();
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=.8;
  const g=ac.createGain();g.gain.setValueAtTime(v*.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
  n.connect(f).connect(g).connect(ac.destination);n.start(t);n.stop(t+.2);
  const o=ac.createOscillator(),g2=ac.createGain();o.frequency.value=190;
  g2.gain.setValueAtTime(v*.5,t);g2.gain.exponentialRampToValueAtTime(.001,t+.09);
  o.connect(g2).connect(ac.destination);o.start(t);o.stop(t+.1);}
function playHat(v){const t=ac.currentTime,n=ac.createBufferSource();n.buffer=noiseBuf();
  const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=8000;
  const g=ac.createGain();g.gain.setValueAtTime(v*.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  n.connect(f).connect(g).connect(ac.destination);n.start(t);n.stop(t+.06);}
function playClap(v){const t=ac.currentTime;
  for(let i=0;i<3;i++){const n=ac.createBufferSource();n.buffer=noiseBuf();
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=1.5;
    const g=ac.createGain(),tt=t+i*.012;
    g.gain.setValueAtTime(v*.6,tt);g.gain.exponentialRampToValueAtTime(.001,tt+.09);
    n.connect(f).connect(g).connect(ac.destination);n.start(tt);n.stop(tt+.1);}}
const HIT=[playKick,playSnare,playHat,playClap];

// --- MIDI ---
async function setupMIDI(){
  try{
    const m=await navigator.requestMIDIAccess();
    const sel=$('midi');sel.innerHTML='<option value="">— geen —</option>';
    for(const o of m.outputs.values()){const op=document.createElement('option');op.value=o.id;op.textContent=o.name;sel.appendChild(op);}
    if(sel.options.length>1)sel.selectedIndex=1;
    sel.onchange=()=>{midiOut=sel.value?m.outputs.get(sel.value):null};
    sel.onchange();
  }catch(e){/* geen midi, prima */}
}
function sendMidi(note,vel){if(midiOut)midiOut.send([0x99,note,Math.min(127,vel)],performance.now());}

// --- detectie ---
function zoneEnergies(){
  octx.drawImage($('cam'),0,0,LW,LH);
  const cur=octx.getImageData(0,0,LW,LH).data;
  const E=[0,0,0,0];
  if(prev){
    for(let z=0;z<4;z++){
      const p=PADS[z],x0=Math.floor((p.x-PW/2)*LW),x1=Math.floor((p.x+PW/2)*LW),
            y0=Math.floor((p.y-PH/2)*LH),y1=Math.floor((p.y+PH/2)*LH);
      let s=0;
      for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
        const i=(y*LW+x)*4;
        s+=Math.abs(cur[i]-prev[i])+Math.abs(cur[i+1]-prev[i+1])+Math.abs(cur[i+2]-prev[i+2]);}
      E[z]=s/((x1-x0)*(y1-y0)*3*255); // 0..1
    }
  }
  prev=cur;
  return E;
}
function tick(){
  if(!run)return;
  const E=zoneEnergies(),sens=$('sens').value/100,now=performance.now();
  for(let z=0;z<4;z++){
    const e=Math.max(0,E[z]-base[z]);
    $('m'+z).style.width=Math.min(100,e*300)+'%';
    if(e>sens&&now-cool[z]>140){
      cool[z]=now;const v=Math.min(1,e*6);
      if($('snd').value==='aan')HIT[z](v);
      sendMidi(PADS[z].note,40+v*87);
      flash(z);
    }
  }
  drawPads();
  requestAnimationFrame(tick);
}
let fl=[0,0,0,0];
function flash(z){fl[z]=performance.now();}
function drawPads(){
  const c=$('padlaag'),st=$('stage');
  if(c.width!==st.clientWidth){c.width=st.clientWidth;c.height=st.clientHeight;}
  const ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);
  for(let z=0;z<4;z++){
    const p=PADS[z],x=(1-p.x)*W,y=p.y*H,w=PW*W,h=PH*H; // gespiegeld
    const on=performance.now()-fl[z]<120;
    ctx.strokeStyle=p.col;ctx.lineWidth=on?4:2;ctx.globalAlpha=on?1:.55;
    ctx.strokeRect(x-w/2,y-h/2,w,h);
    if(on){ctx.fillStyle=p.col;ctx.globalAlpha=.3;ctx.fillRect(x-w/2,y-h/2,w,h);}
    ctx.globalAlpha=1;ctx.fillStyle=p.col;ctx.font='800 '+(W*0.025)+'px Segoe UI';
    ctx.textAlign='center';ctx.fillText(p.n,x,y-h/2-8);
  }
}
$('start').onclick=async()=>{
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});
    $('cam').srcObject=s;ensureAC();setupMIDI();
    run=true;tick();
    $('status').textContent='Camera loopt — stilstaan + KALIBREER, dan drummen!';
    $('start').textContent='■ STOP';
    $('start').onclick=()=>{run=false;s.getTracks().forEach(t=>t.stop());
      $('status').textContent='Camera uit';$('start').textContent='▶ START CAMERA';
      $('start').onclick=()=>location.reload();};
  }catch(e){$('status').textContent='Geen camera-toegang — sta toe en probeer opnieuw.';}
};
$('cal').onclick=()=>{
  $('status').textContent='Stilstaan… kalibreren';
  setTimeout(()=>{const E=zoneEnergies();base=E.map(x=>x*1.4);
    $('status').textContent='✓ Gekalibreerd — ga drummen!';},2000);
};
// testhaak: simuleer hit zonder camera
window.__airTest=z=>{ensureAC();HIT[z](0.8);sendMidi(PADS[z].note,100);return 'ok'};
</script>
</body>
</html>
