<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2B Live — GOOD2BETTER</title>
<link rel="icon" href="../media/logo.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0f0d;color:#e8f0ea;font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #1d2b22}
  header img{height:34px}
  header .brand{font-weight:700;letter-spacing:2px;color:#3ddc84}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  h1{font-size:clamp(20px,4vw,34px);margin-bottom:8px}
  .sub{color:#9fb3a6;margin-bottom:26px;max-width:560px}
  .livebadge{display:none;align-items:center;gap:8px;background:#c62828;color:#fff;font-weight:700;padding:6px 14px;border-radius:20px;font-size:13px;letter-spacing:1px;margin-bottom:14px}
  .livebadge .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:p 1.1s infinite}
  @keyframes p{50%{opacity:.25}}
  .count{display:flex;gap:14px;margin:10px 0 22px}
  .count .u{background:#131a16;border:1px solid #233628;border-radius:10px;padding:14px 10px;min-width:76px}
  .count .n{font-size:30px;font-weight:700;color:#3ddc84;font-variant-numeric:tabular-nums}
  .count .l{font-size:11px;color:#7d937f;letter-spacing:1px;margin-top:4px}
  .player{width:min(920px,94vw);aspect-ratio:16/9;background:#000;border:1px solid #233628;border-radius:14px;overflow:hidden;display:none;position:relative}
  .player video{width:100%;height:100%}
  .choice{position:absolute;left:0;right:0;bottom:18%;display:none;justify-content:center;flex-wrap:wrap;gap:20px;padding:0 20px}
  .choice button{background:rgba(61,220,132,.92);color:#0b0f0d;border:none;font-weight:700;font-size:clamp(14px,2.4vw,19px);padding:14px 26px;border-radius:10px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.6);transition:transform .15s}
  .choice button:hover{transform:scale(1.06)}
  .choice .pick{color:#fff;font-size:12px;width:100%;text-align:center;margin-bottom:8px;letter-spacing:1px}
  .note{margin-top:20px;color:#9fb3a6;font-size:14px;max-width:560px}
  .ticket{display:inline-block;margin-top:14px;background:#3ddc84;color:#0b0f0d;font-weight:700;padding:11px 22px;border-radius:8px;text-decoration:none}
  .over{display:none;margin-top:18px;color:#c9a227;font-size:15px}
  footer{padding:14px;text-align:center;color:#4b5c4f;font-size:12px;border-top:1px solid #1d2b22}
</style>
</head>
<body>
<header><img src="../media/logo.png" onerror="this.style.display='none'"><span class="brand">GOOD2BETTER · LIVE</span></header>
<main>
  <div class="livebadge" id="live"><span class="dot"></span>LIVE</div>
  <h1 id="title">G2B Live</h1>
  <p class="sub" id="when"></p>
  <div class="count" id="count">
    <div class="u"><div class="n" id="d">0</div><div class="l">DAGEN</div></div>
    <div class="u"><div class="n" id="h">00</div><div class="l">UREN</div></div>
    <div class="u"><div class="n" id="m">00</div><div class="l">MIN</div></div>
    <div class="u"><div class="n" id="s">00</div><div class="l">SEC</div></div>
  </div>
  <div class="player" id="playerbox"><video id="vid" controls playsinline></video>
    <div class="choice" id="choice">
      <div class="pick">KIES JE PAD:</div>
      <button id="ca" onclick="pick(0)"></button>
      <button id="cb" onclick="pick(1)"></button>
    </div>
  </div>
  <p class="note" id="note"></p>
  <a class="ticket" id="ticket" target="_blank" style="display:none">KOOP JE TICKET</a>
  <p class="over" id="over">Deze sessie is afgelopen — replay volgt / check de winkel voor de volgende.</p>
</main>
<footer>GOOD2BETTER · eigen live-platform · geen YouTube, geen tussenpartij</footer>
<script>
let cfg, startT, vid;
fetch('live.json').then(r=>r.json()).then(c=>{
  cfg=c;
  document.getElementById('title').textContent=c.title||'G2B Live';
  document.getElementById('note').textContent=c.note||'';
  if(c.ticket){const t=document.getElementById('ticket');t.href=c.ticket;t.style.display='inline-block'}
  startT=new Date(c.start).getTime();
  const d=new Date(startT);
  document.getElementById('when').textContent='Start: '+d.toLocaleString('nl-NL',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+' — wie later binnenkomt stapt midden in de sessie, zoals echt live.';
  vid=document.getElementById('vid');
  tick(); setInterval(tick,1000);
}).catch(()=>{document.getElementById('when').textContent='Geen sessie gepland — check later opnieuw.'});

function tick(){
  const now=Date.now(), diff=startT-now;
  if(diff>0){
    const dd=Math.floor(diff/864e5), hh=Math.floor(diff%864e5/36e5),
          mm=Math.floor(diff%36e5/6e4), ss=Math.floor(diff%6e4/1e3);
    d.textContent=dd; h.textContent=String(hh).padStart(2,'0');
    m.textContent=String(mm).padStart(2,'0'); s.textContent=String(ss).padStart(2,'0');
  } else { goLive(); }
}

let started=false, shownChoices={};
function goLive(){
  if(started)return; started=true;
  document.getElementById('count').style.display='none';
  document.getElementById('live').style.display='inline-flex';
  const tk=document.getElementById('ticket'); if(tk)tk.style.display='none';
  if(!cfg.video){document.getElementById('over').style.display='block';document.getElementById('over').textContent='De sessie is gestart — video-link volgt zo.';return}
  document.getElementById('playerbox').style.display='block';
  vid.src=cfg.video;
  const off=(Date.now()-startT)/1000;
  vid.addEventListener('loadedmetadata',()=>{ if(off<vid.duration){vid.currentTime=off}else{vid.currentTime=0} });
  vid.play().catch(()=>{});
  vid.addEventListener('timeupdate',checkChoices);
  vid.addEventListener('ended',()=>{
    document.getElementById('live').style.display='none';
    document.getElementById('choice').style.display='none';
    document.getElementById('over').style.display='block';
  });
}

function checkChoices(){
  if(!cfg.choices||!cfg.choices.length)return;
  for(let i=0;i<cfg.choices.length;i++){
    const c=cfg.choices[i];
    if(!shownChoices[i] && vid.currentTime>=c.at && vid.currentTime<c.at+8){
      shownChoices[i]=true;
      currentChoice=c;
      document.getElementById('ca').textContent=c.a.label;
      document.getElementById('cb').textContent=c.b.label;
      document.getElementById('choice').style.display='flex';
      vid.pause();
      choiceTimer=setTimeout(()=>{pick(0)},(c.timeout||10)*1000);
      return;
    }
  }
}

let currentChoice=null,choiceTimer=null;
function pick(n){
  if(!currentChoice)return;
  const c=n===0?currentChoice.a:currentChoice.b;
  if(choiceTimer){clearTimeout(choiceTimer);choiceTimer=null}
  document.getElementById('choice').style.display='none';
  currentChoice=null;
  if(c.video && c.video!==vid.src){
    vid.src=c.video;
    vid.currentTime=c.skip||0;
  }
  vid.play().catch(()=>{});
}

</script>
</body>
</html>
