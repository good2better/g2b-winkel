<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedankt — G2B Winkel</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230D0F0E'/><text x='50' y='68' font-size='52' font-weight='bold' text-anchor='middle' fill='%232FBF71' font-family='sans-serif'>G2</text></svg>">
<style>
:root{
  --bg:#0d0f0e; --panel:#171a19; --panel2:#1e2221; --line:#2a2f2d;
  --txt:#e8ecea; --dim:#8fa098; --accent:#2fbf71; --accent2:#1d7a48;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font:15px/1.6 'Segoe UI',system-ui,sans-serif;min-height:100vh;
  display:flex;flex-direction:column}
header{border-bottom:1px solid var(--line);background:var(--panel);
  padding:20px;text-align:center}
.logo{font-size:clamp(20px,4vw,26px);font-weight:800;letter-spacing:2px}
.logo b{color:var(--accent)}
main{flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px 16px}
.card{background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:34px 30px;max-width:480px;width:100%;
  text-align:center}
.vinkje{width:64px;height:64px;border-radius:50%;background:var(--accent);
  color:#04120a;font-size:32px;font-weight:800;display:flex;
  align-items:center;justify-content:center;margin:0 auto 16px}
h1{font-size:22px;margin-bottom:6px}
.sub{color:var(--dim);font-size:14px}
.prod{display:flex;gap:12px;align-items:center;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:12px;
  margin:20px 0;text-align:left}
.prod img{width:56px;height:56px;border-radius:8px;object-fit:cover;
  border:1px solid var(--line);flex:none}
.prod .t{font-weight:700}
.prod .l{color:var(--dim);font-size:12.5px}
.knop{display:block;background:var(--accent);color:#04120a;
  font-weight:800;font-size:16px;padding:14px 20px;border-radius:10px;
  text-decoration:none;margin-top:6px}
.knop:hover{filter:brightness(1.12)}
.klein{color:var(--dim);font-size:12px;margin-top:18px}
.klein a{color:var(--accent)}
.fout .vinkje{background:#bf5b2f;color:#fff}
footer{text-align:center;color:var(--dim);font-size:12px;
  padding:18px;border-top:1px solid var(--line)}
footer b{color:var(--accent)}
</style>
</head>
<body>
<header><div class="logo">G2B <b>WINKEL</b></div></header>
<main>
  <div class="card" id="kaart">
    <div class="vinkje">…</div>
    <h1>Even laden</h1>
    <div class="sub">Je download wordt opgehaald…</div>
  </div>
</main>
<footer>Gebouwd door <b>Good2Better</b> — eigen winkel, geen commissie.</footer>
<script type="module">
const kaart = document.getElementById("kaart");
const esc = s => String(s || "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fout() {
  kaart.classList.add("fout");
  kaart.innerHTML = `
    <div class="vinkje">!</div>
    <h1>Link niet gevonden</h1>
    <div class="sub">Deze download-link is niet geldig (meer) of de
      winkel is nog niet opnieuw gepubliceerd.</div>
    <div class="klein">Net gekocht en toch deze melding? Mail naar de
      winkel via de contactgegevens op de site — je betaling is je
      bewijs, je krijgt je bestand.</div>`;
}

// accentkleur van de winkel overnemen (mislukt = groen default)
try {
  const c = await (await fetch("products.json", { cache: "no-store" })).json();
  if (c.accent)
    document.documentElement.style.setProperty("--accent", c.accent);
  if (c.accent2)
    document.documentElement.style.setProperty("--accent2", c.accent2);
} catch { /* groene huisstijl is prima */ }

async function laden() {
  const k = new URLSearchParams(location.search).get("k") || "";
  if (!/^[a-z0-9]{4,32}$/i.test(k)) { fout(); return; }
  let info;
  try {
    const r = await fetch(`d/${k}/info.json`, { cache: "no-store" });
    if (!r.ok) throw 0;
    info = await r.json();
  } catch { fout(); return; }

  const href = info.url || `d/${k}/${encodeURIComponent(info.bestand)}`;
  const extern = !!info.url;
  // bundel: info.bestanden = [{naam, url}] → één knop per bestand
  const knoppen = info.bestanden ? info.bestanden.map(b => {
    const h = b.url || `d/${k}/${encodeURIComponent(b.bestand)}`;
    const ex = !!b.url;
    return `<a class="knop" href="${esc(h)}" ${ex ? 'target="_blank" rel="noopener"' : "download"}>
      ⬇ ${esc(b.naam || "DOWNLOAD")}</a>`;
  }).join("") : `<a class="knop" href="${esc(href)}" ${extern ? 'target="_blank" rel="noopener"' : "download"}>
      ⬇ DOWNLOAD</a>`;
  kaart.innerHTML = `
    <div class="vinkje">✓</div>
    <h1>Bedankt voor je aankoop!</h1>
    <div class="sub">Je betaling is gelukt — hier is je download.</div>
    <div class="prod">
      ${info.cover ? `<img src="${esc(info.cover)}" alt="">` : ""}
      <div>
        <div class="t">${esc(info.titel)}</div>
        <div class="l">${esc(info.licentie || "")}</div>
      </div>
    </div>
    ${knoppen}
    <div class="klein">Bewaar deze link — hij is jouw persoonlijke
      download. Werkt de knop niet? Rechtermuisknop → "link opslaan als".
      <br><a href="index.html">← terug naar de winkel</a></div>`;
  document.title = `Bedankt — ${info.titel || "G2B"}`;
}
laden();
</script>
</body>
</html>
