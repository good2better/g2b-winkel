<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEL JE BRIEFING — G2B Sync</title>
<style>
  :root{--g:#2fbf71;--bg:#0d0f0e;--card:#141816;--tx:#e8eae8;--mut:#9aa39c}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
  .wrap{max-width:640px;margin:0 auto}
  h1{color:var(--g);font-size:1.5rem;letter-spacing:1px;margin-bottom:4px}
  .sub{color:var(--mut);font-size:.85rem;margin-bottom:18px}
  label{display:block;font-size:.75rem;color:var(--mut);margin:14px 0 5px;letter-spacing:.5px}
  input,select,textarea{width:100%;background:#0a0c0b;border:1px solid #26302a;border-radius:8px;color:var(--tx);padding:10px 12px;font-size:.95rem}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{padding:6px 12px;border:1px solid #26302a;border-radius:20px;font-size:.78rem;cursor:pointer;color:var(--mut);background:transparent}
  .pill.on{background:var(--g);color:#08110c;border-color:var(--g);font-weight:700}
  button.send{width:100%;margin-top:22px;background:var(--g);color:#08110c;border:0;border-radius:10px;padding:14px;font-size:1rem;font-weight:800;letter-spacing:1px;cursor:pointer}
  .back{display:inline-block;margin-top:14px;color:var(--mut);font-size:.8rem;text-decoration:none}
  .note{font-size:.72rem;color:#5c665f;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>STEL JE BRIEFING</h1>
  <p class="sub">Vertel wat je zoekt — je krijgt een track op maat of een passende licentie binnen 48 uur.</p>

  <label>WAT VOOR PROJECT?</label>
  <select id="ptype">
    <option>Film / documentaire</option><option>Reclame / commercial</option><option>Game / app</option>
    <option>YouTube / social content</option><option>TV / serie</option><option>Podcast / radio</option>
    <option>Song / artist-track</option><option>Anders</option>
  </select>

  <label>STEMMING / MOOD (meerdere mogelijk)</label>
  <div class="pills" id="moods"></div>

  <div class="row">
    <div><label>GENRE</label>
      <select id="genre"><option>kies…</option><option>soca</option><option>bubbling</option><option>kaseko</option><option>winti</option><option>kawina</option><option>afro</option><option>dancehall</option><option>dembow</option><option>drill</option><option>trap</option><option>house</option><option>boombap</option><option>rnb</option><option>lofi</option><option>cinematic</option><option>epic / trailer</option><option>uplifting</option><option>anders</option></select></div>
    <div><label>TEMPO (BPM)</label><input id="bpm" type="number" min="60" max="180" placeholder="bijv. 100"></div>
  </div>

  <div class="row">
    <div><label>LENGTE</label>
      <select id="dur"><option>0:15 (spot)</option><option>0:30 (spot)</option><option>0:60 (spot)</option><option>volledige track</option><option>loop</option></select></div>
    <div><label>DEADLINE</label><input id="deadline" type="date"></div>
  </div>

  <label>VOCAL OF INSTRUMENTAAL</label>
  <select id="vocal"><option>Instrumentaal</option><option>Met vocals</option><option>Weet ik nog niet</option></select>

  <label>LICENTIE-TYPE</label>
  <select id="lic"><option>Buy-out / exclusief (jouw advies)</option><option>Niet-exclusieve licentie</option><option>Sync op maat (opdracht)</option><option>Lease (mp3/wav)</option></select>

  <label>JE BRIEFING — referenties, scene-beschrijving, wensen</label>
  <textarea id="brief" rows="5" placeholder="Bijv: 30-sec reclame voor sportmerk, energiek maar niet te hard, drop op 0:20..."></textarea>

  <label>JE E-MAIL / CONTACT</label>
  <input id="contact" type="email" placeholder="naam@studio.nl">

  <button class="send" onclick="verstuur()">VERSTUUR BRIEFING ✉</button>
  <a class="back" href="library.html">← terug naar de sync library</a>
  <p class="note">100% eigenaar — geen samples, geen AI, geen derden. One-stop clearance: één handtekening en je bent klaar.</p>
</div>
<script>
const EV_SCRIPT_URL='https://script.google.com/macros/s/AKfycbycpTfDAoXZz5UPC5nSCgq7jTi7i60yhhHOaa0OBbQlD9l1KCz3mvCefgU94tshrM8r/exec'; // <- plak hier je Apps Script /exec URL (zelfde als index.html)
const MOODS=["donker","vrolijk","energisch","chill","episch","spannend","liefde","feest","triest","hoopvol","agressief","dromerig","mysterieus","trots","horror","kinder","zakelijk","sport"];
const el=document.getElementById('moods');
MOODS.forEach(m=>{const b=document.createElement('button');b.className='pill';b.textContent=m;b.onclick=()=>b.classList.toggle('on');el.appendChild(b);});
async function verstuur(){
  const g=id=>document.getElementById(id).value;
  const sel=[...document.querySelectorAll('.pill.on')].map(b=>b.textContent).join(', ')||'—';
  const data={ptype:g('ptype'),moods:sel,genre:g('genre'),bpm:g('bpm')||'—',dur:g('dur'),deadline:g('deadline')||'—',vocal:g('vocal'),licentie:g('lic'),brief:g('brief')||'—',contact:g('contact')||'—'};
  if(EV_SCRIPT_URL){
    try{
      await fetch(EV_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({email:data.contact,bron:'sync-briefing',tijd:new Date().toISOString(),extra:data})});
      document.querySelector('.send').textContent='✅ BRIEFING VERSTUURD — binnen 48u reactie';
      document.querySelector('.send').disabled=true;
      return;
    }catch(_){/* val terug op mailto */}
  }
  const body=`NIEUWE SYNC-BRIEFING via g2b-winkel\n`+'='.repeat(40)+`\n\nProject-type: ${data.ptype}\nMood: ${data.moods}\nGenre: ${data.genre}\nTempo: ${data.bpm} BPM\nLengte: ${data.dur}\nDeadline: ${data.deadline}\nVocal: ${data.vocal}\nLicentie: ${data.licentie}\n\nBRIEFING:\n${data.brief}\n\nCONTACT: ${data.contact}`;
  location.href=`mailto:g.sandvliet88@gmail.com?subject=${encodeURIComponent('SYNC-BRIEFING — '+data.ptype)}&body=${encodeURIComponent(body)}`;
}
</script>
</body>
</html>
